# Optional local hooks: `pre-commit install`. They run the same commands as
# CI through uv, so the versions come from uv.lock, not from here.
# actionlint and gitleaks run when installed (brew install actionlint gitleaks).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: fixtures
        name: fixtures are the generator's output
        entry: uv run --frozen python tools/fixtures/generate.py --check
        language: system
        files: ^(tools/fixtures/|wowstats/|tests/data/|tests/analysis/)
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
