name: Bug
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem? Don't file it here: use **Report a vulnerability** (SECURITY.md).
        Leave out real share links (`/zogzog/#...`), keys, tokens, passwords and account names.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`wow-stats --version`, or the image tag (and digest if you pinned one)."
      placeholder: "wow-stats 0.9.0"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How it runs
      options:
        - The compose kit (deploy/compose)
        - Kubernetes or another orchestrator
        - "`uv run` on the host"
        - Other (say below)
    validations:
      required: true
  - type: dropdown
    id: shipper
    attributes:
      label: The shipper's machine
      options:
        - Mac
        - Windows
        - Not shipper-related
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Views and AUTH mode, optional parts on (MCP, several people, publish, renderer, exporter), reverse proxy.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Steps to reproduce, with made-up values.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines (the server logs no prices or secrets; check anyway).
      render: text
