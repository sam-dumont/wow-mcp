# OpenSSF Scorecard: how the repository rates on supply-chain practices
# (pinned actions, branch protection, token permissions...), published to
# api.scorecard.dev for the README badge and uploaded to the Security tab.
#
# Free for public repositories only; a private one needs GitHub Advanced
# Security. While the repository is private the job is skipped, so nothing
# is published about it. The visibility test fails closed.
#
# Publishing puts limits on this file (ossf/scorecard-action's README,
# "Workflow Restrictions"): no top-level env or defaults, no write
# permission at the workflow level, and only these actions in the job.
name: scorecard
on:
  push:
    branches: [main]
  # A changed ruleset changes the Branch-Protection score.
  branch_protection_rule:
  workflow_dispatch:
permissions: read-all

jobs:
  analysis:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      # The code-scanning upload.
      security-events: write
      # Publishing the results (the OIDC token proves which workflow ran).
      id-token: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
