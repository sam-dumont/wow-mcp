# Lint, tests and an image smoke test on GitHub-hosted runners. Actions are
# pinned by commit SHA (the comment is the tag it was taken from).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole workflow before it builds an image.
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # The suite in four parts side by side, whole test files each, split by
  # their measured time (tests/conftest.py --shard, tests/shard_times.json):
  # one job on a runner's 4 cores took 12 to 20 minutes and hit its limit on
  # main (2026-11-22). Three parts split by the hash of the path were 5, 12
  # and 17 minutes, and a slow runner cancelled the 17 at 20 (#235).
  # Rerun tools/shard_times.py when one part's time pulls away from the others.
  pytest:
    if: github.repository_id == '1464458020'
    runs-on: ubuntu-24.04
    # A hang (2026-11-19: the apt step of the browser install, 30 min) stops
    # here, not at GitHub's 6-hour default; a stuck test stops at --timeout
    # below. A part takes 8 to 9 minutes, setup included: room for a runner
    # twice as slow.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags: tests/test_shipper_upgrade.py runs the v0.6.1
          # shipper against this tree's server.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The publish extra: the static bundles' allow-list tests need it. The
      # mcp extra: FastMCP, which tests/mcp drives in memory and over HTTP. The
      # browser group: tests/test_browser.py drives the static sites in
      # Chromium (Plausible's payload, the icons, the tooltip on a phone),
      # and in WebKit too for the icons and the phone layout: the owner reads
      # it in Safari on an iPhone.
      # No browser tests here (owner, 2026-11-19): they are a gate run locally
      # before pushing (tests/test_*browser*.py skip without Playwright), and
      # installing Chromium and WebKit with their system packages was most of
      # this job's minutes, and hung for 30 minutes once.
      # The analysis extras: the server-side analysis' tests build both SDKs'
      # clients (credentials passed explicitly), on fake clients, no calls.
      - run: uv sync --frozen --extra publish --extra mcp --extra analysis --extra analysis-openai
      # Everything but the browser suites, on every core; docker compose and
      # Polestar tests (ci_only) are in, they skip without their tool.
      # --timeout: a test stuck past 5 minutes fails with its name and every
      # thread's stack (pytest-timeout), where a hang used to eat the job's 20
      # minutes and say nothing (part 2 on 4a1cacc, 2026-11-23). The slowest
      # takes about 20 s on a laptop. --durations 0: every test's time, which
      # tools/shard_times.py reads back from these logs to split the parts.
      - run: >-
          uv run pytest -q -rs -n auto -m "not browser" --timeout 300 --durations 0
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The required check: the parts' result, then what needs the whole tree
  # once. It runs when a part failed too (a skipped required check would
  # count as passed).
  test:
    if: ${{ !cancelled() && github.repository_id == '1464458020' }}
    needs: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: every part of the suite passed
        run: test "${{ needs.pytest.result }}" = success
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra publish --extra mcp --extra analysis --extra analysis-openai
      - run: uv run ruff check .
      # The fixtures are made by tools/fixtures/generate.py: a change to it, or
      # to the code that derives them, without a rerun fails here.
      - run: uv run python tools/fixtures/generate.py --check
      - run: for f in web/*.js web/model3d/model3d.js web/model3d/view.js; do node --check "$f"; done

  # wowstats/logsql.py answers most of the views' LogsQL in Python; every
  # other test's "VictoriaLogs" is that same engine. Here both answer the
  # same queries over the same rows, VictoriaLogs being the image the compose
  # kit pins, with its flags (both read from compose.yaml, so a bump there
  # is tested here). A step rather than `services:`, which can't pass flags:
  # VictoriaLogs' default 7-day retention would drop the test rows on arrival.
  logsql:
    if: github.repository_id == '1464458020'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: VictoriaLogs, as the compose kit runs it
        run: |
          set -eu
          image=$(sed -n 's|^ *image: \(docker.io/victoriametrics/victoria-logs:.*@sha256:.*\)$|\1|p' deploy/compose/compose.yaml)
          test -n "$image"
          mapfile -t flags < <(sed -n 's|^ *- \(-search\.[A-Za-z]*=[^ ]*\)$|\1|p' deploy/compose/compose.yaml)
          test "${#flags[@]}" -ge 3
          docker run -d --name vl -p 127.0.0.1:9428:9428 "$image" -retentionPeriod=100y "${flags[@]}"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:9428/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:9428/health || { docker logs vl; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The mcp extra: tests/test_ingest_fresh.py asks the MCP's tools too.
      - run: uv sync --frozen --extra mcp
      # WOW_TEST_VL_REQUIRED: an unreachable VictoriaLogs fails here, never skips.
      # test_ingest_fresh: an upload is on the page at once, VictoriaLogs'
      # own flush included (wowstats.eventstore.VictoriaLogs.flush).
      - run: uv run pytest -q -rs tests/test_logsql.py tests/test_ingest_fresh.py
        env:
          WOW_TEST_VL_URL: http://127.0.0.1:9428
          WOW_TEST_VL_REQUIRED: "1"

  audit:
    if: github.repository_id == '1464458020'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads every commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Tools
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tgz" | sha256sum -c -
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz -C bin actionlint
          tar -xzf gitleaks.tgz -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secrets (tree and history)
        run: |
          gitleaks dir --no-banner --redact --config .gitleaks.toml .
          gitleaks git --no-banner --redact --config .gitleaks.toml .
      - name: Workflows
        run: actionlint -color
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Known vulnerabilities in the locked dependencies
        run: uv run --frozen --only-group audit python tools/audit_deps.py

  # A friend's Windows path on a real Windows: the install line the app
  # hands out, the scheduled task, a ship to /ingest, the update, a reset and
  # the help's uninstall line, in Windows PowerShell 5.1 and PowerShell 7,
  # with a fresh Windows's execution policy and an accented profile folder,
  # and a 0.6.1 install updating itself (tests/test_windows_e2e.py). No harden-runner: it supports Linux only.
  windows:
    if: github.repository_id == '1464458020'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags: the 0.6.1 shipper's update to this tree runs here too.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra publish --extra mcp --extra analysis --extra analysis-openai
      - run: uv run pytest -v -rs -m ci_only tests/test_windows_e2e.py
        env:
          WOW_STATS_WINDOWS_E2E: "1"

  # A fork's pull request can't read the dhi.io credentials (secrets stay out
  # of forks' runs), so it can't pull the main image's base: the image job
  # skips there, and only there, with the notice below. Anywhere else a
  # missing credential fails the login step.
  image-fork:
    if: github.repository_id == '1464458020' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Image build skipped
        run: 'echo "::notice title=image::image build skipped: no dhi.io credentials, forks can''t read secrets"'

  image:
    if: github.repository_id == '1464458020' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The main image's base is a Docker Hardened Image (Dockerfile), and
      # dhi.io takes no anonymous pulls: a Docker Hub account's read-only
      # token, in the repository's Actions secrets and its Dependabot secrets
      # (Dependabot's pull requests get only those). release.yml passes them
      # here with `secrets: inherit`. A fork's pull request has neither: it
      # runs image-fork instead.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker build -t wow-stats:ci .
      - name: The renderer image starts Chromium (read-only root, uid 10001)
        run: |
          set -eu
          docker build --target renderer -t wow-stats-render:ci .
          # The main image has no Playwright. It has no shell either, so the check is Python's.
          docker run --rm --entrypoint python wow-stats:ci -c \
            "import importlib.util as u, shutil, sys; sys.exit(bool(u.find_spec('playwright') or shutil.which('playwright')))"
          docker run -d --name render --read-only --tmpfs /tmp -p 127.0.0.1:18083:8083 wow-stats-render:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18083/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18083/healthz || { docker ps -a; docker logs render; exit 1; }
          test "$(docker exec render id -u)" = 10001
          # POST /render needs the token the renderer made on first start
          # (RENDER_TOKEN_FILE unset): 401 without it, 400 for an empty job with it.
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -X POST -d '{}' http://127.0.0.1:18083/render)" = 401
          docker exec render cat /tmp/wow-stats-render/render.token | sed 's/^/Authorization: Bearer /' > "$RUNNER_TEMP/render.hdr"
          test "$(code -X POST -H "@$RUNNER_TEMP/render.hdr" -d '{}' http://127.0.0.1:18083/render)" = 400
          docker rm -f render
      - name: No model CLI in the image (the lab runs no LLM)
        run: docker run --rm --entrypoint python wow-stats:ci -c "import shutil, sys; sys.exit(bool(shutil.which('claude')))"
      # The runtime base (Dockerfile) has no shell and no system package
      # manager (pip stays: the hardened image ships it). A base or a stage
      # that brings one back fails here.
      - name: No shell or package manager in the main image
        run: |
          docker run --rm --entrypoint python wow-stats:ci -c \
            "import shutil, sys; found = [x for x in ('sh', 'bash', 'dash', 'ash', 'busybox', 'apk', 'apt', 'apt-get', 'dpkg') if shutil.which(x)]; print(found or 'none'); sys.exit(bool(found))"
      # The image has no checkout: wowstats is in site-packages and its data
      # under wowstats/data/. A path built from the checkout's layout finds
      # nothing there (kbloot gave no drops for The Drowned City).
      - name: Installed layout (bundled data found, dungeon drops resolve)
        run: |
          docker run --rm -v "$PWD/tools:/src/tools:ro" -v "$PWD/pyproject.toml:/src/pyproject.toml:ro" \
            --entrypoint python wow-stats:ci /src/tools/image_layout_check.py /src/pyproject.toml
      - name: Smoke test (read-only root, uid 10001, both views)
        run: |
          set -eu
          docker run --rm wow-stats:ci --version
          # The deployment shapes the app accepts (wowstats/guard.py): the
          # public view open to all on purpose (ALLOW_OPEN=1), the full view
          # behind a login proxy it knows by a shared secret (PROXY_SECRET_FILE).
          s=$(mktemp -d); chmod 755 "$s"
          head -c 32 /dev/urandom | base64 | tr -d '+/=' > "$s/proxy.secret"
          chmod 644 "$s/proxy.secret"
          echo "X-Proxy-Auth: $(cat "$s/proxy.secret")" > "$s/proxy.hdr"
          docker run -d --name ui-public --read-only --tmpfs /tmp -e VIEW=public -e AUTH=open -e ALLOW_OPEN=1 \
            -p "127.0.0.1:0:8080" wow-stats:ci ui
          docker run -d --name ui-full --read-only --tmpfs /tmp -v "$s:/run/s:ro" -e VIEW=full -e AUTH=proxy \
            -e PROXY_SECRET_FILE=/run/s/proxy.secret -p "127.0.0.1:0:8080" wow-stats:ci ui
          sleep 2
          for view in public full; do
            port=$(docker port "ui-$view" 8080 | head -1 | cut -d: -f2)
            curl -fsS "http://127.0.0.1:$port/healthz"
            # No `id` in the image (no coreutils): the process's own uid, from Python.
            test "$(docker exec "ui-$view" python -c 'import os; print(os.getuid())')" = 10001
          done
          pport=$(docker port ui-public 8080 | head -1 | cut -d: -f2)
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$pport/api/prices")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:$pport/mcp")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$pport/.well-known/oauth-authorization-server")" = 404
          fport=$(docker port ui-full 8080 | head -1 | cut -d: -f2)
          # Through the proxy (its secret) and no login yet: the login door.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "@$s/proxy.hdr" "http://127.0.0.1:$fport/full/")" = 302
          # Around the proxy, with or without an identity header: refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$fport/full/")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Forwarded-User: owner" "http://127.0.0.1:$fport/full/")" = 403
          docker rm -f ui-public ui-full
      # docs/self-host/demo.md's steps, with this image: the kit's ui, then
      # `docker compose run --rm demo` (the repository mounted read-only,
      # the docs site's demo character through /ingest), and the page lists him.
      - name: The compose kit's demo, end to end
        working-directory: deploy/compose
        env:
          WOW_STATS_IMAGE: wow-stats:ci
          INGEST_PASSWORD: demo-password-only
          MODEL3D: "off"
          WOW_ITEMS: "off"
          UI_PUBLISH: 127.0.0.1:18180
        run: |
          set -eu
          docker compose up -d ui
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:18180/healthz >/dev/null 2>&1 && break; sleep 1; done
          docker compose run --rm demo
          # The character shows once the first prebuilt build with data is
          # done: 28 s on a hosted runner (8 s on a laptop), so 30 s of polling
          # passed on main with a second to spare. Two minutes still catches a
          # demo that never lands.
          for _ in $(seq 1 120); do
            chars=$(curl -fsS http://127.0.0.1:18180/api/chars || true)
            echo "$chars" | grep -q '"Nibbet-Gearholt"' && break; sleep 1
          done
          echo "$chars" | grep -q '"Nibbet-Gearholt"' || { echo "$chars"; docker compose logs ui; exit 1; }
          docker compose down -v
      - name: Smoke test (several people, FastMCP on 8090 behind the tests' OIDC stand-in)
        run: |
          set -eu
          s=$(mktemp -d); chmod 755 "$s"; mkdir -m 777 "$s/state"
          head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=' > "$s/master.key"
          head -c 48 /dev/urandom > "$s/sign.key"
          docker run --rm -v "$PWD/tests:/src/tests:ro" -e PYTHONPATH=/src --entrypoint python wow-stats:ci \
            -c "from tests.mcp import oidc_standin as o; print(o.CLIENT_SECRET, end='')" > "$s/oidc.secret"
          echo '{"friend-sub": "mira"}' > "$s/friends.json"
          head -c 32 /dev/urandom | base64 | tr -d '+/=' > "$s/proxy.secret"
          chmod 644 "$s"/*.key "$s/oidc.secret" "$s/friends.json" "$s/proxy.secret"
          # The requests below play the login proxy: they carry its secret.
          echo "X-Proxy-Auth: $(cat "$s/proxy.secret")" > "$s/proxy.hdr"
          # The stand-in and the UI share one network namespace: the issuer
          # is loopback inside it, as the MCP's settings require for http.
          docker run -d --name net -p 127.0.0.1:18080:8080 -p 127.0.0.1:18090:8090 -v "$PWD/tests:/src/tests:ro" \
            -e PYTHONPATH=/src --read-only --tmpfs /tmp --entrypoint python wow-stats:ci \
            -c "import time; from tests.mcp.oidc_standin import Standin
          with Standin(user='friend-sub', org='org-friends', port=9999): time.sleep(600)"
          sleep 2
          docker run -d --name ui --network container:net --read-only --tmpfs /tmp -v "$s:/run/s" \
            -e VIEW=full -e AUTH=proxy -e PROXY_SECRET_FILE=/run/s/proxy.secret -e VL_URL=http://127.0.0.1:9 -e FRIENDS_VL_URL=http://127.0.0.1:9 \
            -e WOW_STATE_DIR=/run/s/state -e WOW_OWNER_SUB=owner-sub \
            -e WOW_FRIENDS_FILE=/run/s/friends.json -e PUBLIC_URL=http://127.0.0.1:18080 -e SITE_DOMAIN=m.example \
            -e ZOGZOG_MASTER_KEY_FILE=/run/s/master.key -e MODEL3D=off -e WOW_ITEMS=off \
            -e MCP_PUBLIC_URL=http://127.0.0.1:18090/mcp -e OIDC_ISSUER=http://127.0.0.1:9999 -e OIDC_CLIENT_ID=wow-app \
            -e OIDC_CLIENT_SECRET_FILE=/run/s/oidc.secret -e MCP_SIGNING_KEY_FILE=/run/s/sign.key \
            -e MCP_STATE_DIR=/run/s/state/mcp wow-stats:ci ui
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break; sleep 1; done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          friend=(-H "@$s/proxy.hdr" -H "X-Forwarded-User: friend-sub")
          test "$(code "${friend[@]}" http://127.0.0.1:18080/start)" = 200
          test "$(code -H "@$s/proxy.hdr" -H "X-Forwarded-User: stranger" http://127.0.0.1:18080/start)" = 403
          test "$(code -H "X-Forwarded-User: friend-sub" http://127.0.0.1:18080/start)" = 403
          test "$(code http://127.0.0.1:18080/install/update)" = 200
          test "$(code http://127.0.0.1:18080/privacy)" = 200
          test "$(code -H "@$s/proxy.hdr" http://127.0.0.1:18080/api/chars)" = 401
          test "$(code http://127.0.0.1:18080/api/chars)" = 403
          test "$(code -X POST "${friend[@]}" http://127.0.0.1:18080/mcp)" = 404
          test "$(code http://127.0.0.1:18090/.well-known/oauth-protected-resource/mcp)" = 200
          test "$(code http://127.0.0.1:18090/.well-known/oauth-authorization-server)" = 200
          test "$(code -X POST http://127.0.0.1:18090/mcp)" = 401
          docker rm -f ui net
