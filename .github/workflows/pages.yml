# The docs site (site/): the manual and the README as Starlight pages, plus
# the demo (site/pages/demo.md): an invented character's pages built by the
# product's own publisher, served under /demo/. Actions are pinned by commit
# SHA (the comment is the tag it was taken from).
#
# GitHub Pages on a private repository needs a paid plan, and a Pages site is
# public even when its repository is private: the deploy job runs only once
# the repository is public. Until then (and on pull requests) the built site
# is a workflow artifact, `site-preview`, to download and open locally.
# One-time setting before the first deploy: Settings > Pages > Source:
# GitHub Actions.
name: pages
on:
  # Every push to main: the demo is the product's own publisher and pages, so
  # any change to them can change it. Until 1.0 the site is built from main,
  # like immich-memories' docs.
  push:
    branches: [main]
  # A pull request builds the site only when the site's own sources change
  # (2026-11-19: every Dependabot and app PR built it, about 5 minutes each).
  pull_request:
    paths:
      - README.md
      - docs/**
      - site/**
      - tools/fixtures/**
      - tests/demo_models.py
      - tests/test_demo_complete_browser.py
      - web/model3d/**
      - web/app.js
      - web/items.js
      - wowstats/publish.py
      - wowstats/itemcard.py
      - wowstats/talents.py
      - wowstats/upstream.py
      - tools/docs_values.py
      - tools/polestar-tag
      - data/route-reference.json
      - .github/workflows/pages.yml
  # The demo's play is shifted so its last evening is yesterday: its auction
  # house only lists what a scan saw today or yesterday, so it is rebuilt
  # daily (once public; see the visibility job).
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # Called by release.yml once a release is published, from its tag: the
  # immich-memories pattern. release.yml publishes with GITHUB_TOKEN, whose
  # `release: published` starts no workflow, so it calls this one itself. The
  # release PR's merge already rebuilt the site from main; this run makes the
  # published site the released tree whatever merged meanwhile, after the
  # images and notes exist.
  workflow_call:
    inputs:
      ref:
        description: "The tag to build (release.yml passes v<version>)"
        type: string
        required: false
        default: ""
permissions:
  contents: read
# Keyed on what is built: the tag when release.yml calls this, else the ref.
# In a called workflow github.ref is the caller's (refs/heads/main), so keyed
# on it alone the release's call cancelled the release commit's own push run,
# and every release commit showed a cancelled pages run (0.8.0, 2026-11-23).
# The two build the same tree, so whichever deploys last is right; the deploy
# job's pages-deploy group below runs them one at a time.
concurrency:
  group: pages-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the repository is public. A scheduled run's event carries no
  # repository, so github.event.repository.private can't answer there.
  visibility:
    if: github.repository_id == '1464458020'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      public: ${{ steps.v.outputs.public }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          echo "public=$([[ $private == false ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: visibility
    # A private repository builds on pushes and pull requests (the preview),
    # not every day.
    if: github.repository_id == '1464458020' && (github.event_name != 'schedule' || needs.visibility.outputs.public == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          # Each page's "last updated" is its source's last commit
          # (site/scripts/prepare.mjs): a shallow clone dates every page today.
          fetch-depth: 0
      # Whether this build goes live. A published build must quote the released
      # image of its own version (tools/docs_values.py fails it otherwise), so
      # the push run of a release commit, built while release.yml still builds
      # the images, isn't published: release.yml calls this workflow once the
      # release exists. Before, that push run and the release's call both
      # deployed, the site said whatever the last one read, and a refused
      # GitHub call was a placeholder in the quick start (0.11.0, 2026-11-25).
      - name: Publish this build?
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC: ${{ needs.visibility.outputs.public }}
          CALLED_REF: ${{ inputs.ref }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          publish=false
          if [[ $PUBLIC == true && $GITHUB_REF == refs/heads/main && $GITHUB_EVENT_NAME != pull_request ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --jq .tag_name >/dev/null; then
              publish=true
            elif [[ -n $CALLED_REF ]]; then
              echo "::error::release.yml called this for $CALLED_REF, and v$version has no release"
              exit 1
            else
              echo "::notice::v$version isn't released yet: release.yml publishes the site once it is"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "DOCS_PUBLISH=$([[ $publish == true ]] && echo 1 || echo 0)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: uv sync --frozen --extra publish --extra mcp --extra render
      # The renderer draws the demo's pictures in Chromium (wowstats.renderer),
      # and the demo's guard test opens its pages in it.
      - run: uv run --frozen --extra render playwright install --with-deps chromium webkit
      # The project site's address: https://<owner>.github.io/<repo>/.
      - name: Site address
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            echo "SITE_REPO=$GITHUB_REPOSITORY"
            echo "SITE_ORIGIN=https://$owner.github.io"
            echo "SITE_BASE=/${GITHUB_REPOSITORY#*/}"
          } >> "$GITHUB_ENV"
      # The item and talent catalogs share icons/<size>/<name>.jpg. Keep
      # fetched JPEGs across builds, including those from a partial download.
      - name: Restore demo icons
        id: icons
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pages-model3d/icons/*/*.jpg
          key: demo-icon-jpegs-v1
          restore-keys: demo-icon-jpegs-v1-
      # VictoriaLogs and VictoriaMetrics in Docker, the item tables from
      # wago.tools, and the nine characters' client files for the 3D view
      # and pictures. The archive must match site/demo3d-roster.sha256.
      - run: site/scripts/build-demo.sh
        env:
          MODEL3D_CACHE_DIR: ${{ github.workspace }}/.cache/pages-model3d
      - name: Save new demo icons
        if: >-
          !cancelled() && hashFiles('.cache/pages-model3d/icons/*/*.jpg') != '' &&
          steps.icons.outputs.cache-matched-key != format('demo-icon-jpegs-v1-{0}', hashFiles('.cache/pages-model3d/icons/*/*.jpg'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pages-model3d/icons/*/*.jpg
          key: demo-icon-jpegs-v1-${{ hashFiles('.cache/pages-model3d/icons/*/*.jpg') }}
      # Check the two published pages with the verified roster, then the live
      # dashboard with event data alone. The image job exercises the full Compose kit.
      - name: Check the nine client models, class actions and demo pages
        run: >-
          uv run --frozen --extra render --group browser pytest -q -rA -m browser
          tests/test_demo_complete_browser.py tests/test_local_demo_complete_browser.py
        env:
          MODEL3D_CACHE_DIR: ${{ github.workspace }}/.cache/pages-model3d
          WOW_DEMO_DIR: site/public/demo
          WOW_DEMO_ENGINES: chromium,webkit
      - run: npm ci --prefix site
      # Page counts (site/scripts/analytics.mjs): the Plausible site and its
      # event endpoint, repository variables like immich-memories' docs. Public
      # values; unset, the pages load no tracker.
      # GH_TOKEN: tools/docs_values.py reads the release's image line with it
      # (anonymous calls from a shared runner address get refused).
      - run: npm run build --prefix site
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_ANALYTICS_DOMAIN: ${{ vars.DOCS_ANALYTICS_DOMAIN }}
          DOCS_ANALYTICS_ENDPOINT: ${{ vars.DOCS_ANALYTICS_ENDPOINT }}
      - if: steps.publish.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - if: steps.publish.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: site/dist
          retention-days: 7

  deploy:
    needs: [visibility, build]
    # Public repositories only (see the top). Pushes and manual runs read the
    # event's own flag; a scheduled run, which has none, the visibility job's.
    if: github.repository_id == '1464458020' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The page a reader copies from, as deployed: the quick start's command must
  # name the released image by its digest (tools/check_live_quickstart.py).
  # Pages caches a page up to 10 minutes, so it retries for 15.
  live-check:
    needs: [build, deploy]
    if: github.repository_id == '1464458020' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - run: python3 tools/check_live_quickstart.py --wait 900
        env:
          GH_TOKEN: ${{ github.token }}
