# Rebuilds every daily export of tools/kb/rebuild.py (the route, gear,
# forever, class, trainer and knowledge-base references, the dungeon quests
# and wings, the WoWSims talent table) from the pinned sources and fails when
# one differs from the committed file (each export's doc says how to rerun
# it). The gear scoring is ForeverDB.net's since 2026-11-23
# (tests/test_gear_foreverdb.py, in the normal suite). It never commits: the
# pins live in files (tools/polestar-tag, tools/forever-db-tag,
# data/kb/watch.json), so kb-refresh's token, which can't edit a workflow,
# can move them, and kb-refresh moves a pin with the exports in one PR when
# the watcher sees a release; a pin moved without the exports fails here.
# Actions are pinned by commit SHA (the comment is the tag it was taken from).
name: route-reference

on:
  push:
    branches: [main]
    paths:
      - tools/route_reference/**
      - tools/gear_reference/**
      - tools/forever_reference/**
      - tools/dungeon_quests/**
      - tools/dungeon_wings/**
      - tools/class_reference/**
      - tools/trainers/**
      - tools/craft_reference/**
      - tools/wowsims_talents.py
      - tools/kb/export.py
      - tools/kb/rebuild.py
      - tools/kb/checkout.py
      - tools/polestar-tag
      - tools/forever-db-tag
      - data/kb/watch.json
      - data/route-reference.json
      - data/gear-reference.json
      - data/forever-reference.json
      - data/class-reference.json
      - data/trainers-reference.json
      - data/craft-reference.json
      - data/kb-reference.json.gz
      - data/wowsims-talents.json
      - data/dungeons/quests.json
      - data/dungeons/wings.json
      - .github/workflows/route-reference.yml
  pull_request:
    paths:
      - tools/route_reference/**
      - tools/gear_reference/**
      - tools/forever_reference/**
      - tools/dungeon_quests/**
      - tools/dungeon_wings/**
      - tools/class_reference/**
      - tools/trainers/**
      - tools/craft_reference/**
      - tools/wowsims_talents.py
      - tools/kb/export.py
      - tools/kb/rebuild.py
      - tools/kb/checkout.py
      - tools/polestar-tag
      - tools/forever-db-tag
      - data/kb/watch.json
      - data/route-reference.json
      - data/gear-reference.json
      - data/forever-reference.json
      - data/class-reference.json
      - data/trainers-reference.json
      - data/craft-reference.json
      - data/kb-reference.json.gz
      - data/wowsims-talents.json
      - data/dungeons/quests.json
      - data/dungeons/wings.json
      - .github/workflows/route-reference.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same Node as the export was last run with: Math.hypot and friends may round differently elsewhere.
  NODE_VERSION: 24.5.0

jobs:
  check:
    if: github.repository_id == '1464458020'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: Lua, to read the addon's compiled files
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends lua5.4
      # Polestar at tools/polestar-tag, forever-db at tools/forever-db-tag
      # (its release, checksums checked), as the refresh job builds it.
      - name: The checkout every export reads
        run: python3 tools/kb/checkout.py "$RUNNER_TEMP/polestar"
      - name: Every daily export is the committed file
        run: >-
          uv run --frozen python tools/kb/rebuild.py run --polestar "$RUNNER_TEMP/polestar"
          --work "$RUNNER_TEMP/rebuild" --check
