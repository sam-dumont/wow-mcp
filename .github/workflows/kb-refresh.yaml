# The knowledge base's refresh job (docs/kb.md, "The refresh job"). It runs
# in the private CI mirror, sam-dumont/wow-mcp-ci (mirror.yml), never in the
# public repository: the job's `if:` carries the mirror's repository id.
# Everything it writes (the branch, the PR, the issues) goes to the public
# repository, KB_REPO below, through the CI GitHub App's token (variable
# CI_APP_CLIENT_ID, secret CI_APP_PRIVATE_KEY in the mirror's environment
# main-only, which only main can deploy to): a PR the App opens runs the
# public repository's checks like any other.
#
# Every run, whatever its mode, starts with `reconcile` (environment
# main-only, the App's token, no model; tools/kb/reconcile.py): what earlier
# runs left open is brought up to date before this run does anything. Every
# open PR of the job is rebased when BEHIND; the watch PR, when it conflicts
# with main, is made again on the current main with the kinds it carries (read
# from its branch, never from this run) and gated; the job then stays with the
# PRs until they merge (45 minutes for all). Every open kb-watch issue whose
# condition holds on main is closed with a one-line why. Red while a PR waits
# for a person. 2026-11-25: #249 sat CONFLICTING for hours and #212 and #171
# stayed open a day after their PRs merged: only the same mode's next run
# looked again, and only the run that opened a PR could make it again.
#
# Then two jobs, so the App's key and the model never meet: `run` (no
# environment, so its OIDC subject stays the federation rule's) does the
# work, the model passes and the gates, with the mirror's read-only token;
# what it would write to GitHub (the commits, the issues) goes to `land` as
# an artifact. `land` (environment main-only) holds the App's token, opens
# and merges the PR and keeps the issues. Every
# mode ends in one PR that merges on its own when the gates pass (owner,
# 2026-11-20: "the goal is automated refreshes"); an issue (label kb-watch)
# is only for what the gates or a check refused, and says why.
#
# Deterministic work runs as often as it likes and never calls a model;
# a model only reads prose, once a week, and only what changed (owner,
# 2026-11-22: "the kb watch is doing stuff that are deterministic and stuff
# that needs llms"; nine daily runs re-sent the same known statements
# uncached, ~1.4M tokens a week).
#
# - watch (daily, no model, like Dependabot): the upstream versions
#   (tools/kb/watch.py --kinds versions): the client build, the Polestar
#   release, forever-db's own release, ForeverDB.net's data and the install
#   docs' addons. Each change kind is landed here (tools/kb/versions.sh):
#   * polestar: tools/kb/bump.py checks the new tag (its licence terms and
#     saved tables unchanged), moves tools/polestar-tag, and the exports
#     that read Polestar (tools/kb/rebuild.py) rerun at the new tag;
#   * forever-db: bump.py checks the release (checksums, licence, notice,
#     schema version), moves tools/forever-db-tag, the exports that read it
#     rerun;
#   * addons: bump.py checks each release still saves what the shipper reads;
#   * client-build: the exports that read the client tables rerun;
#   * foreverdb: ForeverDB.net's addon data downloaded, checked, exported.
#   What went through is accepted into data/kb/watch.json; a kind a check
#   refused stays out of the PR and keeps its issue, with the reason. Then,
#   every day whatever moved, every daily export of tools/kb/rebuild.py
#   reruns on the pinned inputs, so a file that drifted from its exporter is
#   rebuilt too (owner, 2026-11-25: "a daily rebuild of static files"). No
#   change, no commit, no PR. A failed rebuild turns the run red (land's
#   last step).
# - review (weekly): the model's week. Free checks first, then the model on
#   what they flagged, nothing else:
#   * official: Blizzard's hotfix and patch-note pages (watch.py --kinds
#     official: text hash, a forum thread's post count); the model pass
#     (tools/kb/refresh.py) reads the changed pages only, a thread's new
#     posts only, with the known statements cached for an hour;
#   * meta: what people write about Forever, new since watch.json's `meta`
#     (tools/kb/meta.py collect, then propose);
#   * the Community corner (tools/kb/community.py): new forum threads;
#   * the lifecycle (tools/kb/lifecycle.py: fold, expire, merge, digests,
#     and re-verify, which asks the model only about a page changed since
#     it last held).
#   `meta` is the old name of this mode, still accepted.
# - refresh: the model pass alone, on the pages named in `pages`.
# - sweep (monthly, no model): every cited URL fetched once; gone and changed
#   sources and stale statements go to one issue, the new sweep.json to the PR.
#
# Before a model pass's records are folded, tools/kb/vet.py folds a copy and
# drops each of the pass's records a gate below would refuse (the schema with
# its lane's shape, licence, multi-source, instruction-shaped text): they are
# never committed and the PR lists them under "Dropped" (2026-11-22: #99 opened
# red on two class-guide records without their class).
#
# The gates (tools/kb/gates.py): kbschema, the licence checks (no copied run
# of 12 words against the text the pass read, quotes of 15 words at most, a
# citation on every record), the multi-source rule for lists and builds, the
# size budget, a cap on how many statements one run removes, the golden
# characters' behaviour (no move, raid prep or class effect of
# tests/slices/golden.json may go away unless the PR updates it), and ruff plus
# the whole test suite (the MCP's 24,000-character cap among them), here,
# before the PR; the public repository's required checks run again on it.
# tools/kb/land.py rebases on a main that moved (and gates again), opens the
# PR, turns auto-merge on (`gh pr merge --auto --squash`) and stays with it
# until it merges: main's ruleset wants a branch up to date, so whenever the
# PR goes BEHIND it is rebased on main (`gh pr update-branch --rebase`, the
# App's token, so the checks run again). Gates refused: label kb-refused, left
# for a person. A watch change is deterministic, so a conflict with a main
# that moved never refuses it: `land` makes it again on the current main with
# the kinds its commits carry (tools/kb/reconcile.py --remake: versions.sh,
# the gates on it) and lands that, twice at most
# (2026-11-22: #140, Polestar v0.4.2.2, refused on a fixture conflict).
# The run ends red unless its PR merged: a refusal, a failed required check,
# a conflict that outlived the tries, or no merge within 45 minutes. The lab's
# scheduler waits for the run and fails its CronJob on red
# (CronJobNotSucceeding), so a stuck PR reaches the owner. While a PR is
# still open after `reconcile`, the run of its mode adds nothing.
#
# Manual only: no `schedule:`, since GitHub's cron runs hours late or not at
# all. The owner's scheduler dispatches it on time (watch daily, review
# Mondays, sweep on the 2nd); a fork dispatches it from its own scheduler
# (docs/kb.md).
#
# The model pass has no API key: GitHub's OIDC token is exchanged for a
# short-lived Anthropic token (Workload Identity Federation), and the
# federation rule only accepts workflow_dispatch runs of the mirror on main
# (subject repo:sam-dumont@6107797/wow-mcp-ci@1465633168:ref:refs/heads/main:
# GitHub issues immutable subjects here).
# Without the ANTHROPIC_* repository variables (a fork, say) the model passes
# skip with a notice and their change kind keeps its issue; watch and sweep
# need none of it. It runs here, never on the server or in the image (the
# server runs no LLM). Pages and release data are untrusted: their text is
# hashed or handed to the model as data, the model's answer only becomes
# JSON the gates check, and no release note is read at all.
name: kb-refresh
on:
  workflow_dispatch:
    inputs:
      mode:
        description: watch (versions, no model), review (the weekly model pass), refresh, sweep; meta = review
        type: choice
        options: [watch, review, refresh, sweep, meta]
        default: watch
      pages:
        description: "refresh mode: page keys from data/kb/watch.json (space-separated)"
        type: string
        default: ""

# GITHUB_TOKEN only reads (the public repository too); writes go to the
# public repository with the App's token, in `land`.
permissions:
  contents: read
  id-token: write

concurrency:
  group: kb-refresh
  cancel-in-progress: false

jobs:
  # What earlier runs left open, before this run's own work (header,
  # tools/kb/reconcile.py). The lane made again here runs Polestar's code: it
  # gets the mirror's read-only token, never the App's.
  reconcile:
    if: github.repository_id == '1465633168' && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: main-only
    # A remake (the lane and its gates, up to an hour), the gates again if
    # main moved meanwhile (an hour), up to 45 minutes with the PR, then 45
    # with the other PRs.
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      KB_REPO: sam-dumont/wow-mcp
      GH_REPO: sam-dumont/wow-mcp
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sam-dumont/wow-mcp
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --group kb --extra publish --extra mcp --extra analysis --extra analysis-openai
      - name: Set up
        run: |
          set -eu
          echo "WHY=$RUNNER_TEMP/kb-why.json" >> "$GITHUB_ENV"
          echo '{}' > "$RUNNER_TEMP/kb-why.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
      - name: Mint the App's token for the public repository
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: wow-mcp
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Open PRs (rebased, re-armed, the one to make again)
        id: prs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: uv run --frozen python tools/kb/reconcile.py --prs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.prs.outputs.remake != ''
        with:
          node-version: 24.5.0
      - name: The watch PR made again on the current main
        id: remake
        if: steps.prs.outputs.remake != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.prs.outputs.remake }}
        run: |
          set -eu
          git fetch -q origin +kb-watch:refs/remotes/origin/kb-watch
          GATES_OUT="$RUNNER_TEMP/gates-remake.json" uv run --frozen python tools/kb/reconcile.py --remake origin/kb-watch
          base=$(git rev-parse origin/main)
          echo "title=KB watch $(date -u +%F): $(git log --reverse --format=%s "$base..HEAD" | paste -sd ';' - | cut -c1-180)" >> "$GITHUB_OUTPUT"
          {
            echo "PR #$PR conflicted with main. The versions lane is deterministic, so the refresh job made it again on the current main (tools/kb/reconcile.py --remake), with the kinds the PR carried:"
            git log --reverse --format='- %s' "$base..HEAD"
            cat "$RUNNER_TEMP/kb-foreverdb.md" 2>/dev/null || true
          } > "$RUNNER_TEMP/remake-body.md"
      # An App token lasts an hour; the remake and the gates after a rebase
      # take about that each on this runner. So every step that writes gets a
      # token minted just before it, and the rebase and its gates run in a
      # step of their own, before it (tools/kb/land.py --rebase-out). 2026-11-24
      # and 11-25: the push and the issues failed on an expired token.
      - name: Rebased on main, the gates again (no token)
        if: steps.remake.outcome == 'success'
        env:
          BRANCH: kb-watch
          BASE: ${{ steps.remake.outputs.base }}
        run: uv run --frozen python tools/kb/land.py --branch "$BRANCH" --base "$BASE" --rebase-out "$RUNNER_TEMP/land-prep.json"
      - name: A fresh token to land it
        id: token_land
        if: steps.remake.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: wow-mcp
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Land it
        if: steps.remake.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token_land.outputs.token }}
          TITLE: ${{ steps.remake.outputs.title }}
          BASE: ${{ steps.remake.outputs.base }}
        run: >-
          uv run --frozen python tools/kb/land.py --mode watch --branch kb-watch --regen --last
          --base "$BASE" --gates "$RUNNER_TEMP/gates-remake.json" --gates-md "$RUNNER_TEMP/gates-remake.md"
          --title "$TITLE" --body-file "$RUNNER_TEMP/remake-body.md" --prepared "$RUNNER_TEMP/land-prep.json"
      - name: A fresh token to stay with the PRs
        id: token_settle
        if: always() && steps.token.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: wow-mcp
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Stay with the open PRs, close the issues main settled
        if: always() && steps.token_settle.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token_settle.outputs.token }}
        run: uv run --frozen python tools/kb/reconcile.py --settle

  run:
    needs: reconcile
    # After reconcile, red or not: what this run does is its own.
    if: always() && github.repository_id == '1465633168' && (github.ref == 'refs/heads/main') && needs.reconcile.result != 'cancelled'
    runs-on: ubuntu-24.04
    # The gates run the whole suite in one job here (pytest alone 51 minutes
    # on 2026-11-25; CI splits it over 4): the step took 33 minutes on 11-23,
    # 62 on 11-24, and passed 61 on 11-26, when the old 75-minute limit
    # cancelled the run after a 13-minute daily rebuild. A Polestar bump adds
    # a 450 MB clone and the exports.
    timeout-minutes: 150
    # GH_TOKEN (the mirror's token: it only reads) is given to the steps
    # that read GitHub and to no other: never to the model passes, which
    # handle outside text, nor to the gates, which run the tests. The
    # checkout keeps no credentials either.
    outputs:
      base: ${{ steps.base.outputs.sha }}
      title: ${{ steps.pr.outputs.title }}
      kinds: ${{ steps.watch.outputs.kinds }}
      refresh: ${{ steps.refresh.outcome }}
    env:
      # The model pass's spend cap per run, in USD (tools/kb/refresh.py).
      KB_REFRESH_MAX_USD: "3"
      # `meta`, the weekly review's old name, runs as `review`.
      MODE: ${{ inputs.mode == 'meta' && 'review' || inputs.mode }}
      BRANCH: kb-${{ inputs.mode == 'meta' && 'review' || inputs.mode }}
      # Where the branch, the PR and the issues go: gh reads GH_REPO, the
      # tools KB_REPO.
      KB_REPO: sam-dumont/wow-mcp
      GH_REPO: sam-dumont/wow-mcp
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      # The public repository's main as `reconcile` left it (the mirror's copy
      # lags it): a PR reconcile just merged is in the base, not made twice.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sam-dumont/wow-mcp
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The kb group (anthropic, by hash from uv.lock), and what the test
      # suite needs, as CI's test job installs it (the analysis extras too:
      # without openai the gates failed a test CI passes, 2026-11-22).
      - run: uv sync --frozen --group kb --extra publish --extra mcp --extra analysis --extra analysis-openai
      - name: Where the run starts
        id: base
        run: |
          set -eu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The texts the model passes read, for the gates' licence check.
          echo "KB_SOURCES=$RUNNER_TEMP/kb-sources.jsonl" >> "$GITHUB_ENV"
          # {kind: why it isn't landed}, for the watch issues.
          echo "WHY=$RUNNER_TEMP/kb-why.json" >> "$GITHUB_ENV"
          echo '{}' > "$RUNNER_TEMP/kb-why.json"
          # The issues the tools would keep (tools/kb/web.py keep_issue),
          # for `land` to write.
          echo "KB_ISSUES_OUT=$RUNNER_TEMP/kb-issues.jsonl" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
      - name: An earlier run's PR still open?
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python tools/kb/land.py --check-open --branch "$BRANCH"

      # Free: versions in watch mode, the official pages' hashes in review mode.
      - name: Watch
        id: watch
        if: env.MODE == 'watch' || env.MODE == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH: ${{ env.MODE == 'watch' && 'versions' || 'official' }}
        run: uv run --frozen python tools/kb/watch.py --kinds "$WATCH"
      - name: Nothing new while the last PR is open
        if: (env.MODE == 'watch' || env.MODE == 'review') && steps.open.outputs.pr != ''
        env:
          KINDS: ${{ steps.watch.outputs.kinds }}
          PR: ${{ steps.open.outputs.pr }}
        run: |
          set -eu
          why="PR #$PR from an earlier run is still open: the reconcile job keeps it moving (its log says why it hasn't merged; one labelled kb-refused waits for a person), and the next run lands this change."
          for k in $KINDS; do jq --arg k "$k" --arg w "$why" '.[$k] = $w' "$WHY" > "$WHY.new" && mv "$WHY.new" "$WHY"; done

      # --- The versions lane (tools/kb/versions.sh): addon releases checked
      # and accepted, a Polestar or forever-db release checked, its tag moved,
      # the exports that read it rerun and the test data regenerated, a client
      # build's exports rerun, ForeverDB.net's data downloaded, checked and
      # exported. One commit per kind; a refused kind gets its reason in $WHY.
      # Then every daily export of tools/kb/rebuild.py, one more commit when
      # a file came out different.
      # GH_TOKEN (read-only) for the checks only: the script drops it, and
      # the job's OIDC and runtime tokens, before it runs Polestar's code.
      # `land` runs the same script again on the current main when main
      # moved under the PR and the change conflicts with it.
      # Every watch run, a version moved or not: the daily rebuild.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.MODE == 'watch' && steps.open.outputs.pr == ''
        with:
          # route-reference.yml's: Math.hypot and friends may round differently elsewhere.
          node-version: 24.5.0
      - name: Versions and the daily rebuild
        if: env.MODE == 'watch' && steps.open.outputs.pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
          KINDS: ${{ steps.watch.outputs.kinds }}
          TAG: ${{ steps.watch.outputs.polestar_tag }}
          FDB_TAG: ${{ steps.watch.outputs.forever_db_tag }}
        run: tools/kb/versions.sh

      # --- The model passes.
      - name: Pages for the model pass
        id: pages
        if: (env.MODE == 'review' || env.MODE == 'refresh') && steps.open.outputs.pr == ''
        env:
          CHANGED: ${{ steps.watch.outputs.changed_official }}
          ASKED: ${{ inputs.pages }}
        run: |
          set -eu
          if [ "$MODE" = refresh ]; then keys="$ASKED"; else keys=$(echo "${CHANGED:-[]}" | jq -r '.[]' | xargs); fi
          echo "keys=$keys" >> "$GITHUB_OUTPUT"

      - name: Meta, what's new (no model)
        id: collect
        if: env.MODE == 'review' && steps.open.outputs.pr == ''
        run: uv run --frozen python tools/kb/meta.py collect --items "$RUNNER_TEMP/meta-items.json"

      - name: No model pass here (the ANTHROPIC_* variables aren't set)
        if: vars.ANTHROPIC_FEDERATION_RULE_ID == '' && (steps.pages.outputs.keys != '' || steps.collect.outputs.new > 0)
        run: |
          echo '::notice::Model pass skipped, set the ANTHROPIC_* repository variables to run it (docs/kb.md).'
          jq --arg w "The model pass isn't set up (the ANTHROPIC_* repository variables, docs/kb.md): nothing read the changed pages." \
            '.official = $w' "$WHY" > "$WHY.new" && mv "$WHY.new" "$WHY"
      # A failure here doesn't stop the other kinds: their PR still lands,
      # `official` keeps its issue with the reason, and the run ends red.
      - name: Model pass
        id: refresh
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != '' && steps.pages.outputs.keys != ''
        continue-on-error: true
        env:
          KEYS: ${{ steps.pages.outputs.keys }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          # shellcheck disable=SC2086 # one word per key
          tools/kb/with-oidc.sh uv run --frozen python tools/kb/refresh.py --handoff "$RUNNER_TEMP/kb-refresh-read.json" $KEYS
      - name: The model pass failed
        if: steps.refresh.outcome == 'failure'
        run: |
          git reset -q --hard HEAD && git clean -qfd
          jq --arg w "The model pass failed (this run's step \"Model pass\": the token exchange, the API or its answer); nothing from the pages is in the PR." \
            '.official = $w' "$WHY" > "$WHY.new" && mv "$WHY.new" "$WHY"
      # The pages the pass read are accepted (none past a cost-cap stop or a
      # failed fetch), each at the version it read, never a fresh fetch; its
      # file folds into the lanes at once (no re-verify, no model), as the
      # tree must be what the weekly lifecycle would make of it.
      - name: Fold and accept what the model pass read
        if: steps.refresh.outcome == 'success'
        env:
          READ: ${{ steps.refresh.outputs.read }}
          KEYS: ${{ steps.pages.outputs.keys }}
        run: |
          set -eu
          uv run --frozen python tools/kb/vet.py --dropped "$RUNNER_TEMP/kb-dropped.md"
          uv run --frozen python tools/kb/lifecycle.py --no-fetch --summary "$RUNNER_TEMP/refresh-summary.md"
          if [ -n "$READ" ]; then
            uv run --frozen python tools/kb/watch.py --accept official --handoff "$RUNNER_TEMP/kb-refresh-read.json"
          fi
          git add -A
          git diff --cached --quiet || git commit -qm "Official pages: statements from the model pass"
          unread=""
          for k in $KEYS; do
            case " $READ " in *" $k "*) ;; *) unread="$unread $k" ;; esac
          done
          if [ -n "$unread" ]; then
            jq --arg w "The model pass didn't read:$unread (a fetch failed, the model stopped, or its cost cap, KB_REFRESH_MAX_USD; the run's log says which); the next run reads them." \
              '.official = $w' "$WHY" > "$WHY.new" && mv "$WHY.new" "$WHY"
          fi
      - name: Meta model pass
        id: meta
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != '' && steps.collect.outputs.new > 0
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: >-
          tools/kb/with-oidc.sh uv run --frozen python tools/kb/meta.py propose
          --items "$RUNNER_TEMP/meta-items.json" --summary "$RUNNER_TEMP/meta-summary.md"
      # Before the lifecycle folds them: what a gate would refuse leaves the pass's file.
      - name: Check the meta pass's records
        if: steps.meta.outcome == 'success'
        run: uv run --frozen python tools/kb/vet.py --dropped "$RUNNER_TEMP/kb-dropped.md"
      # Forum titles only, no Reddit, without the ANTHROPIC_* variables.
      - name: Community, what players are saying
        id: community
        if: env.MODE == 'review' && steps.open.outputs.pr == ''
        env:
          COMMUNITY_MAX_USD: "1"
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID != '' && format('{0}/anthropic-oidc', runner.temp) || '' }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: tools/kb/with-oidc.sh uv run --frozen python tools/kb/community.py --summary "$RUNNER_TEMP/meta-summary.md"
      # After the community step, so its weeks are trimmed too. Runs without
      # the ANTHROPIC_* variables: stale statements are then only checked for
      # gone sources, the rest listed in the PR.
      - name: Lifecycle (fold, expire, merge, re-verify, digests)
        id: lifecycle
        if: env.MODE == 'review' && steps.open.outputs.pr == ''
        env:
          KB_LIFECYCLE_MAX_USD: "1"
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID != '' && format('{0}/anthropic-oidc', runner.temp) || '' }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: tools/kb/with-oidc.sh uv run --frozen python tools/kb/lifecycle.py --summary "$RUNNER_TEMP/meta-summary.md"
      - name: Remove the token and the collected text
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/anthropic-oidc" "$RUNNER_TEMP/anthropic-oidc.new" "$RUNNER_TEMP/meta-items.json" "$RUNNER_TEMP/kb-refresh-read.json" \
            "$RUNNER_TEMP/kb-handoff-addons.json" "$RUNNER_TEMP/kb-handoff-client.json" \
            "$RUNNER_TEMP/kb-handoff-foreverdb.json"

      - name: Sweep
        if: env.MODE == 'sweep' && steps.open.outputs.pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python tools/kb/sweep.py --github

      - name: Size budget issue
        if: env.MODE == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/kb/with-oidc.sh uv run --frozen python tools/kb/lifecycle.py --budget-issue

      # --- One PR, gated.
      - name: Commit and describe
        id: pr
        env:
          BASE: ${{ steps.base.outputs.sha }}
          SPENT: ${{ steps.refresh.outputs.spent_usd }}
          READ: ${{ steps.refresh.outputs.read }}
        run: |
          set -eu
          git add -A
          git diff --cached --quiet || git commit -qm "kb-refresh $MODE"
          # Nothing committed (a quiet day): no gates, land has nothing to do.
          if [ "$(git rev-parse HEAD)" = "$BASE" ]; then echo "committed=0"; else echo "committed=1"; fi >> "$GITHUB_OUTPUT"
          day=$(date -u +%F)
          body="$RUNNER_TEMP/pr-body.md"
          case "$MODE" in
            review)
              title="KB review $day: official pages, news, blue posts and guides, and the lifecycle"
              {
                echo "The weekly review: the model read only what the free checks flagged as changed."
                if [ -n "$READ" ]; then
                  echo
                  echo "## Official pages"
                  echo "Read: $READ. Statements from tools/kb/refresh.py (model pass, \$${SPENT:-0} of a \$${KB_REFRESH_MAX_USD} cap); each cites its page."
                  cat "$RUNNER_TEMP/refresh-summary.md" 2>/dev/null || true
                fi
                cat "$RUNNER_TEMP/meta-summary.md" 2>/dev/null || true
              } > "$body" ;;
            sweep)
              title="KB sweep $day: cited sources"
              echo "The monthly sweep's record of every cited URL (data/kb/sweep.json), so next month compares with this one. What to look at is in the open kb-watch sweep issue." > "$body" ;;
            *)
              title="KB $MODE $day: $(git log --reverse --format=%s "$BASE..HEAD" | paste -sd ';' - | cut -c1-180)"
              {
                echo "What the refresh job landed, from what tools/kb/watch.py saw change:"
                git log --reverse --format='- %s' "$BASE..HEAD"
                echo
                echo "Official statements come from tools/kb/refresh.py (model pass, \$${SPENT:-0} of a \$${KB_REFRESH_MAX_USD} cap); each cites its page."
                cat "$RUNNER_TEMP/refresh-summary.md" 2>/dev/null || true
                # What ForeverDB's data moved (tools/kb/bump.py foreverdb --summary).
                cat "$RUNNER_TEMP/kb-foreverdb.md" 2>/dev/null || true
              } > "$body" ;;
          esac
          # The model's records tools/kb/vet.py kept out of the PR, and why.
          cat "$RUNNER_TEMP/kb-dropped.md" >> "$body" 2>/dev/null || true
          echo "title=$title" >> "$GITHUB_OUTPUT"
      # No token here: the gates run the test suite. A refusal is the
      # verdict in gates.json, not a red step.
      - name: Gates
        if: steps.pr.outputs.committed == '1'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: >-
          uv run --frozen python tools/kb/gates.py --base "$BASE"
          --out "$RUNNER_TEMP/gates.json" --markdown "$RUNNER_TEMP/gates.md" || true
      # Everything `land` needs, whatever happened: the commits since the
      # base (a bundle), the reasons, the PR text, the gates' verdict, the
      # texts the model read (the gates again after a rebase) and the
      # issues the tools kept. One day, in this private repository.
      - name: Hand over to land
        if: always()
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -u
          out="$RUNNER_TEMP/handoff"
          mkdir -p "$out"
          if [ -n "$BASE" ] && [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            git bundle create "$out/kb.bundle" HEAD "^$BASE"
          fi
          for f in kb-why.json kb-sources.jsonl kb-issues.jsonl pr-body.md gates.json gates.md; do
            [ -f "$RUNNER_TEMP/$f" ] && cp "$RUNNER_TEMP/$f" "$out/"
          done
          ls -la "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kb-handoff
          path: ${{ runner.temp }}/handoff/
          retention-days: 1
          if-no-files-found: ignore

  # The writes, with the App's token: the PR (merged when the gates and the
  # public repository's checks pass), the issues. The App's key lives in the
  # environment main-only; this job runs no model and reads no page.
  land:
    needs: run
    if: github.repository_id == '1465633168' && (always() && github.ref == 'refs/heads/main' && needs.run.result != 'cancelled' && needs.run.result != 'skipped')
    runs-on: ubuntu-24.04
    environment: main-only
    # Per try: the gates again after a rebase (up to an hour since
    # 2026-11-24), then up to 45 minutes with the PR until it merges
    # (tools/kb/land.py SHEPHERD_S); a change made again on a moved main adds
    # a lane and its gates (up to an hour). Three tries: GitHub's 6 hours.
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      MODE: ${{ inputs.mode == 'meta' && 'review' || inputs.mode }}
      BRANCH: kb-${{ inputs.mode == 'meta' && 'review' || inputs.mode }}
      KB_REPO: sam-dumont/wow-mcp
      GH_REPO: sam-dumont/wow-mcp
      BASE: ${{ needs.run.outputs.base }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      # The public repository at the run's base: land.py rebases on its main
      # if it moved, and pushes there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sam-dumont/wow-mcp
          ref: ${{ needs.run.outputs.base || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The gates run again after a rebase: the suite's dependencies, as CI's.
      - run: uv sync --frozen --group kb --extra publish --extra mcp --extra analysis --extra analysis-openai
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: kb-handoff
          path: ${{ runner.temp }}/handoff
      - name: Where the run left off
        run: |
          set -eu
          HANDOFF="$RUNNER_TEMP/handoff"
          echo "HANDOFF=$HANDOFF" >> "$GITHUB_ENV"
          mkdir -p "$HANDOFF"
          [ -f "$HANDOFF/kb-why.json" ] || echo '{}' > "$HANDOFF/kb-why.json"
          echo "WHY=$HANDOFF/kb-why.json" >> "$GITHUB_ENV"
          echo "KB_SOURCES=$HANDOFF/kb-sources.jsonl" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          if [ -f "$HANDOFF/kb.bundle" ]; then
            git fetch -q "$HANDOFF/kb.bundle" HEAD
            git switch -qc "$BRANCH" FETCH_HEAD
          else
            git switch -qc "$BRANCH"
          fi
          git log --oneline "${BASE:-HEAD}..HEAD"
      - name: Mint the App's token for the public repository
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: wow-mcp
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Labels
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh label create kb-watch --color 5319e7 --description "KB refresh job, a source changed" --force
          gh label create kb-refused --color b60205 --description "KB refresh job: the gates refused it, a person decides" --force
      - name: The issues the run kept (sweep, size budget)
        if: hashFiles(format('{0}/handoff/kb-issues.jsonl', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: uv run --frozen python tools/kb/web.py --replay-issues "$HANDOFF/kb-issues.jsonl"
      # Red unless the PR merged (tools/kb/land.py): the lab's scheduler
      # reports a red run. The issues below run anyway. In watch mode
      # (`--regen`) a conflict with a main that moved is outcome `moved`: the
      # versions lane runs again on the current main (GH_TOKEN read-only for
      # its checks, no App token in reach of Polestar's code, the gates on
      # what it made), then lands again; the third try's `moved` is red, and
      # the next run's reconcile makes it again, whatever its mode.
      - name: Rebased on main, the gates again (no token)
        id: prep
        if: needs.run.result == 'success'
        env:
          BASE: ${{ needs.run.outputs.base }}
        run: uv run --frozen python tools/kb/land.py --branch "$BRANCH" --base "$BASE" --rebase-out "$RUNNER_TEMP/land-prep.json"
      - name: A fresh token to land
        id: token_land
        if: needs.run.result == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: wow-mcp
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Land (merge when the gates passed)
        id: land
        if: needs.run.result == 'success'
        env:
          GH_TOKEN: ${{ steps.token_land.outputs.token }}
          TITLE: ${{ needs.run.outputs.title }}
          KINDS: ${{ needs.run.outputs.kinds }}
          REGEN: ${{ env.MODE == 'watch' && '1' || '' }}
        run: >-
          uv run --frozen python tools/kb/land.py --mode "$MODE" --branch "$BRANCH" ${REGEN:+"--regen"}
          --base "$BASE" --gates "$HANDOFF/gates.json" --gates-md "$HANDOFF/gates.md"
          --title "$TITLE" --body-file "$HANDOFF/pr-body.md"
          --kinds "$KINDS" --why-out "$WHY" --landed-out "$RUNNER_TEMP/kb-landed.json" --state-out "$RUNNER_TEMP/watch-state.json"
          --prepared "$RUNNER_TEMP/land-prep.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.land.outputs.outcome == 'moved'
        with:
          node-version: 24.5.0
      - name: Made again on the current main (1)
        id: regen1
        if: steps.land.outputs.outcome == 'moved'
        env:
          GH_TOKEN: ${{ github.token }}
        # The kinds of the commits it couldn't land (HEAD), not a fresh look.
        run: GATES_OUT="$RUNNER_TEMP/gates-regen.json" uv run --frozen python tools/kb/reconcile.py --remake HEAD
      - name: Rebased on main, the gates again (1, no token)
        id: prep1
        if: steps.regen1.outcome == 'success'
        env:
          BASE: ${{ steps.regen1.outputs.base }}
        run: uv run --frozen python tools/kb/land.py --branch "$BRANCH" --base "$BASE" --rebase-out "$RUNNER_TEMP/land-prep1.json"
      - name: A fresh token to land again (1)
        id: token_land1
        if: steps.regen1.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: wow-mcp
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Land again (1)
        id: land1
        if: steps.regen1.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token_land1.outputs.token }}
          TITLE: ${{ needs.run.outputs.title }}
          KINDS: ${{ needs.run.outputs.kinds }}
          BASE: ${{ steps.regen1.outputs.base }}
        run: >-
          uv run --frozen python tools/kb/land.py --mode "$MODE" --branch "$BRANCH" --regen
          --base "$BASE" --gates "$RUNNER_TEMP/gates-regen.json" --gates-md "$RUNNER_TEMP/gates-regen.md"
          --title "$TITLE" --body-file "$HANDOFF/pr-body.md"
          --kinds "$KINDS" --why-out "$WHY" --landed-out "$RUNNER_TEMP/kb-landed.json" --state-out "$RUNNER_TEMP/watch-state.json"
          --prepared "$RUNNER_TEMP/land-prep1.json"
      - name: Made again on the current main (2)
        id: regen2
        if: steps.land1.outputs.outcome == 'moved'
        env:
          GH_TOKEN: ${{ github.token }}
        # The kinds of the commits it couldn't land (HEAD), not a fresh look.
        run: GATES_OUT="$RUNNER_TEMP/gates-regen.json" uv run --frozen python tools/kb/reconcile.py --remake HEAD
      - name: Rebased on main, the gates again (2, no token)
        id: prep2
        if: steps.regen2.outcome == 'success'
        env:
          BASE: ${{ steps.regen2.outputs.base }}
        run: uv run --frozen python tools/kb/land.py --branch "$BRANCH" --base "$BASE" --rebase-out "$RUNNER_TEMP/land-prep2.json"
      - name: A fresh token to land again (2)
        id: token_land2
        if: steps.regen2.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: wow-mcp
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Land again (2, the last)
        id: land2
        if: steps.regen2.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token_land2.outputs.token }}
          TITLE: ${{ needs.run.outputs.title }}
          KINDS: ${{ needs.run.outputs.kinds }}
          BASE: ${{ steps.regen2.outputs.base }}
        run: >-
          uv run --frozen python tools/kb/land.py --mode "$MODE" --branch "$BRANCH" --regen --last
          --base "$BASE" --gates "$RUNNER_TEMP/gates-regen.json" --gates-md "$RUNNER_TEMP/gates-regen.md"
          --title "$TITLE" --body-file "$HANDOFF/pr-body.md"
          --kinds "$KINDS" --why-out "$WHY" --landed-out "$RUNNER_TEMP/kb-landed.json" --state-out "$RUNNER_TEMP/watch-state.json"
          --prepared "$RUNNER_TEMP/land-prep2.json"

      # Last, whatever happened: a kind main still doesn't know keeps one
      # issue that says why (a step's reason, or this run's link when it
      # stopped early); a kind main now knows closes its issue.
      - name: A fresh token for the issues
        id: token_issues
        if: always()
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: sam-dumont
          repositories: wow-mcp
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Issues
        if: always() && (env.MODE == 'watch' || env.MODE == 'review')
        env:
          GH_TOKEN: ${{ steps.token_issues.outputs.token }}
          # Each mode keeps its own kinds' issues only.
          WATCH: ${{ env.MODE == 'watch' && 'versions' || 'official' }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/watch-state.json"
          [ -s "$state" ] || git show "${BASE:-HEAD}:data/kb/watch.json" > "$state"
          uv run --frozen python tools/kb/watch.py --github --kinds "$WATCH" --state "$state" --why "$WHY" \
            --landed "$RUNNER_TEMP/kb-landed.json" \
            | tee "$RUNNER_TEMP/issues.json"
      # Green only when everything the watch saw landed: a kind left with an
      # open issue (a refused Polestar bump, an addon whose contract moved)
      # waits for a person, and only a red run reaches the owner (the lab's
      # scheduler waits for it). 2026-11-22: Polestar v0.4.2.1 sat in an issue
      # nobody read.
      - name: Red when a change waits for a person
        if: >-
          (env.MODE == 'watch' || env.MODE == 'review') && steps.land.outcome == 'success'
          && steps.land1.outcome != 'failure' && steps.land2.outcome != 'failure'
        run: |
          set -eu
          # tools/kb/watch.py `red_kinds`: a kind this run landed that only
          # moved upstream after its sample waits for the next run, green
          # (2026-11-28: ForeverDB.net published again mid-run, #370).
          left=$(jq -r '.red | join(" ")' "$RUNNER_TEMP/issues.json")
          if [ -n "$left" ]; then
            echo "::error::Not landed, an issue (label kb-watch) says why: $left"
            exit 1
          fi
      - name: The run failed before landing
        if: needs.run.result == 'failure' && env.MODE != 'watch'
        env:
          GH_TOKEN: ${{ steps.token_issues.outputs.token }}
        run: uv run --frozen python tools/kb/land.py --failed --mode "$MODE" --branch "$BRANCH"
      - name: Red when the daily rebuild failed
        if: always() && env.MODE == 'watch'
        run: |
          set -eu
          if jq -e '.rebuild' "$WHY" >/dev/null 2>&1; then
            echo "::error::$(jq -r '.rebuild' "$WHY")"
            exit 1
          fi
      - name: Red when the model pass failed
        if: needs.run.outputs.refresh == 'failure'
        run: |
          echo "::error::The model pass failed; the rest landed, and the official issue says so."
          exit 1
