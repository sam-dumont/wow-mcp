# The release button (docs/development.md, "Releasing"): Actions > release >
# Run workflow on main, with a channel (stable, or rc for a release
# candidate X.Y.Z-rc.N, published as a prerelease), a version bump and
# dry_run. One run, in this order, so nothing public happens before
# everything that can fail has passed:
#
# 1. plan: tools/release/release.py picks the version from pyproject.toml,
#    CHANGELOG.md's "Unreleased" and the v* tags, and writes the notes.
# 2. test: ci.yml in full, on the commit the run started from.
# 3. prepare: the release commit (the version everywhere the tree carries
#    it, "Unreleased" moved under its heading) goes through a pull request
#    like any change: main's ruleset takes nothing else. The PR is opened
#    with the CI GitHub App's token, so its checks run (a GITHUB_TOKEN PR
#    starts none), and auto-merge squashes it once they pass. A tree that
#    already carries an untagged version (an interrupted run, a release PR
#    merged by hand) skips this step and releases that version as it is.
# 4. build and merge: both images, both platforms, from the merged commit,
#    pushed as ghcr.io/<owner>/$IMAGE_NAME:<version> and
#    $RENDER_IMAGE_NAME:<version> (the env block below, the one place the
#    names live; a fork pushes to its own namespace), checked, attested and
#    signed. No `latest` tag: deployments pin a version and its digest.
# 5. publish: the v<version> tag on that commit, then the GitHub release with
#    the CHANGELOG section and each image's tag@digest; a candidate is a
#    prerelease and never "Latest". GITHUB_TOKEN writes both; a tag it
#    pushes starts no workflow, so nothing builds twice.
#
# dry_run does 1, 2 and 4 against a registry on the runner: the plan, the
# notes and the image tags are in the run summary, nothing is committed,
# pushed, tagged or published. Its images are built from the commit the run
# started on, labelled with the planned version.
#
# Each platform builds on a runner of its own architecture, arm64 on
# GitHub's native arm64 runner: under QEMU on one amd64 runner the two
# builds took 6.5 of the v0.5.0 release's 11 minutes. Each leg pushes its
# image by digest, untagged; the merge job joins the legs into one index per
# image and tags that.
#
# Supply chain (docs/development.md, "Verifying an image"): each image
# carries BuildKit's SLSA provenance and an SPDX SBOM per platform in its
# index; the merge job checks both on the merged index. The SBOMs are also
# kept as the run's artifact. In a public repository the run adds GitHub
# artifact attestations (build provenance and the SBOMs, `gh attestation
# verify`) and a keyless cosign signature of each index, both through
# Sigstore's public log. The visibility test fails closed.
#
# A pull request that touches the build or the release tooling runs plan
# (the dry version sha-<commit>), build and merge as a dry run. Its tests
# are ci.yml's own run on that pull request.
#
# Every job carries `github.repository_id == '1464458020'` (this
# repository): mirror.yml force-pushes main to the private CI mirror, and
# nothing here may run there (tests/test_workflow_guard.py).
name: release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "stable = X.Y.Z; rc = a release candidate X.Y.Z-rc.N (a prerelease)"
        type: choice
        default: rc
        options: [rc, stable]
      bump:
        description: "auto = patch, or the open candidate series (rc: next candidate; stable: its final)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      dry_run:
        description: "Dry run: plan, notes, tests and image builds; nothing pushed, tagged or published"
        type: boolean
        default: true
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - tools/release/**

env:
  IMAGE_NAME: wow-mcp
  RENDER_IMAGE_NAME: wow-mcp-render
  PUBLIC: ${{ github.event.repository.visibility == 'public' }}
  # Images, tag and release only from a real run of the button.
  PUSH: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
  # The dry run's local registry (distribution 3), pinned by digest.
  LOCAL_REGISTRY_IMAGE: docker.io/library/registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c

permissions:
  contents: read

# One release at a time, never cancelled; a pull request's dry run is
# replaced by its next push.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.repository_id == '1464458020'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.v.outputs.mode }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sha: ${{ steps.v.outputs.sha }}
      image: ${{ steps.names.outputs.image }}
      render-image: ${{ steps.names.outputs.render-image }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The v* tags: release.py checks whether the tree's version has one.
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Version
        id: v
        env:
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            printf 'mode=dry\nversion=sha-%s\ntag=\nprerelease=false\n' "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PUSH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release runs on main; on $GITHUB_REF only a dry run works."
            exit 1
          fi
          release() { uv run --no-project python tools/release/release.py "$@"; }
          plan=$(release plan --channel "$CHANNEL" --bump "$BUMP")
          echo "$plan" >> "$GITHUB_OUTPUT"
          mode=$(sed -n 's/^mode=//p' <<<"$plan")
          version=$(sed -n 's/^version=//p' <<<"$plan")
          # The release commit, applied here only to show it (prepare makes it).
          [ "$mode" = tag ] || release apply "$version" >/dev/null
          release notes "$version" > "$RUNNER_TEMP/notes.md"
          {
            if [ "$PUSH" = true ]; then echo "### Releasing v$version"; else echo "### Dry run: would release v$version"; fi
            echo
            echo "Channel \`$CHANNEL\`, bump \`$BUMP\`, from $(sed -n 's/^version = "\(.*\)"/\1/p' <<<"$(git show HEAD:pyproject.toml)") at \`${GITHUB_SHA:0:12}\`."
            if [ "$mode" = tag ]; then
              echo "main already carries $version, untagged: tag it as it is."
            else
              echo "The release commit (a pull request, merged when its checks pass):"
              echo; echo '```'; git diff --stat; echo '```'
            fi
            echo; echo "#### Notes"; echo; cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Registry names are lowercase; an owner name may not be.
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          registry=ghcr.io
          [ "$PUSH" = true ] || registry=localhost:5000
          echo "image=$registry/$owner/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          # The renderer (Dockerfile target renderer): past levels' pictures,
          # in a container of its own with Chromium (docs/architecture.md).
          echo "render-image=$registry/$owner/$RENDER_IMAGE_NAME" >> "$GITHUB_OUTPUT"
          {
            echo; echo "#### Images"; echo
            echo "- \`ghcr.io/$owner/$IMAGE_NAME:$VERSION\`"
            echo "- \`ghcr.io/$owner/$RENDER_IMAGE_NAME:$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    if: github.repository_id == '1464458020' && github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
    # ci.yml's image job logs in to dhi.io with DOCKERHUB_USERNAME/_TOKEN.
    secrets: inherit

  # The release commit, through main's ruleset like any change. The CI
  # GitHub App (variable CI_APP_CLIENT_ID, secret CI_APP_PRIVATE_KEY) opens
  # the PR so its checks run, and auto-merge squashes it when they pass.
  prepare:
    needs: [plan, test]
    if: github.repository_id == '1464458020' && needs.plan.outputs.mode == 'prepare' && github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-24.04
    # The PR's checks take about 20 minutes (the Windows job, the image).
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Mint the App's token for this repository
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Release pull request, merged when its checks pass
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ] \
            || { echo "::error::main moved since this run started: run it again."; exit 1; }
          release() { uv run --no-project python tools/release/release.py "$@"; }
          release apply "$VERSION"
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git switch -qc "$branch"
          git commit -qam "Release $VERSION"
          gh auth setup-git
          git push -qf origin "HEAD:refs/heads/$branch"
          {
            echo "The release commit for v$VERSION: the version in every file that carries it, and CHANGELOG.md's \"Unreleased\" under its heading. The release run merges it once the checks pass, then builds, tags and publishes."
            echo
            release notes "$VERSION"
          } > "$RUNNER_TEMP/body.md"
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head "$branch" --title "Release $VERSION" --body-file "$RUNNER_TEMP/body.md" | grep -oE '[0-9]+$')
          else
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          fi
          echo "Release PR: #$pr"
          gh pr merge "$pr" --auto --squash --match-head-commit "$(git rev-parse HEAD)"
          for _ in $(seq 100); do
            sleep 30
            read -r state sha < <(gh pr view "$pr" --json state,mergeCommit --jq '"\(.state) \(.mergeCommit.oid // "")"')
            case "$state" in
              MERGED) echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "Merged as $sha"; exit 0 ;;
              CLOSED) echo "::error::#$pr was closed without merging."; exit 1 ;;
            esac
            failed=$(gh pr view "$pr" --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED" or .state == "FAILURE" or .state == "ERROR")] | map(.name // .context) | join(", ")')
            [ -z "$failed" ] || { echo "::error::#$pr: $failed failed. Fix main, then run the release again."; exit 1; }
          done
          echo "::error::#$pr not merged after 50 minutes"; exit 1

  # One leg per image and platform, each on a runner of that architecture.
  build:
    needs: [plan, test, prepare]
    # The tests skip on a pull request (ci.yml runs there on its own), and
    # prepare when there's no release commit to make (a dry run, a tree that
    # already carries its version). A fork's pull request can't read the
    # dhi.io credentials the main image's base needs (ci.yml's image-fork job
    # says so on that run): no dry run there.
    if: ${{ github.repository_id == '1464458020' && !cancelled() && needs.plan.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: build (${{ matrix.target }}, ${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        target: [runtime, renderer]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ matrix.target == 'runtime' && needs.plan.outputs.image || needs.plan.outputs.render-image }}
      # The merged release commit, else the commit the run started on.
      SHA: ${{ needs.prepare.outputs.sha || needs.plan.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
      - name: Local registry (dry run)
        if: env.PUSH != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/registry"
          docker run -d --name registry --user "$(id -u):$(id -g)" -p 127.0.0.1:5000:5000 \
            -v "$RUNNER_TEMP/registry:/var/lib/registry" "$LOCAL_REGISTRY_IMAGE"
          for _ in $(seq 30); do curl -fs http://localhost:5000/v2/ >/dev/null && exit 0; sleep 1; done
          docker logs registry; exit 1
      # network=host: BuildKit's container reaches the dry run's registry on
      # localhost. Nothing else changes for a push to GHCR.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The main image's base is a Docker Hardened Image: dhi.io takes no
      # anonymous pulls (ci.yml's image job says where the token lives).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The leg's index holds its image and the attestation manifest
      # (provenance, SBOM); imagetools create keeps both in the merged index.
      # The index annotations GHCR shows are set there, not here.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ env.SHA }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          LEG: ${{ matrix.target }}-${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$LEG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          retention-days: 1
      # The dry run hands its registry to the merge job without the image
      # layers (hundreds of MB for the renderer): the index, manifests,
      # configs and attestations are all the merge and its checks read.
      - name: Registry without the layers (dry run)
        if: env.PUSH != 'true'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          blobs="$RUNNER_TEMP/registry/docker/registry/v2/blobs/sha256"
          docker buildx imagetools inspect --raw "$REF" \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | .digest' \
            | while read -r m; do docker buildx imagetools inspect --raw "${REF%@*}@$m" | jq -r '.layers[].digest'; done \
            | while read -r d; do h=${d#sha256:}; rm -rf "${blobs:?}/${h:0:2}/$h"; done
          du -sh "$RUNNER_TEMP/registry"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUSH != 'true'
        with:
          name: registry-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/registry/
          retention-days: 1

  merge:
    needs: [plan, prepare, build]
    if: ${{ github.repository_id == '1464458020' && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Sigstore's signing certificate (attestations, cosign), from the run's OIDC token.
      id-token: write
      attestations: write
    outputs:
      main: ${{ steps.index.outputs.main }}
      render: ${{ steps.index.outputs.render }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: ${{ needs.plan.outputs.image }}
      RENDER_IMAGE: ${{ needs.plan.outputs.render-image }}
      REVISION: ${{ needs.prepare.outputs.sha || needs.plan.outputs.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      # The legs' registries, merged: blobs and links are content-addressed,
      # so the same path from two legs holds the same bytes.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PUSH != 'true'
        with:
          pattern: registry-*
          path: ${{ runner.temp }}/registry
          merge-multiple: true
      - name: Local registry (dry run)
        if: env.PUSH != 'true'
        run: |
          docker run -d --name registry --user "$(id -u):$(id -g)" -p 127.0.0.1:5000:5000 \
            -v "$RUNNER_TEMP/registry:/var/lib/registry" "$LOCAL_REGISTRY_IMAGE"
          for _ in $(seq 30); do curl -fs http://localhost:5000/v2/ >/dev/null && exit 0; sleep 1; done
          docker logs registry; exit 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the legs into one tagged index per image
        id: index
        run: |
          set -euo pipefail
          merge() {
            local key=$1 image=$2 target=$3 description=$4 f body
            local refs=()
            for f in "$RUNNER_TEMP/digests/$target"-*; do refs+=("$image@$(cat "$f")"); done
            # The index's own annotations: GHCR shows a multi-arch package's
            # description and repository link from these, not from the labels.
            local args=(
              --annotation "index:org.opencontainers.image.source=$SOURCE_URL"
              --annotation "index:org.opencontainers.image.licenses=GPL-3.0-only"
              --annotation "index:org.opencontainers.image.version=$VERSION"
              --annotation "index:org.opencontainers.image.revision=$REVISION"
              --annotation "index:org.opencontainers.image.description=$description"
              --tag "$image:$VERSION"
            )
            if [ "$PUSH" = true ]; then
              docker buildx imagetools create "${args[@]}" "${refs[@]}"
            else
              # imagetools create would copy every layer, and the dry run's
              # legs dropped them: push the index it would have pushed.
              body=$(docker buildx imagetools create --dry-run "${args[@]}" "${refs[@]}")
              printf '%s' "$body" > "$RUNNER_TEMP/index.json"
              curl -fsS -X PUT -H "Content-Type: $(jq -r .mediaType "$RUNNER_TEMP/index.json")" \
                --data-binary "@$RUNNER_TEMP/index.json" \
                "http://localhost:5000/v2/${image#localhost:5000/}/manifests/$VERSION"
            fi
            echo "$key=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{ json .Manifest }}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
          }
          merge main "$IMAGE" runtime "wow-stats: a WoW Forever leveling log, its web page and its MCP server"
          merge render "$RENDER_IMAGE" renderer "wow-stats renderer: past levels' pictures in a headless Chromium"
      # On the merged index: every leg's platform, its provenance and its
      # SPDX SBOM (one file per image and platform), and the annotations.
      - name: Check the indexes, keep the SBOMs
        env:
          MAIN: ${{ env.IMAGE }}@${{ steps.index.outputs.main }}
          RENDER: ${{ env.RENDER_IMAGE }}@${{ steps.index.outputs.render }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          check() {
            local ref=$1 name=$2 target=$3 want got p arch
            want=$(cd "$RUNNER_TEMP/digests" && for f in "$target"-*; do echo "linux/${f#"$target"-}"; done | sort | paste -sd' ')
            got=$(docker buildx imagetools inspect "$ref" --format '{{ json .Manifest }}' \
              | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(" ")')
            [ "$got" = "$want" ] || { echo "::error::$ref has platforms '$got', the legs built '$want'"; exit 1; }
            docker buildx imagetools inspect "$ref" --format '{{ json .Manifest }}' \
              | jq -e --arg s "$SOURCE_URL" '.annotations["org.opencontainers.image.source"] == $s' >/dev/null \
              || { echo "::error::$ref lacks its index annotations"; exit 1; }
            for p in $want; do
              arch=${p#linux/}
              docker buildx imagetools inspect "$ref" --format "{{ json (index .Provenance \"$p\").SLSA }}" \
                | jq -e 'type == "object" and length > 0' >/dev/null \
                || { echo "::error::$ref has no provenance for $p"; exit 1; }
              docker buildx imagetools inspect "$ref" --format "{{ json (index .SBOM \"$p\").SPDX }}" > "sbom/$name-$arch.spdx.json"
              jq -e '.spdxVersion and (.packages | length > 0)' "sbom/$name-$arch.spdx.json" >/dev/null \
                || { echo "::error::sbom/$name-$arch.spdx.json is not an SPDX document"; exit 1; }
            done
            echo "$ref: $got, each with provenance and an SBOM"
          }
          check "$MAIN" "$IMAGE_NAME" runtime
          check "$RENDER" "$RENDER_IMAGE_NAME" renderer
          ls -l sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ env.VERSION }}
          path: sbom/
          retention-days: 90

      # Public repository only (see the header), and never from a dry run.
      - name: Attest the image's build provenance
        if: env.PUBLIC == 'true' && env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.main }}
          push-to-registry: true
          # Storage records are for organization-owned repositories only.
          create-storage-record: false
      - name: Attest the renderer's build provenance
        if: env.PUBLIC == 'true' && env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.RENDER_IMAGE }}
          subject-digest: ${{ steps.index.outputs.render }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the image's SBOM (amd64)
        if: env.PUBLIC == 'true' && env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.main }}
          sbom-path: sbom/${{ env.IMAGE_NAME }}-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the image's SBOM (arm64)
        if: env.PUBLIC == 'true' && env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.main }}
          sbom-path: sbom/${{ env.IMAGE_NAME }}-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the renderer's SBOM (amd64)
        if: env.PUBLIC == 'true' && env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.RENDER_IMAGE }}
          subject-digest: ${{ steps.index.outputs.render }}
          sbom-path: sbom/${{ env.RENDER_IMAGE_NAME }}-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the renderer's SBOM (arm64)
        if: env.PUBLIC == 'true' && env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.RENDER_IMAGE }}
          subject-digest: ${{ steps.index.outputs.render }}
          sbom-path: sbom/${{ env.RENDER_IMAGE_NAME }}-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUBLIC == 'true' && env.PUSH == 'true'
      - name: Sign both indexes (keyless, Sigstore)
        if: env.PUBLIC == 'true' && env.PUSH == 'true'
        env:
          MAIN: ${{ env.IMAGE }}@${{ steps.index.outputs.main }}
          RENDER: ${{ env.RENDER_IMAGE }}@${{ steps.index.outputs.render }}
        run: cosign sign --yes "$MAIN" "$RENDER"

      - name: Summary
        env:
          MAIN: ${{ env.IMAGE }}:${{ env.VERSION }}@${{ steps.index.outputs.main }}
          RENDER: ${{ env.RENDER_IMAGE }}:${{ env.VERSION }}@${{ steps.index.outputs.render }}
        run: |
          if [ "$PUSH" = true ]; then title="Pushed"; else title="Dry run, nothing pushed"; fi
          {
            echo "### $title"
            echo "\`$MAIN\`"
            echo "\`$RENDER\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$MAIN"
          echo "$RENDER"

  # The point of no return, once both images are pushed, checked and signed.
  publish:
    needs: [plan, prepare, merge]
    if: ${{ github.repository_id == '1464458020' && !cancelled() && needs.merge.result == 'success' && github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      SHA: ${{ needs.prepare.outputs.sha || needs.plan.outputs.sha }}
      MAIN: ${{ needs.plan.outputs.image }}:${{ needs.plan.outputs.version }}@${{ needs.merge.outputs.main }}
      RENDER: ${{ needs.plan.outputs.render-image }}:${{ needs.plan.outputs.version }}@${{ needs.merge.outputs.render }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            uv run --no-project python tools/release/release.py notes "$VERSION"
            echo
            echo "### Images"
            echo
            echo "Pin by digest (docs/development.md, \"Verifying an image\"):"
            echo
            echo "- \`$MAIN\`"
            echo "- \`$RENDER\`"
          } > "$RUNNER_TEMP/notes.md"
          # A tag left by an interrupted run is reused only on the same commit.
          have=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          if [ -z "$have" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          elif [ "$have" != "$SHA" ]; then
            echo "::error::$TAG already points at $have, not $SHA"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already released"; exit 1
          fi
          flags=(--verify-tag --title "wow-mcp $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}"
          echo "### Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
