# Secrets scan (CI's audit job, gitleaks): the default rules, minus three
# proven false positives, matched on the value's exact shape. Add an entry
# only with its reason. No `paths` allowlists: gitleaks skips a listed file
# whole, whatever `condition` says (checked with a canary token, 8.30.1).
[extend]
useDefault = true

[[allowlists]]
description = "shipper/wow_stats.py UPDATE_KEY: the release key's PUBLIC half, pinned on purpose (docs/shipper.md, Auto-update)"
regexes = ['''UPDATE_KEY = "[0-9a-f]{64}"''']
regexTarget = "line"

[[allowlists]]
description = "data/kb/watch.json keys: Blizzard news article ids (blizzard-news-<number>), not API keys"
regexes = ['''^blizzard-news-\d+$''']
regexTarget = "secret"

[[allowlists]]
description = "tests/mcp/oidc_standin.py: the tests' OIDC stand-in client secret, a fixed test value"
regexes = ['''^standin-secret-[0-9a-f]+$''']
regexTarget = "secret"

[[allowlists]]
description = "docs/self-host/reverse-proxy.md: the doc's placeholder login in a curl example (me:'your password'), not a credential; it stays in the history of #81"
regexes = ['''^me:'your password'$''']
regexTarget = "secret"
