# Every environment variable wow-stats reads, for docs/reference/environment.md.
#
# tools/manual/generate.py renders the page from this file; tests/test_manual.py
# fails when a variable the code reads is missing here, when one listed here
# is read nowhere, when a literal default in the code disagrees with
# `default`, or when a compose service sets a variable whose `read_by`
# doesn't name that service. Add the variable here in the same change.
#
# read_by: ui (wow-stats ui; also mcp-stdio, which runs in the same
# container), publish, static, exporter, render, users (wow-stats users),
# shipper (the player's script), installer (the per-person install command),
# compose (deploy/compose/.env only: compose reads it, no program does).
# default: shown as written; a literal value goes in backticks.
# group: the section of the page (GROUPS in generate.py sets the order).

# ---------------------------------------------------------------- the page

[VIEW]
group = "page"
read_by = ["ui"]
type = "`full` or `public`"
default = "`full` on a loopback `BIND`, else required"
example = "`public`"
what = "Which view this process serves. One process serves one view, so a routing mistake can't hand the full view to an outsider."

[AUTH]
group = "page"
read_by = ["ui"]
type = "`none`, `open`, `proxy` or `basic`"
default = "`none` on a loopback `BIND`, else required"
example = "`proxy`"
what = "The page's login. `none`: loopback only. `open`: no login, on purpose. `proxy`: a reverse proxy in front logs people in. `basic`: HTTP basic auth."

[BIND]
group = "page"
read_by = ["ui", "static", "render"]
type = "address"
default = "`0.0.0.0` in the image, `127.0.0.1` outside it"
example = "`127.0.0.1`"
what = "The address the server listens on."

[PORT]
group = "page"
read_by = ["ui", "static", "render"]
type = "port"
default = "`8080` (`8083` for `render`)"
example = "`8080`"
what = "The port the server listens on."

[BASIC_AUTH_USER]
group = "page"
read_by = ["ui"]
type = "text"
default = "empty"
example = "`me`"
what = "The user name for `AUTH=basic`."

[BASIC_AUTH_PASSWORD]
group = "page"
read_by = ["ui"]
type = "secret, 12+ characters"
default = "empty"
example = "a long random string"
what = "The password for `AUTH=basic`. Prefer `BASIC_AUTH_PASSWORD_FILE`."

[BASIC_AUTH_PASSWORD_FILE]
group = "page"
read_by = ["ui"]
type = "path"
default = "empty"
example = "`/run/secrets/basic_password`"
what = "A file holding the `AUTH=basic` password. Wins over `BASIC_AUTH_PASSWORD`."

[DEFAULT_CHAR]
group = "page"
read_by = ["ui", "publish"]
type = "`Name-Surname`"
default = "empty: the character seen last"
example = "`Testchar-Demo`"
what = "The character the page and the MCP tools open on."


[WEIGHTS]
group = "page"
read_by = ["ui", "publish"]
type = "comma list of `Name-Surname:spec`"
default = "empty: what the addons say"
example = "`Testchar-Demo:shadow`"
what = "The spec each character's gear is scored for. The page's own selector still wins."

[PRICE_DAYS]
group = "page"
read_by = ["ui", "publish"]
type = "days"
default = "`90`"
example = "`30`"
what = "Days of Auctionator scans in the prices panel."

[CACHE_TTL]
group = "page"
read_by = ["ui", "publish"]
type = "seconds"
default = "`45`"
example = "`45`"
what = "How long an answer worked out when asked stays in memory. A plain open of the page gets the answers built in the background once per new data instead."

[FULL_DOOR_PATH]
group = "page"
read_by = ["ui"]
type = "path"
default = "`/full/`"
example = "empty"
what = "The login door of the full view on a shared host: it answers with a redirect to `/`. Empty turns it off, for a full view on its own host."

[STATIC_DIR]
group = "dev"
read_by = ["ui"]
type = "path"
default = "the packaged `web/`"
example = "`./web`"
what = "Serve the page's files from another folder. For working on the page."

[WOW_TIMEZONE]
group = "page"
read_by = ["ui", "publish"]
type = "IANA timezone"
default = "`Europe/Brussels`"
example = "`America/New_York`"
what = "The player's timezone, for the hours and weekdays the analysis reads."

[RENDER_FROM]
group = "page"
read_by = ["ui"]
type = "URL"
default = "empty: no picture, the 3D toggle"
example = "`http://site:8080`"
what = "Where the full view gets a character's picture: the publisher's still of the 3D model, in the static site's bundles. Set it to the static site's address."

# ---------------------------------------------------------------- shipper uploads

[INGEST_PASSWORD]
group = "ingest"
read_by = ["ui", "compose"]
type = "secret, 12+ characters"
default = "empty: no `/ingest`"
example = "a long random string"
what = "Turns on `POST /ingest`, where the shipper sends events, with this password. Required by the compose kit."

[INGEST_PASSWORD_FILE]
group = "ingest"
read_by = ["ui"]
type = "path"
default = "empty"
example = "`/run/secrets/ingest_password`"
what = "A file holding the ingest password. Wins over `INGEST_PASSWORD`."

[INGEST_USER]
group = "ingest"
read_by = ["ui"]
type = "text"
default = "`wow`"
example = "`wow`"
what = "The user name the shipper sends with the ingest password."

# ---------------------------------------------------------------- stores

[VL_URL]
group = "stores"
read_by = ["ui", "publish"]
type = "URL"
default = "`http://victorialogs:9428`"
example = "`http://victorialogs:9428`"
what = "The VictoriaLogs that holds the game events. Keep it private: only `ui` and `publish` talk to it."

[VL_ARCHIVE_URL]
group = "stores"
read_by = ["ui", "publish"]
type = "URL"
default = "empty: one store holds everything"
example = "`http://vl-archive:9428`"
what = "A second VictoriaLogs for days older than `VL_ARCHIVE_AFTER_DAYS`."

[VL_ARCHIVE_AFTER_DAYS]
group = "stores"
read_by = ["ui", "publish"]
type = "days"
default = "`89`"
example = "`89`"
what = "With `VL_ARCHIVE_URL`: days older than this are read from the archive."

[VL_ACCOUNT_ID]
group = "stores"
read_by = ["ui", "publish"]
type = "whole number"
default = "`0`"
example = "`0`"
what = "The VictoriaLogs tenant to read. Set per person by a shared install; leave it alone otherwise."

[VL_CONCURRENCY]
group = "stores"
read_by = ["ui", "publish"]
type = "number"
default = "`2`"
example = "`2`"
what = "VictoriaLogs requests this process runs at once, all callers together."

[LOGS_FILTER]
group = "stores"
read_by = ["ui", "publish"]
type = "LogsQL filter"
default = "`feed:wow-*`"
example = "`feed:wow-* site:home`"
what = "Selects the game events in VictoriaLogs. Add your own labels here."

[VM_URL]
group = "stores"
read_by = ["ui", "publish", "compose"]
type = "URL"
default = "empty: no Battle.net data"
example = "`http://victoriametrics:8428`"
what = "The VictoriaMetrics the exporter pushes to. The public view reads only the character profile from it, never market data."

# ---------------------------------------------------------------- items and 3D

[MODEL3D]
group = "items"
read_by = ["ui", "publish", "compose"]
type = "`on` or `off`"
default = "`on`"
example = "`off`"
what = "The \"View in 3D\" toggle: the character drawn from the game files your shipper sends (nothing downloaded). `off` removes it, and the shipper stops sending them."

[WOW_ITEMS]
group = "items"
read_by = ["ui", "publish", "compose"]
type = "`on` or `off`"
default = "`on`"
example = "`off`"
what = "Item names, icons and tooltip cards from Forever's tables on wago.tools. `off` with `MODEL3D=off` is the small preset: no downloads at all."

[WOW_TALENTS]
group = "items"
read_by = ["ui", "publish"]
type = "`on` or `off`"
default = "`on` (`off` when `WOW_ITEMS=off`)"
example = "`off`"
what = "Talent names and icons from Forever's tables."

[KB_GAME_TABLES]
group = "items"
read_by = ["ui", "publish"]
type = "`on` or `off`"
default = "`on`"
example = "`off`"
what = "The knowledge base's spell and zone documents from Forever's tables."

[MODEL3D_CACHE_DIR]
group = "items"
read_by = ["ui", "publish"]
type = "path"
default = "a folder under the temp dir"
example = "`/data/model3d-cache`"
what = "Where downloaded game tables and icons are kept, and the 3D answers. Put it on a volume so a restart doesn't download them again."

[MODEL3D_ASSETS_DIR]
group = "items"
read_by = ["ui", "publish", "compose"]
type = "path"
default = "`<MODEL3D_CACHE_DIR>/assets`"
example = "`/data/model3d-assets`"
what = "Where the game files the shipper sends for the 3D view are kept. With several people, each one's are in their own folder (`users/<id>/assets`) and go when the person is removed; this setting is then ignored. The publisher reads the ui's folder (read-only) to bundle each character's files."

[MODEL3D_ASSETS_URL]
group = "people"
read_by = ["publish"]
type = "URL"
default = "set per person from `USERS_URL`"
example = "`http://ui:8082/assets/alex/`"
what = "Where the publisher reads one person's 3D files: the full view's share port. Set by the publisher itself with several people; leave it unset."

[ITEM_FACTS_DIR]
group = "items"
read_by = ["ui", "publish", "compose"]
type = "path"
default = "`<MODEL3D_CACHE_DIR>/item-facts`"
example = "`/data/item-facts`"
what = "Where the item facts each person's shipper reads from their game's hotfix cache are kept (items the reference doesn't have yet). With several people, each one's are in their own folder (`users/<id>/items`) and go when the person is removed; this setting is then ignored. The publisher reads the ui's folder (read-only)."

[ITEM_FACTS_URL]
group = "people"
read_by = ["publish"]
type = "URL"
default = "set per person from `USERS_URL`"
example = "`http://ui:8082/items/alex/`"
what = "Where the publisher reads one person's item facts: the full view's share port. Set by the publisher itself with several people; leave it unset."

[MODEL3D_ASSETS_MB]
group = "items"
read_by = ["ui"]
type = "MiB"
default = "`512`"
example = "`1024`"
what = "The most disk one person's 3D files may take; past it an upload gets a 507 and the shipper stops sending."

[MODEL3D_MODELS]
group = "items"
read_by = ["ui", "publish"]
type = "`hd` or `sd`"
default = "`hd`"
example = "`sd`"
what = "The models the 3D view opens on: `hd` the updated ones, `sd` the original (Classic) ones. A visitor's own pick in the view wins. With several people, each one's Settings choice replaces it."

[MODEL3D_WAGO_URL]
group = "dev"
read_by = ["ui", "publish"]
type = "URL"
default = "`https://wago.tools`"
example = "`http://127.0.0.1:9001`"
what = "Forever's game tables. Tests point it at a local server."

[MODEL3D_PRODUCT]
group = "dev"
read_by = ["ui", "publish"]
type = "text"
default = "`wowf`"
example = "`wowf`"
what = "The game build family read on wago.tools."

[ICON_URL]
group = "dev"
read_by = ["ui", "publish"]
type = "URL"
default = "`https://wow.zamimg.com/images/wow/icons/`"
example = "`http://127.0.0.1:9000/icons/`"
what = "Where item icons are fetched. Tests point it at a local server."

[ROUTE_REFERENCE_FILE]
group = "items"
read_by = ["ui", "publish"]
type = "path or `off`"
default = "the bundled Polestar route times"
example = "`off`"
what = "Another route times file, or `off` to compare levels with your own past levels only."

[GEAR_REFERENCE_FILE]
group = "items"
read_by = ["ui", "publish"]
type = "path or `off`"
default = "the bundled Polestar gear data"
example = "`off`"
what = "Another gear data file, or `off` to turn gear advice off."

# ---------------------------------------------------------------- MCP

[MCP_PUBLIC_URL]
group = "mcp"
read_by = ["ui", "publish", "compose"]
type = "https URL ending in `/mcp`"
default = "empty: no MCP endpoint"
example = "`https://wow.example.org/mcp`"
what = "Turns on the MCP endpoint (full view only) and names the address clients use. The help page shows it too."

[MCP_PORT]
group = "mcp"
read_by = ["ui"]
type = "port"
default = "`8090`"
example = "`8090`"
what = "The MCP endpoint's own port, on `BIND`. `/mcp` and the login paths are served there, never on `PORT`."

[MCP_AUTH]
group = "mcp"
read_by = ["ui"]
type = "`oauth` or `none`"
default = "`oauth`"
example = "`none`"
what = "`none` (no login) only works on a loopback `BIND`."

[MCP_LOGIN]
group = "mcp"
read_by = ["ui"]
type = "`oidc`"
default = "`oidc`"
example = "`oidc`"
what = "The only value. The old `password` login is gone: the server refuses to start with it."

[MCP_SIGNING_KEY_FILE]
group = "mcp"
read_by = ["ui", "compose"]
type = "path, 32+ random bytes"
default = "empty: a random key per start"
example = "`/run/wow-secrets/mcp_signing_key`"
what = "Signs the MCP tokens and encrypts the stored logins. Without it, every restart logs every client out."

[MCP_STATE_DIR]
group = "mcp"
read_by = ["ui"]
type = "path"
default = "empty: memory only"
example = "`/data/mcp`"
what = "Keeps client registrations and logins (encrypted) across restarts."

[MCP_REDIRECT_URIS]
group = "mcp"
read_by = ["ui"]
type = "comma list of URLs"
default = "the web callbacks of claude.ai, ChatGPT, VS Code and Cursor, plus loopback"
example = "`https://claude.ai/api/mcp/auth_callback`"
what = "Replaces the list of redirects a registering client may use."

[MCP_CIMD_HOSTS]
group = "mcp"
read_by = ["ui"]
type = "comma list of hosts"
default = "Claude, ChatGPT/Codex, opencode, VS Code, Copilot CLI, Zed, Goose"
example = "`claude.ai`"
what = "Replaces the list of hosts whose client documents (a URL as client id) are fetched."

[MCP_ALLOWED_ORIGINS]
group = "mcp"
read_by = ["ui"]
type = "comma list of origins"
default = "empty"
example = "`https://inspector.example.org`"
what = "Extra browser origins allowed to call `/mcp`."

[OIDC_ISSUER]
group = "mcp"
read_by = ["ui", "compose"]
type = "https URL"
default = "empty"
example = "`https://id.example.org/realms/wow`"
what = "Your identity provider (its discovery document lives under this address). Required with `MCP_PUBLIC_URL`."

[OIDC_CLIENT_ID]
group = "mcp"
read_by = ["ui", "compose"]
type = "text"
default = "empty"
example = "`wow-mcp`"
what = "The app's client id at your identity provider."

[OIDC_CLIENT_SECRET_FILE]
group = "mcp"
read_by = ["ui", "compose"]
type = "path"
default = "`/run/wow-secrets/oidc_client_secret` in the compose kit"
example = "`/run/wow-secrets/oidc_client_secret`"
what = "A file holding the app's client secret."

[OIDC_CLIENT_SECRET]
group = "mcp"
read_by = ["ui"]
type = "secret"
default = "empty"
example = "use the `_FILE` form"
what = "The client secret itself, when `OIDC_CLIENT_SECRET_FILE` isn't set. Prefer the file."

[OIDC_ALLOWED_SUBS]
group = "mcp"
read_by = ["ui", "compose"]
type = "comma list"
default = "empty"
example = "`3f2c9a10-...`"
what = "The account ids (`sub` claim) allowed in. Required on a one-person install."

[OIDC_REQUIRED_ROLE]
group = "mcp"
read_by = ["ui"]
type = "text"
default = "empty"
example = "`wow`"
what = "One-person install: a role the account must have, read from `OIDC_ROLES_CLAIM`. Removing it ends the login at the next refresh."

[OIDC_ALLOWED_ORGS]
group = "mcp"
read_by = ["ui"]
type = "comma list"
default = "empty"
example = "`28437001`"
what = "One-person install: the organisation ids allowed, read from `OIDC_ORG_CLAIM`."

[OIDC_ROLES_CLAIM]
group = "mcp"
read_by = ["ui"]
type = "claim name"
default = "ZITADEL's project roles claim"
example = "`roles`"
what = "The claim that holds the roles. Set your provider's."

[OIDC_ORG_CLAIM]
group = "mcp"
read_by = ["ui"]
type = "claim name"
default = "ZITADEL's org id claim"
example = "`org_id`"
what = "The claim that holds the organisation id. Set your provider's."

[OIDC_SCOPES]
group = "mcp"
read_by = ["ui"]
type = "space-separated scopes"
default = "`openid offline_access` (plus the org scope with `OIDC_ALLOWED_ORGS`)"
example = "`openid offline_access`"
what = "What the app asks the provider for."

[OIDC_BATTLENET_ORG_ID]
group = "mcp"
read_by = ["ui"]
type = "ZITADEL org id (digits)"
default = "empty: no Battle.net button"
example = "`28437001`"
what = "ZITADEL only, with `OIDC_BATTLENET_IDP_ID`: the org a \"Sign in with Battle.net\" button on the MCP consent page asks for. Both or neither."

[OIDC_BATTLENET_IDP_ID]
group = "mcp"
read_by = ["ui"]
type = "ZITADEL identity provider id (digits)"
default = "empty: no Battle.net button"
example = "`28437002`"
what = "ZITADEL only, with `OIDC_BATTLENET_ORG_ID`: the Battle.net identity provider that button starts at once. A new account lands in that org."

# ---------------------------------------------------------------- analysis

[ANALYSIS_STATE_DIR]
group = "analysis"
read_by = ["ui"]
type = "path"
default = "empty: off"
example = "`/data/analysis`"
what = "Where the play analysis and the session plans are kept (full view only). Put it on a volume."

[ANALYSIS_HOUR]
group = "analysis"
read_by = ["ui"]
type = "hour, 0 to 23"
default = "`4`"
example = "`4`"
what = "The local hour of the nightly recheck of kept findings."

[ANALYSIS_SHARE_PORT]
group = "analysis"
read_by = ["ui"]
type = "port"
default = "empty: off"
example = "`8082`"
what = "A bare listener that hands the screened analysis lines to the publisher. Never route it from outside."

[ANALYSIS_SHARE_URL]
group = "analysis"
read_by = ["publish"]
type = "URL"
default = "empty: none"
example = "`http://ui:8082/analysis.json`"
what = "Where the publisher reads those lines, for `/zogzog/`."

[ANALYSIS_PROVIDER]
group = "analysis"
read_by = ["ui"]
type = "`anthropic` or `openai`"
default = "`anthropic`"
example = "`openai`"
what = "Who runs the server's own play analysis: Anthropic's API, or `openai`: OpenAI itself through the Responses API, any other OpenAI-compatible endpoint (OpenRouter, Ollama, vLLM, LM Studio) through Chat Completions. Off until it has credentials, or for `openai` a model. See [Server-side analysis](../self-host/server-analysis.md)."

[ANALYSIS_MODEL]
group = "analysis"
read_by = ["ui"]
type = "model id"
default = "`claude-opus-5-5` with `anthropic`; required with `openai`"
example = "`claude-sonnet-5-5`"
what = "The model the server's own analysis runs on. It must support tool calling."

[ANALYSIS_API_KEY_FILE]
group = "analysis"
read_by = ["ui"]
type = "path"
default = "empty: none"
example = "`/run/secrets/analysis-key`"
what = "A file holding the AI provider's API key, read at the first run, never logged. Used when workload identity federation isn't set up; a local `openai` endpoint may need none. `ANTHROPIC_API_KEY` and `OPENAI_API_KEY` are never read."

[ANALYSIS_BASE_URL]
group = "analysis"
read_by = ["ui"]
type = "URL"
default = "empty: the provider's own API"
example = "`http://ollama:11434/v1`"
what = "The API's address: an OpenAI-compatible endpoint with `ANALYSIS_PROVIDER=openai`, or a proxy in front of Anthropic's. `ANTHROPIC_BASE_URL` and `OPENAI_BASE_URL` are never read."

[ANALYSIS_MONTHLY_BUDGET]
group = "analysis"
read_by = ["ui"]
type = "US dollars"
default = "`10`"
example = "`50`"
what = "What the server's own analysis may spend a calendar month (UTC), in USD, the currency the APIs bill in. A run that would likely cross it doesn't start. With `openai`, only when both prices below are set."

[ANALYSIS_MONTHLY_TOKENS]
group = "analysis"
read_by = ["ui"]
type = "tokens"
default = "empty: no cap"
example = "`20000000`"
what = "A cap in tokens (sent and received) a month, besides or instead of the money one: the cap for an endpoint with no prices."

[ANALYSIS_PRICE_INPUT_PER_MTOK]
group = "analysis"
read_by = ["ui"]
type = "US dollars"
default = "empty: cost unknown"
example = "`0.15`"
what = "With `openai`: what the endpoint charges per million prompt tokens. Set it and the next one to count money and apply the budget; Anthropic's prices are built in."

[ANALYSIS_PRICE_OUTPUT_PER_MTOK]
group = "analysis"
read_by = ["ui"]
type = "US dollars"
default = "empty: cost unknown"
example = "`0.60`"
what = "With `openai`: what the endpoint charges per million completion tokens."

[ANALYSIS_PRICE_CACHED_INPUT_PER_MTOK]
group = "analysis"
read_by = ["ui"]
type = "US dollars"
default = "empty: the input price"
example = "`0.015`"
what = "With `openai`: what the endpoint charges per million cached prompt tokens (OpenAI: a tenth of the input price or less). Most of a run's prompt is cached, so without it the count runs several times over the bill."

[ANALYSIS_AUTO]
group = "analysis"
read_by = ["ui"]
type = "`on` or `off`"
default = "`on`"
example = "`off`"
what = "Whether the page rebuild starts the server's own analysis after `ANALYSIS_STALE_PLAYED_HOURS` of play. Off: the server never runs one; players refresh from their own AI."

[ANALYSIS_STALE_PLAYED_HOURS]
group = "analysis"
read_by = ["ui"]
type = "hours of play"
default = "`10`"
example = "`6`"
what = "How much in-game play since a character's last analysis makes the server refresh it (the journal's sessions, one timer per character; a character never refreshed counts all its play on record). Any refresh of that character resets it: the server's, or a full analysis from the player's own AI (`analyse` or `dashboard_refresh`). This timer is the only thing that starts a server run."

[ANALYSIS_WIF_TOKEN_FILE]
group = "analysis"
read_by = ["ui"]
type = "path"
default = "empty: no federation"
example = "`/var/run/secrets/ai-token/token`"
what = "Workload identity federation, either provider: the identity token's file (a Kubernetes projected service account token), reread at each exchange as it rotates. With the provider's IDs below it comes before `ANALYSIS_API_KEY_FILE`. See [Server-side analysis](../self-host/server-analysis.md)."

[ANALYSIS_WIF_AUDIENCE]
group = "analysis"
read_by = ["ui"]
type = "string"
default = "`https://api.anthropic.com` with `anthropic`, `https://api.openai.com/v1` with `openai`"
example = "`https://api.openai.com/v1`"
what = "The audience the projected token must carry, checked before each client is made so a wrong volume says so instead of an opaque 401. Set it only when the provider was configured with another audience."

[ANALYSIS_WIF_RULE_ID]
group = "analysis"
read_by = ["ui"]
type = "id"
default = "empty: none"
example = "`fdrl_...`"
what = "With `anthropic`: the federation rule."

[ANALYSIS_WIF_ORGANIZATION_ID]
group = "analysis"
read_by = ["ui"]
type = "id"
default = "empty: none"
example = "an organization UUID"
what = "With `anthropic`: your organization."

[ANALYSIS_WIF_PROVIDER_ID]
group = "analysis"
read_by = ["ui"]
type = "id"
default = "empty: none"
example = "the Workload Identity Provider's id"
what = "With `openai`: the Workload Identity Provider (Organization settings, Security)."

[ANALYSIS_WIF_SERVICE_ACCOUNT_ID]
group = "analysis"
read_by = ["ui"]
type = "id"
default = "empty: none"
example = "`svac_...`"
what = "The service account the token is exchanged for: required with `openai`, optional with `anthropic`."

