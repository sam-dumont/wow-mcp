type = "`1` or empty"
default = "empty"
example = "`1`"
what = "`ALLOW_OPEN` for the `ui-public` service, when you publish it beyond `127.0.0.1`."

[WOW_SITE_HOST]
group = "compose"
read_by = ["compose"]
type = "host name"
default = "required by the proxy files"
example = "`wow.example.org`"
what = "The static sites' host, for `compose.caddy.yaml`, `compose.traefik.yaml` or `compose.nginx.yaml`. Point its DNS at the server."

[WOW_FULL_HOST]
group = "compose"
read_by = ["compose"]
type = "host name"
default = "required by the proxy files"
example = "`wow-full.example.org`"
what = "Your full view's and the MCP's host, for the proxy files. They also put it in `ALLOWED_HOSTS`."

[ACME_EMAIL]
group = "compose"
read_by = ["compose"]
type = "email address"
default = "required by `compose.traefik.yaml`"
example = "`you@example.org`"
what = "Where Let's Encrypt writes before a certificate expires (Traefik)."
