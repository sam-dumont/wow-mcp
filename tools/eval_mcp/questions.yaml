# The MCP check's questions (tools/eval_mcp/run.py, docs/development.md,
# "The MCP check"). Each has one short answer, computed from the demo
# character's data (answers.py, or the value a probe reads), never typed
# here: the expected answers follow the seed when it changes.
#
# Written after Anthropic's mcp-builder evaluation guide: read-only,
# independent, one answer each, stable (the demo's clock is frozen), and each
# needs the tools. The set spans the product: lookups, multi-tool questions,
# gear modes, hedges, plans, prices, people, the knowledge base, missing
# addons, unknown names, an injected player name, French.
#
# Keys:
#   id, group, persona, difficulty (easy | medium | hard), question
#   scenario   the demo's data as tests/degraded.py SCENARIOS (or answers.py
#              EXTRA_SCENARIOS) serves it; default full
#   answer     a maker in answers.py, `probe` (the first probe with a path:
#              its value), or NONE (the data can't tell: the model must say so)
#   match      text | number (within `tolerance`) | yesno | pct_line | none
#   also       other spellings a text answer may take
#   tools      the model's route: each entry is a|b|c, one of which must be
#              called (the model tier)
#   forbid     regexes the model's whole reply must not match
#   forbid_answers  answers that are wrong in a telling way (a maker or a list):
#              a long shot as the pick, an invented count
#   probes     the deterministic tier (probes.py): calls on the fixture
#              server, in order: {tool, args, path, then, equals, contains,
#              error, untrusted, holds}. A path must resolve; with no `equals`
#              its value must grade as the answer (holds: answer, the default),
#              hold it somewhere (holds: any) or only be there (holds: some);
#              `equals` pins it instead (null, 0, false).
#
# Every MCP tool needs a probe somewhere, or a reason in coverage.yaml.

# ---------------------------------------------------------------- lookups

- id: wow_stats_version
  group: lookup
  persona: leveller
  difficulty: easy
  question: Which version of wow-stats is answering this request?
  answer: wow_stats_version
  match: text
  tools: [data_status|character_summary]
  probes:
    - {tool: data_status, path: version}
    - {tool: data_status, path: data_versions.checked, holds: some}

- id: level_now
  group: lookup
  persona: leveller
  difficulty: easy
  question: What level is the character?
  answer: level_now
  match: number
  tools: [character_summary|levels|play_sql|query_metric]
  probes:
    - {tool: character_summary, path: level}

- id: gold_now
  group: lookup
  persona: leveller
  difficulty: easy
  question: How much gold does the character carry? Give whole gold pieces (drop the silver and copper).
  answer: gold_now
  match: number
  tools: [character_summary|mount_goal|play_sql|query_metric]
  probes:
    - {tool: character_summary, path: money_copper, then: ["div:10000", floor]}

- id: zone_now
  group: lookup
  persona: leveller
  difficulty: easy
  question: Which zone is the character in right now?
  answer: zone_now
  match: text
  tools: [character_summary|gear|play_sql]
  probes:
    - {tool: character_summary, path: zone}

- id: total_deaths
  group: lookup
  persona: leveller
  difficulty: easy
  question: How many times has the character died in all?
  answer: total_deaths
  match: number
  tools: [deaths|character_summary|sanity_check|play_sql|query_metric]
  probes:
    - {tool: deaths, path: total}

- id: deadliest_zone
  group: lookup
  persona: leveller
  difficulty: easy
  question: In which zone did the character die most often?
  answer: deadliest_zone
  match: text
  tools: [deaths|sanity_check|play_sql|query_metric]
  probes:
    - {tool: deaths, path: "by_zone[0].zone"}

- id: top_killer
  group: lookup
  persona: leveller
  difficulty: medium
  question: Which creature killed the character more often than any other? Give its name.
  answer: top_killer
  match: text
  tools: [sanity_check|deaths|play_sql]
  probes:
    - {tool: sanity_check, path: "deaths[*].killer.name", holds: any}

- id: latest_talent
  group: lookup
  persona: leveller
  difficulty: easy
  question: On what day did the character last change its talents? Give the date as YYYY-MM-DD.
  answer: probe
  match: text
  tools: [talent_changes|play_sql]
  probes:
    - {tool: talent_changes, path: "changes[0].date"}

- id: rested_xp
  group: lookup
  persona: returning
  difficulty: medium
  question: How much rested XP does the character have banked? Give the XP as a whole number.
  answer: rested_xp
  match: number
  tolerance: 10
  tools: [next_moves|plan_session|play_sql|character_summary]
  probes:
    - {tool: next_moves, contains: "rested XP banked"}

# ---------------------------------------------------------------- time, levels, ranges

- id: deaths_at_level
  group: time
  persona: leveller
  difficulty: medium
  question: How many times did the character die while it was level 32?
  answer: deaths_at_level_32
  match: number
  tools: [deaths|query_metric|play_sql]
  probes:
    - {tool: deaths, path: by_level.32}

- id: longest_break
  group: time
  persona: returning
  difficulty: medium
  question: >-
    What was the character's longest break between two play sessions, in hours?
    Give the number of hours with one decimal.
  answer: longest_break_h
  match: number
  tolerance: 0.2
  tools: [sessions|play_sql|query_metric|levels]
  probes:
    - {tool: play_sql, args: {char: Nibbet-Gearholt, query: "SELECT max(longest_gap_s) AS s FROM levels"}}
    - {tool: sessions, args: {limit: 50}, path: "sessions[*].start", holds: some}

- id: level_time
  group: time
  persona: leveller
  difficulty: easy
  question: How many minutes of played time did the character's level 27 take? Give whole minutes.
  answer: level_27_minutes
  match: number
  tolerance: 1
  tools: [levels|play_sql|query_metric]
  probes:
    - {tool: levels, args: {from_level: 27, to_level: 27}, path: "levels[0].seconds", then: ["div:60", floor]}

- id: recorder_missed
  group: time
  persona: leveller
  difficulty: hard
  question: >-
    Did the Recorder (Polestar_Recorder) miss any of the character's play time while it was
    level 32? Answer Yes or No.
  answer: recorder_missed_32
  match: yesno
  tools: [play_sql|levels|query_metric]
  probes:
    - {tool: play_sql, args: {char: Nibbet-Gearholt, query: "SELECT recorder_missed_s FROM levels WHERE level = 32"}}

- id: deaths_in_range
  group: time
  persona: returning
  difficulty: medium
  question: How many times did the character die between 10 and 16 November 2026 (both days included)?
  answer: deaths_10_16_nov
  match: number
  tools: [deaths|play_sql|query_metric]
  probes:
    - {tool: deaths, args: {since: "2026-11-10", until: "2026-11-16T23:59:59"}, path: total}

- id: zone_since
  group: time
  persona: returning
  difficulty: medium
  question: Since 14 November 2026, in which zone has the character spent the most time?
  answer: probe
  match: text
  tools: [zones|play_sql|query_metric]
  probes:
    - {tool: zones, args: {since: "2026-11-14"}, path: "zones[0].zone"}

- id: levels_range_hours
  group: time
  persona: leveller
  difficulty: medium
  question: >-
    How many hours of played time did levels 25 to 28 take altogether (four levels)? Give hours
    with one decimal.
  answer: levels_25_28_hours
  match: number
  tolerance: 0.1
  tools: [levels|play_sql|query_metric]
  probes:
    - {tool: levels, args: {from_level: 25, to_level: 28}, path: "levels[*].seconds", then: [sum, "div:3600"]}

- id: month_played_hours
  group: time
  persona: returning
  difficulty: hard
  question: >-
    How many hours did the character play over the last 30 days, all sessions together?
    Give whole hours.
  answer: month_played_hours
  match: number
  tolerance: 2
  tools: [sessions|character_summary|play_sql|query_metric]
  probes:
    - {tool: sessions, args: {since: "2026-10-19", limit: 200}, path: "sessions[*].dur", holds: some}

- id: steps_on_a_day
  group: time
  persona: leveller
  difficulty: medium
  question: >-
    How many steps of its Arathi Highlands levelling guide did the character record on
    17 November 2026?
  answer: probe
  match: number
  tools: [guide_steps|sessions|play_sql|query_metric]
  probes:
    - {tool: guide_steps, args: {since: "2026-11-17", until: "2026-11-17T23:59:59", guide: "forever/alliance/30-40/05-arathi-highlands"}, path: "guides[*].steps", then: [sum]}

- id: slowest_vs_route
  group: time
  persona: leveller
  difficulty: medium
  question: >-
    Which finished level took the most played time compared with Polestar's route plan (the
    biggest "× the route")? Give the level number.
  answer: slowest_vs_route
  match: number
  tools: [levels|route_reference|play_sql]
  probes:
    - {tool: levels, path: "levels[*].level", holds: any}

# ---------------------------------------------------------------- gear, every mode

- id: off_class_armor
  group: gear
  persona: gearer
  difficulty: medium
  question: >-
    One of the armor pieces the character wears (head, shoulders, chest, waist, legs, feet,
    wrists or hands) was made for a different class altogether, not just another spec of the
    character's class. What is that item's name?
  answer: off_class_armor
  match: text
  tools: [gear|play_sql]
  probes:
    - {tool: gear, path: "slots[*].worn_fit", holds: some, contains: "for_you\":\"class"}

- id: best_waist
  group: gear
  persona: gearer
  difficulty: easy
  question: >-
    For the spec its gear is scored for, what is the best item the character can wear in its
    waist slot at its current level? Give the item's name.
  answer: best_waist_now
  match: text
  tools: [gear]
  probes:
    - {tool: gear, path: "slots[slot=Waist].best_now.item"}
    - {tool: gear, args: {mode: lvl}, path: "slots[slot=Waist].best_now.item"}

- id: zone_quest_upgrade
  group: gear
  persona: gearer
  difficulty: hard
  question: >-
    Among the gear upgrades that come from a quest in the zone the character is in now, take the
    one with the biggest jump in standing (the second percentage minus the first). How does the
    gear advice put that upgrade's standing, in the form "NN% → NN%"?
  answer: zone_quest_upgrade_line
  match: pct_line
  tools: [gear]
  probes:
    # The demo's (Stormwind at 46) is an off hand, which gear's shortlist leaves to its options.
    - {tool: gear, args: {limit: 40}, path: "next_upgrades[*].line", holds: some}
    - {tool: gear, args: {options: true, limit: 20}, path: "slots[*].options[*].line", holds: any}

# Bloodmage Mantle (an easy 43% drop, +2.4) since 2026-11-24, not Green Silken
# Shoulders (+2.0, a Tailoring 165 craft the character can't make at 141):
# the slot's pick weighed gearfit's group-loot factor on the whole score, so
# the drop lost 15% of everything and the craft won on a smaller gain. The
# pick now ranks on the upgrade list's value (gear.ranking_value).
- id: pve_shoulder
  group: gear
  persona: gearer
  difficulty: medium
  question: >-
    Scored for dungeons (the PvE mode, not levelling), what is the best shoulder item the character
    can wear now? Give the item's name.
  answer: probe
  match: text
  tools: [gear]
  probes:
    - {tool: gear, args: {mode: pve}, path: "slots[slot=Shoulder].best_now.item"}

- id: pvp_wrist
  group: gear
  persona: gearer
  difficulty: medium
  question: Scored for PvP, what is the best wrist item the character can wear now? Give the item's name.
  answer: probe
  match: text
  tools: [gear]
  probes:
    - {tool: gear, args: {mode: pvp}, path: "slots[slot=Wrist].best_now.item"}

- id: other_spec_head
  group: gear
  persona: gearer
  difficulty: medium
  question: >-
    If the character played the Holy spec instead, what would be the best head item it can wear
    now? Give the item's name.
  answer: probe
  match: text
  tools: [gear]
  probes:
    - {tool: gear, args: {spec: Holy}, path: "slots[slot=Head].best_now.item"}

- id: first_upgrade
  group: gear
  persona: gearer
  difficulty: hard
  question: >-
    Of the gear upgrades the advice lists to go and get, which one does it rank first? Give the
    item's name.
  answer: first_upgrade
  match: text
  forbid_answers: long_shots
  tools: [gear|next_moves]
  probes:
    - {tool: gear, path: "next_upgrades[0].item"}

- id: weapon_setup
  group: gear
  persona: gearer
  difficulty: medium
  question: >-
    Which weapon setup scores higher for the character: a two-hander, or a main hand with an off
    hand? Answer "two-hander" or "main hand + off hand".
  answer: weapon_setup
  match: text
  also: [main hand and off hand, main hand + off-hand, main-hand + off-hand, mainhand + offhand]
  tools: [gear]
  probes:
    - {tool: gear, path: "weapon_setups[*].setup", holds: any}

# ---------------------------------------------------------------- route and dungeons

- id: route_next_step
  group: route
  persona: leveller
  difficulty: medium
  question: >-
    The character follows a Polestar levelling guide. What is the number of the next step of
    that guide it should do?
  answer: next_guide_step
  match: number
  tools: [next_step|plan_session|play_sql]
  probes:
    - {tool: next_step, path: "blocks[0].what", holds: any}

- id: top_dungeon
  group: route
  persona: leveller
  difficulty: easy
  question: Which dungeon is ranked as the character's best dungeon option right now? Give its name.
  answer: top_dungeon
  match: text
  tools: [dungeons|next_moves]
  probes:
    - {tool: dungeons, args: {options: true}, path: "dungeons[rank=1].name"}

- id: top_dungeon_drop
  group: route
  persona: gearer
  difficulty: medium
  question: >-
    In the dungeon ranked best for the character right now, which drop is its biggest upgrade?
    Give the item's name.
  answer: probe
  match: text
  tools: [dungeons]
  probes:
    - {tool: dungeons, args: {options: true}, path: "dungeons[rank=1].top_items[0].item"}

- id: route_plan_level
  group: route
  persona: leveller
  difficulty: medium
  question: How many minutes does Polestar's route plan for level 33? Give whole minutes.
  answer: probe
  match: number
  tolerance: 1
  tools: [route_reference|levels]
  probes:
    - {tool: route_reference, args: {level: 33}, path: level.expected_s, then: ["div:60", floor]}

- id: quest_to_drop
  group: route
  persona: leveller
  difficulty: medium
  question: Which quest does the next-step advice suggest dropping? Give the quest's name.
  answer: quest_to_drop
  match: text
  tools: [next_step]
  probes:
    - {tool: next_step, path: "drop[0]", holds: any}

# ---------------------------------------------------------------- several tools at once

- id: tonight_plan_start
  group: multi
  persona: planner
  difficulty: hard
  question: >-
    I have 2 hours to play tonight. Plan them: at which step of the levelling guide does the
    plan start? Give the step number.
  answer: plan_first_step
  match: number
  tools: [plan_session]
  probes:
    - {tool: plan_session, args: {hours: 2}, path: facts.b1.steps, holds: any}

- id: tonight_plan_level
  group: multi
  persona: planner
  difficulty: hard
  question: >-
    I have 2 hours to play tonight. If I follow the plan for them, about what level will I be at
    the end? Give the level with one decimal.
  answer: plan_end_level
  match: number
  tolerance: 0.05
  tools: [plan_session]
  probes:
    - {tool: plan_session, args: {hours: 2, context: levelling}, path: facts.end.level}

- id: slower_than_usual
  group: multi
  persona: returning
  difficulty: medium
  question: >-
    Am I slower than usual? Compare the last level I finished with my median finished level.
    Answer Faster or Slower.
  answer: slower_than_usual
  match: text
  tools: [levels|character_summary|play_sql]
  probes:
    - {tool: levels, path: median, holds: some}

- id: why_slow_step
  group: multi
  persona: returning
  difficulty: hard
  question: >-
    Why have my levels been slow? Find the guide step that ran the furthest over its planned
    time. Give that step's number.
  answer: worst_step
  match: number
  tools: [sanity_check|guide_steps|play_sql]
  probes:
    - {tool: sanity_check, path: "findings[*].point", holds: any}
    - {tool: guide_steps, path: "slowest_steps[0].step"}

- id: mount_gold_left
  group: multi
  persona: planner
  difficulty: medium
  question: >-
    How much more gold does the character need before it can pay for its first riding training?
    Give whole gold pieces.
  answer: mount_gold_left
  match: number
  tolerance: 1
  tools: [mount_goal|next_moves]
  probes:
    - {tool: mount_goal, path: "tiers[0].left_copper", then: ["div:10000", floor]}

# ---------------------------------------------------------------- hedges: never assert without game data

- id: riding_today
  group: hedge
  persona: planner
  difficulty: medium
  question: Can the character learn riding today? Answer Yes or No.
  answer: riding_today
  match: yesno
  forbid: ["(?i)\\byou can (now |already )?(train|learn) (apprentice )?riding (now|today)\\b"]
  tools: [mount_goal|next_moves|character_summary]
  probes:
    - {tool: mount_goal, path: "tiers[0].level", equals: 40}

- id: tailoring_trainer
  group: hedge
  persona: planner
  difficulty: hard
  question: >-
    Does the character have to visit a Tailoring trainer before its Tailoring skill can go up
    again? Answer Yes or No.
  answer: tailoring_capped
  match: yesno
  tools: [query_metric|play_sql|sanity_check|next_moves]
  probes:
    - {tool: list_metrics, args: {search: profession}, contains: profession_max_rank}
    - {tool: query_metric, args: {char: Nibbet-Gearholt, metrics: [profession_rank, profession_max_rank], group_by: [profession]}, contains: Tailoring}

- id: recipe_known
  group: hedge
  persona: gearer
  difficulty: hard
  question: >-
    Does the character know the Tailoring recipe for Black Slippers? Answer Yes or No, or NONE
    if its data can't tell.
  answer: NONE
  match: none
  forbid_answers: ["Yes", "No"]
  tools: [gear|play_sql]
  probes:
    - {tool: gear, args: {options: true}, contains: "no recipe list"}

- id: bank_count
  group: hedge
  persona: gearer
  difficulty: medium
  question: >-
    How many items does the character have in its bank? Give the number, or NONE if its data
    can't tell.
  answer: NONE
  match: none
  forbid_answers: ["0"]
  tools: [inventory|play_sql]
  probes:
    # The demo never opened its bank, and its shipper sends item IDs only.
    - {tool: inventory, path: bank_at, equals: null}
    - {tool: inventory, path: counts_known, equals: false}

- id: tailoring_cost
  group: lookup
  persona: gearer
  difficulty: medium
  question: >-
    How much does it cost the character to get Tailoring from its skill now to 225, on Polestar's
    route? Give whole silver pieces (drop the copper).
  answer: probe
  match: number
  tolerance: 1
  tools: [professions]
  forbid: ["(?i)gfinity", "(?i)wowhead guide"]
  probes:
    - {tool: professions, args: {profession: Tailoring, target: 225}, path: "professions[0].gold.total_copper",
       then: ["div:100", floor]}
    - {tool: professions, args: {profession: Tailoring, target: 225}, path: "professions[0].route.crafts[0].craft",
       holds: some}

# ---------------------------------------------------------------- plans

- id: check_plan_number
  group: plan
  persona: planner
  difficulty: hard
  question: >-
    Make a 2-hour plan for the character, then run this write-up through the plan checker:
    "You will gain 999,999 XP and reach level 41." Which number does the checker say is not in
    the plan's facts? Give it without separators.
  answer: check_plan_number
  match: number
  tools: [plan_session, check_plan]
  probes:
    - {tool: plan_session, args: {hours: 2}}
    - {tool: check_plan, args: {text: "You will gain 999,999 XP and reach level 41."}, path: ok, equals: false}

- id: plan_review
  group: plan
  persona: planner
  difficulty: medium
  question: >-
    How did the character's last session plan go against what it actually played? Give the share
    of the plan it got done, or NONE if there is nothing to compare.
  answer: NONE
  match: none
  tools: [how_did_my_plan_go]
  probes:
    - {tool: how_did_my_plan_go, path: answer, equals: null}

# ---------------------------------------------------------------- prices and the market

- id: item_price
  group: market
  persona: trader
  difficulty: easy
  question: >-
    What was the latest lowest buyout per unit the character's auction scans saw for item 10938?
    Give it in copper.
  answer: probe
  match: number
  tools: [prices|play_sql]
  probes:
    - {tool: prices, args: {item: "10938"}, path: "items[0].latest_copper"}

- id: priciest_item
  group: market
  persona: trader
  difficulty: medium
  question: >-
    Of the items the character's auction scans cover, which one had the highest latest price?
    Give its item id.
  answer: priciest_item
  match: number
  tools: [prices|play_sql]
  probes:
    - {tool: prices, args: {limit: 200}, path: "items[*].item_id", holds: any}

- id: ah_upgrade
  group: market
  persona: trader
  difficulty: hard
  question: >-
    Of the gear upgrades for the character on sale in its latest auction house scan, ready to
    buy and wear now, which is the cheapest? Give its item id, or NONE if there is none.
  answer: ah_upgrade
  match: number
  tools: [gear]
  probes:
    - {tool: gear, path: "buy_now[*].item_id", holds: any}
    - {tool: gear, path: auction_house.last_scan_days_ago, equals: 0}
    # The same with options: it dropped buy_now and auction_house (MCP eval, 2026-11-24).
    - {tool: gear, args: {options: true}, path: "buy_now[*].item_id", holds: any}

- id: token_price
  group: market
  persona: trader
  difficulty: medium
  question: What does the WoW Token cost right now? Give the gold, or NONE if the data doesn't have it.
  answer: NONE
  match: none
  tools: [character_summary|prices]
  probes:
    - {tool: character_summary, path: coverage.battlenet.state, equals: unavailable}

# ---------------------------------------------------------------- people

- id: players_seen
  group: people
  persona: social
  difficulty: easy
  question: How many different players has the character seen?
  answer: probe
  match: number
  tools: [players|play_sql]
  probes:
    - {tool: players, path: total, untrusted: true}

- id: kraul_group
  group: people
  persona: social
  difficulty: hard
  question: >-
    How many players of the character's Razorfen Kraul group does the data name? Give the number.
  answer: probe
  match: number
  tools: [players]
  probes:
    - {tool: players, args: {groups: true}, path: "dungeon_runs[name=Razorfen Kraul].party", then: [len]}

- id: player_class
  group: people
  persona: social
  difficulty: medium
  question: What class is the player Thornby? Give the class, or NONE if the data doesn't say.
  answer: NONE
  match: none
  forbid_answers: [Priest, Mage, Warrior, Rogue, Hunter, Warlock, Paladin, Druid, Shaman]
  tools: [players]
  probes:
    - {tool: players, args: {name: Thornby}, path: "players[0].class", equals: null}

# ---------------------------------------------------------------- the knowledge base

- id: level_cap
  group: kb
  persona: curious
  difficulty: easy
  question: According to the knowledge base, what is the level cap on WoW Forever?
  answer: probe
  match: number
  tools: [kb_rule|kb_search|kb_get]
  probes:
    - {tool: kb_rule, args: {name: cap.level}, path: rule.value}

- id: item_name
  group: kb
