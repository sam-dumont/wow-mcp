      metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: percent,
                 caveats: "Altoholic's newest save. NULL without Altoholic: install it and log in once with the character (its DataStore_Stats save). No other source in the analysis has the character sheet."}
    honorable_kills_lifetime:
      expr: _.honorable_kills.argmax(_.t)
      description: "Lifetime honorable kills (the game's PvP count)."
