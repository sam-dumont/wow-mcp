                 caveats: "Altoholic's newest save. NULL without Altoholic: install it and log in once with the character (its DataStore_Stats save). No other source in the analysis has the character sheet."}
    honorable_kills_gained:
      expr: _.honorable_kills.argmax(_.t) - _.honorable_kills.argmin(_.t)
      description: "Honorable kills gained between the group's first and last Altoholic save."
      metadata: {kind: derived, aggregation: endpoint_difference, time_meaning: snapshot_observation, evidence_basis: observed, unit: kills,
