# The semantic layer's model: every metric the analysis can ask for by name,
# declared once. Boring Semantic Layer's YAML format (github.com/boringdata/
# boring-semantic-layer): one model per table, its dimensions (`is_time_dimension`
# marks the time a grain cuts), its measures (one aggregation each) and
# calculated measures (ratios and differences of measures). Expressions are
# ibis expressions over the table (`_`), checked by BSL's safe_eval: no Python
# runs from this file.
#
# Entities are the keys two models share (`is_entity`: level, session_id) and
# the conformed dimensions keep one name in every model (zone, dungeon, time,
# character, class). A question across models never joins raw rows: each model
# aggregates on its own to the question's group_by, then the results join on
# those columns (wowstats/analysis/semantic.py, Layer.compile), the way
# MetricFlow joins measures. So a level's played_s is never summed once per
# timeline row: no fan-out by construction.
#
# Each table is a view the layer adds to the DuckDB copy of the prep
# (semantic.py, VIEWS): the prep's own table plus `at_local` (its time in the
# player's timezone), `character` and `char_class`.
#
# Our own keys live in `metadata`: `kind` (simple, ratio or derived), `unit`,
# and `caveats` (what the number does not say). semantic.py reads them for
# list_metrics, and tests/analysis/test_semantic.py checks that every name
# resolves. Metric names are unique across models.
#
# Five more keys turn caveats into rules the compiler enforces (review 4,
# 2026-11-21: vs_route read the level in play's plan against no played time,
# and one snapshot gave a money change of 0):
# - `aggregation`: sum, ratio_of_sums, latest, endpoint_difference, max
#   (the largest in the group: a per-item fact the gear models repeat on
#   each row of the item, a slot's best, or the newest time), min (the
#   smallest: the first time) or top (the value on the group's top row: a
#   slot's best upgrade wearable now, its weakest worn item, the level's
#   longest silence, a step's first record).
# - `time_meaning`: what `time` is for this metric: interval_start,
#   level_completion, snapshot_observation, quest_closure or event (a list,
#   one per model, for a cross-model metric).
# - `evidence_basis`: observed, reconstructed (cut or paired from records),
#   allocated (shared out), inferred (a residual) or estimated (a model).
# - `eligibility` {where, means}: every metric read from two sides has one.
#   The compiler restricts each measure the metric reads to the rows `where`
#   holds (a copy of the measure: planned_s asked on its own is untouched).
#   A cross-model metric gives one `where` per model.
# - `min_evidence` {count, at_least, means}: every endpoint difference has
#   one. Below at_least observations the value is NULL, and the answer
#   carries the count in `<name>_evidence` (0: no observation, unavailable).
# tests/analysis/test_semantic_evidence.py fails a metric that lacks them.
# docs/reference/semantic-layer.md has the catalogue, generated from this file.
#
# Two top-level keys are ours, not models: `views` (the views per grain, at
# the end) and `cross_model_metrics`, ratios and
# sums of metrics from two models (kills from records over combat_s from
# timeline). BSL's own joins go from one model's rows to another's by a key;
# a ratio of two facts grouped by any dimension they share (level, character,
# time with its grain) is what the layer already does for every multi-model
# question: each model aggregates on its own, the results join on the
# group_by columns, so the ratio is computed after that join. semantic.py
# takes both out before BSL reads the file, checks each cross-model expression (metric
# names, numbers, + - * / and parentheses only) and compiles it there.

levels:
  table: sem_levels
  description: "One row per level: Polestar's split when the level is done, the ding time and the route planner's time."
  dimensions:
    level: {expr: _.level, is_entity: true, description: "Character level."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    partial: {expr: _.partial, description: "1 when Polestar's split began partway through the level (tracking started then), 0 for a whole level, NULL with no split (the level in play)."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When the level ended (the ding), local time. NULL while the level is in play."}
    ding_t: {expr: _.ding_t, description: "When the level ended, unix seconds (UTC): the Recorder's ding, else the split's own time (for a split still growing, its last update). NULL for the level in play without a split. Group by it to place a level in time."}
  measures:
    split_levels:
      expr: _.played_s.count()
      description: "Levels with a Polestar split (a time played)."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: observed, unit: levels,
                 caveats: "The level in play has no split yet; a partial split counts."}
    played_s:
      expr: _.played_s.sum()
      description: "Time at a level, way 1: Polestar's own split, the game's /played seconds spent in the level."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: observed, unit: seconds,
                 caveats: "Counts from the moment tracking started: a level marked partial began before it. Offline time is not in it."}
    calendar_s:
      expr: _.calendar_s.sum()
      description: "Time at a level, way 4: wall-clock seconds from the previous ding to this one, offline time included."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: reconstructed, unit: seconds,
                 caveats: "NULL for the first tracked level and the level in play. A week off between two dings counts in full."}
    offline_s:
      expr: _.offline_s.sum()
      description: "Time at a level, offline: calendar_s minus played_s, the seconds the game was closed between the two dings."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: inferred, unit: seconds,
                 caveats: "Whole splits only (NULL for a partial split, the first tracked level and the level in play). A level that took weeks on the calendar with its played time on plan was a break, not slow play: read played_s and vs_route for pace."}
    level_xp:
      expr: _.xp.sum()
      description: "XP the level took (Polestar split)."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: observed, unit: xp,
                 caveats: "From the split: missing for a level the split never closed."}
    split_quests:
      expr: _.quests.sum()
      description: "Quests handed in during the level, as Polestar's split counts them."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: observed, unit: quests,
                 caveats: "The split's own count; records.turnin can differ for a partial level."}
    split_kills:
      expr: _.kills.sum()
      description: "Kills during the level, as Polestar's split counts them."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: observed, unit: kills,
                 caveats: "The split's own count; records.kill can differ for a partial level."}
    planned_s:
      expr: _.planned_s.coalesce(_.planned_median_s).sum()
      description: "The route planner's seconds for the level: for this class, or the median over classes when the class isn't known."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: estimated, unit: seconds,
                 caveats: "A model of a quick player who knows the route, uncalibrated. NULL when the route reference has no time for the level."}
    class_planned_s:
      expr: _.planned_s.sum()
      description: "The route planner's seconds for the level for the character's own class only: planned_s without its fallback to the median over classes."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: estimated, unit: seconds,
                 caveats: "NULL when the class isn't known (no Recorder session record names it) or the route reference has no time for the level: the planner then falls back to the route for the side and class it knows from elsewhere. As uncalibrated as planned_s."}
    longest_gap_s:
      expr: _.longest_gap_s.max()
      description: "The longest stretch inside the level (previous ding to this one, or to the last record for the level in play) with no Recorder session."
      metadata: {kind: simple, aggregation: max, time_meaning: level_completion, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Time offline, or play the Recorder missed when recorder_missed_s is above 0. Not additive: over several levels it is the longest of them. NULL for the first tracked level."}
    recorder_missed_s:
      expr: _.recorder_missed_s.sum()
      description: "Played seconds in the level that no Recorder session covers: the coverage's Recorder gap for the level."
      metadata: {kind: simple, aggregation: sum, time_meaning: level_completion, evidence_basis: inferred, unit: seconds,
                 caveats: "0 when the Recorder saw the whole level. NULL when it can't be measured: a partial split, the first tracked level, the level in play, or a level before the Recorder's first session."}
    longest_gap_from:
      expr: _.longest_gap_from_local.argmax(_.longest_gap_s)
      description: "When the longest silence (longest_gap_s) began: the end of the Recorder session before it, local time."
      metadata: {kind: simple, aggregation: top, time_meaning: level_completion, evidence_basis: reconstructed, unit: local time,
                 caveats: "Over several levels, the start of the longest of their silences. NULL where longest_gap_s is NULL."}
    longest_gap_to:
      expr: _.longest_gap_to_local.argmax(_.longest_gap_s)
      description: "When the longest silence (longest_gap_s) ended: the start of the Recorder session after it, or the ding, local time."
      metadata: {kind: simple, aggregation: top, time_meaning: level_completion, evidence_basis: reconstructed, unit: local time,
                 caveats: "Over several levels, the end of the longest of their silences. NULL where longest_gap_s is NULL."}
  calculated_measures:
    xp_per_hour:
      expr: _.level_xp / (_.played_s / 3600)
      description: "XP per played hour in the level: level_xp over played_s."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: level_completion, evidence_basis: observed, unit: xp/hour,
                 caveats: "Played time from the split, so idle time in the game counts against it.",
                 eligibility: {where: "(_.played_s > 0) & _.xp.notnull()",
                   means: "A level with a split: played time above 0 and its XP known."}}
    vs_route:
      expr: _.played_s / _.planned_s
      description: "Played time over the route planner's time: 1.0 is on plan, 2.0 twice as long."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: level_completion, evidence_basis: estimated, unit: ratio,
                 caveats: "As uncalibrated as planned_s. Reads whole splits with a planned time only (eligibility): planned_s on its own is the total target, every level with a plan. NULL when no level qualifies.",
                 eligibility: {where: "(_.played_s > 0) & (_.partial == 0) & (_.planned_s.coalesce(_.planned_median_s) > 0)",
                   means: "A whole split (partial = 0, played time above 0) with a planned time. The level in play has no split and a partial split began partway through the level, so both stay out of both sides; planned_s on its own still counts them."}}
    offline_share:
      expr: _.offline_s / _.calendar_s
      description: "Share of the calendar time at a level spent offline: offline_s over calendar_s (0.9: nine days in ten the game was closed)."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: level_completion, evidence_basis: inferred, unit: ratio,
                 caveats: "Says how much of a level's calendar was a break, nothing about the pace inside the game.",
                 eligibility: {where: "_.offline_s.notnull() & (_.calendar_s > 0)",
                   means: "A whole split with both dings known: its offline time and calendar time are measured."}}
    avg_level_s:
      expr: _.played_s / _.split_levels
      description: "Average played seconds a level: played_s over split_levels (the page's \"a level, over the last 5\")."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: level_completion, evidence_basis: observed, unit: seconds,
                 caveats: "Filter partial = 0 for whole levels: a partial split is short.",
                 eligibility: {where: "_.played_s.notnull()",
                   means: "A level with a split (the level in play has none)."}}
    recorder_coverage:
      expr: (_.played_s - _.recorder_missed_s) / _.played_s
      description: "Share of the level's played time the Recorder saw: played_s minus recorder_missed_s, over played_s (1.0: every minute)."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: level_completion, evidence_basis: inferred, unit: share,
                 caveats: "The Recorder's counts for the level (deaths, kills, quests_done, online_s) cover this share of its play: below 1, a 0 there may be play it missed. NULL when it can't be measured (see recorder_missed_s): unknown, never full.",
                 eligibility: {where: "_.recorder_missed_s.notnull() & (_.played_s > 0)",
                   means: "A level whose Recorder gap is measured: a whole split after the Recorder's first session."}}
    over_route_s:
      expr: _.played_s - _.planned_s
      description: "Seconds played beyond the route planner's time (negative: faster)."
      metadata: {kind: derived, aggregation: sum, time_meaning: level_completion, evidence_basis: estimated, unit: seconds,
                 caveats: "As uncalibrated as planned_s. Reads whole splits with a planned time only (eligibility): planned_s on its own is the total target, every level with a plan. NULL when no level qualifies.",
                 eligibility: {where: "(_.played_s > 0) & (_.partial == 0) & (_.planned_s.coalesce(_.planned_median_s) > 0)",
                   means: "A whole split (partial = 0, played time above 0) with a planned time. The level in play has no split and a partial split began partway through the level, so both stay out of both sides; planned_s on its own still counts them."}}

timeline:
  table: sem_timeline
  description: "The online time cut at every record: each row an interval inside a login span, with the state at its start."
  dimensions:
    level: {expr: _.level, is_entity: true, description: "Character level."}
    zone: {expr: _.zone, description: "Zone name, as the last zone record said (inside a dungeon, the game usually names the dungeon)."}
    subzone: {expr: _.subzone, description: "Subzone text."}
    dungeon: {expr: _.instance, description: "Dungeon name while inside a dungeon run, else NULL."}
    session_id: {expr: _.session_id, is_entity: true, description: "Login span (sessions)."}
    hour: {expr: _.hour_local, description: "Hour of day 0-23, local time."}
    guide: {expr: _.guide, description: "The Polestar guide active then (the last step record), its id. NULL before the first step record."}
    guide_title: {expr: _.guide_title, description: "That guide's title, from the route reference (NULL when the reference doesn't have the guide)."}
    step: {expr: _.step, description: "The guide's step number then (from 1). Group by guide too: step numbers restart in each guide."}
    step_title: {expr: _.step_title, description: "That step's title, from the route reference (NULL when the reference doesn't have it)."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "Start of the interval, local time."}
  measures:
    online_s:
      expr: _.dur_s.sum()
      description: "Time at a level, way 2: online seconds the Recorder saw, every interval between two records of a login span."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "A silence over 330 s ends a span, so a crash or a long loading screen can drop a few minutes."}
    active_s:
      expr: _.dur_s.sum(where=_.afk == 0).fill_null(0)
      description: "Time at a level, way 3: online seconds with the AFK flag off."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "The game sets AFK after 5 idle minutes: those 5 minutes still count as active."}
    afk_s:
      expr: _.dur_s.sum(where=_.afk == 1).fill_null(0)
      description: "Online seconds with the AFK flag on."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Starts 5 minutes into the idle time (the game's own flag)."}
    dungeon_s:
      expr: _.dur_s.sum(where=_.instance.notnull()).fill_null(0)
      description: "Online seconds inside a dungeon run."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Inside the instance only: the walk there and the hand-ins are outside (see trip_s)."}
    combat_s:
      expr: _.dur_s.sum(where=_.combat == 1).fill_null(0)
      description: "Online seconds in combat."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "From the combat records' on/off pairs."}
    dead_s:
      expr: _.dur_s.sum(where=_.dead == 1).fill_null(0)
      description: "Online seconds from a death to the revive (ghost run, spirit healer)."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Death to revive only; the walk back after a spirit healer is alive time."}
    taxi_s:
      expr: _.dur_s.sum(where=_.taxi == 1).fill_null(0)
      description: "Online seconds on a flight path."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Flight paths only; boats and zeppelins are ride time, not in it."}
    first_online_t:
      expr: _.t0.min()
      description: "When the group's first online interval began, unix seconds (a guide step: when it first came up)."
      metadata: {kind: simple, aggregation: min, time_meaning: interval_start, evidence_basis: reconstructed, unit: unix seconds,
                 caveats: "Not additive: over several groups it is the earliest. Online time only: a step shown while offline isn't seen."}
    ride_s:
      expr: _.dur_s.sum(where=_.ride == 1).fill_null(0)
      description: "Online seconds between a ride record's on and its off: a boat, a zeppelin, a tram."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "From the Recorder's ride records' on/off pairs; flight paths are taxi_s, not in it."}
  calculated_measures:
    dungeon_share:
      expr: _.dungeon_s / _.online_s
      description: "Share of online time spent inside dungeons: dungeon_s over online_s."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: interval_start, evidence_basis: reconstructed, unit: share,
                 caveats: "0 to 1. NULL when online_s is 0.",
                 eligibility: {where: "_.dur_s.notnull()",
                   means: "Every interval: both sides cut the same online time."}}
    afk_share:
      expr: _.afk_s / _.online_s
      description: "Share of online time with the AFK flag on: afk_s over online_s."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: interval_start, evidence_basis: reconstructed, unit: share,
                 caveats: "0 to 1.",
                 eligibility: {where: "_.dur_s.notnull()",
                   means: "Every interval: both sides cut the same online time."}}
    combat_share:
      expr: _.combat_s / _.online_s
      description: "Share of online time in combat: combat_s over online_s."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: interval_start, evidence_basis: reconstructed, unit: share,
                 caveats: "0 to 1.",
                 eligibility: {where: "_.dur_s.notnull()",
                   means: "Every interval: both sides cut the same online time."}}

records:
  table: sem_records
  description: "Every Recorder record except positions: kills, deaths, quests, loot and the rest."
  dimensions:
    level: {expr: _.level, is_entity: true, description: "Character level."}
    zone: {expr: _.zone, description: "Zone name."}
    kind: {expr: _.kind, description: "Record kind (record_kinds: kill, death, turnin, accept...)."}
    guide: {expr: _.guide, description: "The Polestar guide a step or skip record names, its id (NULL on other records)."}
    session_id: {expr: _.session_id, is_entity: true, description: "Login span (sessions)."}
    hour: {expr: _.hour_local, description: "Hour of day 0-23, local time."}
    npc_id: {expr: _.npc_id, description: "The NPC the record names: a kill's creature, a trainer record's trainer, or a death's likely killer as Polestar_Recorder picks it (the last hostile creature that targeted the player within 10 s). NULL for a record that names none and for a death with no pick."}
    npc_level: {expr: _.npc_level, description: "That creature's level (a kill's creature, a death's likely killer)."}
    elite: {expr: _.elite, description: "1 when a kill's creature was an elite, a rare elite or a boss (classification e, R or b), else 0."}
    run: {expr: _.run_start, description: "The dungeon run the record falls in, named by when it started (unix seconds, as dungeon_runs names it), NULL outside a run."}
    skill_id: {expr: _.skill_id, description: "The skill line of a skill record (762: Riding; the professions' own ids), else NULL."}
    guide: {expr: _.at_guide, description: "The Polestar guide in force at the record: a step or skip record's own (the guide it moved in), else the guide of the online interval the record closes (timeline). NULL before the first step record."}
    step: {expr: _.at_step, description: "That guide's step number, the same way: a step or skip record's own step. Group by guide too: step numbers restart in each guide."}
    dungeon_trip: {expr: _.dungeon_trip_id, description: "The dungeon trip the record falls in (dungeon_trips), NULL outside one: filter is null for play outside dungeons."}
    record_t: {expr: _.t, description: "One record, named by when it was written (unix seconds): group by it to list the records one by one."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When the record was written, local time."}
  measures:
    kills:
      expr: _.rec_id.count(where=_.kind == 'kill')
      description: "Creatures the player or pet killed (kill records)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: kills,
                 caveats: "Includes kills tapped by another player (records.extra has tapped)."}
    deaths:
      expr: _.rec_id.count(where=_.kind == 'death')
      description: "Deaths (death records)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: deaths,
                 caveats: "The zone is where the player died, not where the corpse run ended."}
    quests_done:
      expr: _.rec_id.count(where=_.kind == 'turnin')
      description: "Quests handed in (turnin records)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: quests,
                 caveats: "A quest handed in twice (repeatable) counts twice."}
    quests_accepted:
      expr: _.rec_id.count(where=_.kind == 'accept')
      description: "Quests accepted (accept records)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: quests,
                 caveats: "Re-accepting after an abandon counts again."}
    zone_visits:
      expr: _.rec_id.count(where=_.kind == 'zone')
      description: "Arrivals in a zone or subzone: zone records (the game's zone or subzone text changed)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: visits,
                 caveats: "Counted in the zone the record names: walking from one subzone to another inside a zone counts again."}
    guide_steps:
      expr: _.rec_id.count(where=_.kind == 'step')
      description: "Guide steps Polestar moved to (step records)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: steps,
                 caveats: "Every move of Polestar's pointer, a step shown again included. Group by guide for one guide's."}
    flights:
      expr: _.rec_id.count(where=_.kind == 'taxi')
      description: "Flight paths taken (taxi records)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: flights,
                 caveats: "Counted at the take-off; their time in the air is taxi_s."}
    quests_abandoned:
      expr: _.rec_id.count(where=_.kind == 'abandon')
      description: "Quests abandoned (abandon records)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: quests,
                 caveats: "Only what the player abandoned; a failed quest is a fail record."}
    kill_xp:
      expr: _.xp_reward.sum(where=_.kind == 'kill').fill_null(0)
      description: "XP from kills (kill records' xp_reward)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: xp,
                 caveats: "Rested bonus included, as the game reports it."}
    quest_xp:
      expr: _.xp_reward.sum(where=_.kind == 'turnin').fill_null(0)
      description: "XP from quest hand-ins (turnin records' xp_reward)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: xp,
                 caveats: "Discovery XP is apart (explore records)."}
    quest_money_copper:
      expr: _.money_copper.sum(where=_.kind == 'turnin').fill_null(0)
      description: "Money quest hand-ins paid, copper."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: copper,
                 caveats: "Quest rewards only; loot, sales and costs are not in it (see gold_delta_copper)."}
    deaths_above:
      expr: _.rec_id.count(where=(_.kind == 'death') & ((_.npc_level - _.level) >= 3))
      description: "Deaths to a likely killer 3 or more levels above the character (death records: npc_level minus the record's level)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: inferred, unit: deaths,
                 caveats: "The killer is Polestar_Recorder's pick, likely, not certain (no combat log). A death with no pick or no level isn't counted."}
    level_gap_max:
      expr: (_.npc_level - _.level).max(where=_.kind == 'death')
      description: "The largest level gap between a death's likely killer and the character: npc_level minus the record's level."
      metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: inferred, unit: levels,
                 caveats: "Not additive: over several deaths it is the largest of them. NULL when no death of the group has a killer and a level."}
    come_back_level:
      expr: _.npc_level.max(where=(_.kind == 'death') & ((_.npc_level - _.level) >= 3))
      description: "The highest level among the likely killers 3 or more levels above the character: the level to come back at."
      metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: inferred, unit: level,
                 caveats: "Not additive: the largest of the group. NULL when no death of the group was to a creature 3+ levels above."}
    skill_rank:
      expr: _.skill_rank.max(where=_.kind == 'skill')
      description: "The highest rank the skill records saw: group or filter by skill_id (Riding is 762)."
      metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: rank,
                 caveats: "Only ranks the Recorder saw change: a skill learned before it ran and never raised since has no record. NULL without a skill record."}
    skill_ups:
      expr: _.rec_id.count(where=_.kind == 'skill')
      description: "Skill rank changes (skill records): a profession, a weapon skill or Riding going up a point."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: skill-ups,
                 caveats: "Every skill line together: group by guide (forever/professions/...) for the points made while a profession guide was up."}
    steps_done:
      expr: _.rec_id.count(where=(_.kind == 'step') & (_.reason.fill_null('') != 'pick') & _.at_step.notnull())
      description: "Guide steps Polestar moved to (step records with a step number, the guide picks left out)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: steps,
                 caveats: "A step shown twice (back, then next) counts twice. A step jumped over has no record: steps_jumped."}
    step_s:
      expr: (_.seconds * 1000).round().sum(where=(_.kind == 'step') & (_.reason.fill_null('') != 'pick') & _.at_step.notnull()).fill_null(0) / 1000
      description: "Polestar's own step timer: the seconds since the previous step record, as the shipper computes them for each step record, summed on the step it moved to (the guide_steps tool's time), to the millisecond."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: seconds,
                 caveats: "Wall-clock time between two step records, as the shipper reads it: a logout or a break between them counts in full. For time played on a step, active_s grouped by guide and step (timeline)."}
    step_picks:
      expr: _.rec_id.count(where=(_.kind == 'step') & ((_.reason.fill_null('') == 'pick') | _.at_step.isnull()))
      description: "Guides picked or switched (step records with reason pick, or with no step number): not a step done."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: picks,
                 caveats: "Includes a guide finished or emptied (no step number left)."}
    steps_skipped:
      expr: _.rec_id.count(where=_.kind == 'skip')
      description: "Steps the player skipped in the guide (skip records)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: steps,
                 caveats: "Explicit skips only; steps passed over by a jump forward are steps_jumped."}
    steps_jumped:
      expr: _.step_jump.sum(where=_.kind == 'step').fill_null(0)
      description: "Steps passed over: a step record 2 to 25 steps past the guide's previous step record counts the steps in between."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: reconstructed, unit: steps,
                 caveats: "Counted on the record that jumped, from the guide's previous step record (picks included) over the whole history: a jump of more than 25 is a new start, not a skip."}
    first_record_t:
      expr: _.t.min()
      description: "When the group's first record was written, unix seconds."
      metadata: {kind: simple, aggregation: min, time_meaning: event, evidence_basis: observed, unit: unix seconds,
                 caveats: "Not additive: over several groups it is the earliest."}
    last_record_t:
      expr: _.t.max()
      description: "When the group's newest record was written, unix seconds (by zone: the last time the character was there)."
      metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: unix seconds,
                 caveats: "Not additive: over several groups it is the newest. Only what the Recorder saw."}
    step_zone:
      expr: _.zone.argmin(_.t, where=(_.kind == 'step') & (_.reason.fill_null('') != 'pick') & _.at_step.notnull())
      description: "The zone of the group's first step record (a guide step: where it first came up)."
      metadata: {kind: simple, aggregation: top, time_meaning: event, evidence_basis: observed, unit: zone,
                 caveats: "Group by guide and step. The zone the character was in, from the zone records; NULL without one."}
    session_records:
      expr: _.rec_id.count(where=_.kind == 'session')
      description: "The Recorder's chunk headers (session records): at login, /reload and every new 5-minute chunk while the game runs."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: records,
                 caveats: "0 when the Recorder never ran: the level splits and sheets came from Polestar or the shipper alone."}
    level_max:
      expr: _.level.max()
      description: "Highest level any record of the group carries."
      metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: level,
                 caveats: "NULL with no record in the group."}
    level_now:
      expr: _.level.argmax(_.t)
      description: "Level on the group's newest record that carries one."
      metadata: {kind: simple, aggregation: latest, time_meaning: event, evidence_basis: observed, unit: level,
                 caveats: "NULL with no record in the group."}
  calculated_measures:
    quest_xp_share:
      expr: _.quest_xp / (_.quest_xp + _.kill_xp)
      description: "Share of kill and quest XP that came from quests: quest_xp over quest_xp + kill_xp."
      metadata: {kind: derived, aggregation: ratio_of_sums, time_meaning: event, evidence_basis: observed, unit: share,
                 caveats: "Leaves out discovery XP and dungeon bonus XP.",
                 eligibility: {where: "(_.kind == 'kill') | (_.kind == 'turnin')",
                   means: "Kill and turnin records: the top is a part of the bottom."}}
    deaths_per_100_kills:
      expr: _.deaths * 100 / _.kills
      description: "Deaths per 100 kills."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: event, evidence_basis: observed, unit: deaths/100 kills,
                 caveats: "NULL without kills; a death to a fall or drowning counts too.",
                 eligibility: {where: "_.rec_id.notnull()",
                   means: "Every record of the group: deaths and kills are counted on the same records."}}

sessions:
  table: sem_sessions
  description: "Login spans: a silence of more than 330 s between Recorder records ends one."
  dimensions:
    session_id: {expr: _.session_id, is_entity: true, description: "Login span number, in time order."}
    weekday: {expr: _.weekday_local, description: "Mon..Sun of the start, local time."}
    start_hour: {expr: _.start_hour_local, description: "Hour of the start, local time."}
    level_start: {expr: _.level_start, description: "Level at the start of the span."}
    level_end: {expr: _.level_end, description: "Level at the end of the span (its last record with one)."}
    start_t: {expr: _.start_t, description: "When the span began, unix seconds (UTC): its first record."}
    end_t: {expr: _.end_t, description: "When the span ended, unix seconds (UTC): its last record."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "Start of the span, local time."}
  measures:
    session_count:
      expr: _.session_id.count()
      description: "Login spans."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: sessions,
                 caveats: "A /reload doesn't split a span; a crash longer than 330 s does."}
    session_s:
      expr: _.duration_s.sum()
      description: "Seconds from a span's first record to its last."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Close to online_s for the same spans, without the timeline's cut."}
    session_xp:
      expr: _.xp_gained.sum()
      description: "XP gained during the spans (xp records)."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: observed, unit: xp,
                 caveats: "From the XP bar every 5 minutes: a span shorter than that can show 0."}
  calculated_measures:
    avg_session_s:
      expr: _.session_s / _.session_count
      description: "Average span length: session_s over session_count."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "One long evening moves it a lot on few sessions.",
                 eligibility: {where: "_.duration_s.notnull()",
                   means: "A span with a duration."}}
    xp_per_session_hour:
      expr: _.session_xp / (_.session_s / 3600)
      description: "XP per hour of login span: session_xp over session_s."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: interval_start, evidence_basis: reconstructed, unit: xp/hour,
                 caveats: "AFK time inside a span counts against it.",
                 eligibility: {where: "_.duration_s.notnull() & _.xp_gained.notnull()",
                   means: "A span with a duration and an XP reading."}}

zone_time:
  table: sem_zone_time
  description: "Time per zone the Recorder's zone records give: from each zone record to the next zone record of its session, else to the session's last record (the pages' rule)."
  dimensions:
    zone: {expr: _.zone, description: "Zone name, as the zone record named it."}
    session_id: {expr: _.session_id, is_entity: true, description: "Login span (sessions)."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When the zone record was written, local time."}
  measures:
    zone_s:
      expr: _.dur_s.sum()
      description: "Seconds in a zone: from its zone record to the next zone record of the session, else to the session's last record."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "The zone records' own times, the zones the journal and the zones tool list. online_s by zone cuts the timeline at every record instead, by the zone or subzone text each record carries: the two differ."}

dungeon_runs:
  table: sem_dungeon_runs
  description: "Polestar's instance runs: one row per run, enter to leave."
  dimensions:
    dungeon: {expr: _.name, description: "Dungeon name."}
    run: {expr: _.start_t, description: "One run, named by when it started (unix seconds): group by it to list the runs one by one."}
    trip: {expr: _.trip_id, description: "The dungeon trip around the run (dungeon_trips: the same dungeon, the run starting inside the trip), NULL for a run with no trip."}
    level: {expr: _.level, is_entity: true, description: "Level at entry."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When the run started, local time."}
  measures:
    run_count:
      expr: _.start_t.count()
      description: "Dungeon runs."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: observed, unit: runs,
                 caveats: "A wipe and re-entry can show as two runs."}
    run_s:
      expr: _.seconds.sum()
      description: "Seconds inside the instance, as Polestar times the run (the `dungeons` tool's number)."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: observed, unit: seconds,
                 caveats: "Inside only. The trip around it: trip_s."}
    run_xp:
      expr: _.xp.sum()
      description: "XP gained inside the instance."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: observed, unit: xp,
                 caveats: "Kills inside; the quests handed in after are trip XP (trip_xp)."}
  calculated_measures:
    run_xp_per_hour:
      expr: _.run_xp / (_.run_s / 3600)
      description: "XP per hour inside: run_xp over run_s (the `dungeons` tool's xp_per_hour)."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: interval_start, evidence_basis: observed, unit: xp/hour,
                 caveats: "Leaves out the quest XP the run unlocks.",
                 eligibility: {where: "(_.seconds > 0) & _.xp.notnull()",
                   means: "A run with a time above 0 and its XP known."}}

dungeon_trips:
  table: sem_dungeon_trips
  description: "A dungeon trip: from the first pickup guide step to the last hand-in around one run, online time."
  dimensions:
    dungeon: {expr: _.dungeon, description: "Dungeon name."}
    bracket: {expr: _.bracket, description: "guides (lookup guide steps bracket it) or instance (enter and leave only)."}
    trip: {expr: _.trip_id, description: "One trip, by its number in time order: group by it to list the trips one by one."}
    trip_start: {expr: _.start_t, description: "When the trip started (unix seconds)."}
    trip_end: {expr: _.end_t, description: "When the trip ended (unix seconds)."}
    trip_loot: {expr: _.loot_inside, description: "What the trip's run looted inside the instance: a JSON list of [item_id, count] (an observation, not a number to add)."}
    level: {expr: _.level_start, is_entity: true, description: "Level at the trip's start."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When the trip started, local time."}
  measures:
    trip_count:
      expr: _.trip_id.count()
      description: "Dungeon trips."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: trips,
                 caveats: "One per run; bracket says whether guide steps widened it."}
    trip_s:
      expr: _.online_s.sum()
      description: "Online seconds from the trip's start to its end: pickup, travel, inside, travel back, hand-in."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Online time only: logging out mid-trip doesn't count."}
    trip_inside_s:
      expr: _.inside_s.sum()
      description: "Online seconds inside the instance during the trip."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Online time, so it can differ from run_s by a few seconds."}
    trip_travel_s:
      expr: _.travel_to_s.sum() + _.travel_back_s.sum()
      description: "Online seconds getting to the instance and back to the first hand-in."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Needs guide steps for the edges: an `instance` bracket trip has 0."}
    trip_pickup_s:
      expr: _.pickup_s.sum()
      description: "Online seconds picking up the dungeon's quests at the start of the trip (lookup pickup guide steps)."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "0 for a trip with no pickup steps (bracket instance)."}
    trip_travel_to_s:
      expr: _.travel_to_s.sum()
      description: "Online seconds from the trip's start (or the last pickup) to entering the instance."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Online time only. trip_travel_s is this plus trip_travel_back_s."}
    trip_travel_back_s:
      expr: _.travel_back_s.sum()
      description: "Online seconds from leaving the instance to the first hand-in."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Online time only; 0 when the trip ends at the instance's door."}
    trip_handin_s:
      expr: _.handin_s.sum()
      description: "Online seconds handing in the dungeon's quests at the end of the trip (lookup hand-in guide steps)."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: seconds,
                 caveats: "0 for a trip with no hand-in steps."}
    trip_xp_inside:
      expr: _.xp_inside.sum()
      description: "XP gained inside the instance during the trip (kills, and anything else that paid inside)."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: observed, unit: xp,
                 caveats: "The XP of the run, at the level it was run: another level pays its kills differently."}
    trip_xp_quests:
      expr: _.xp_quests.sum()
      description: "XP from the trip's quests handed in during the trip."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: observed, unit: xp,
                 caveats: "A trip quest handed in a day later is not in it."}
    trip_quests_handed_in:
      expr: _.quests_handed_in.sum()
      description: "The trip's quests handed in during the trip."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: observed, unit: quests,
                 caveats: "Only the dungeon's own quests (the lookup guide steps'), handed in before the trip ended."}
    trip_quest_money_copper:
      expr: _.quest_money_copper.sum()
      description: "Money the trip's quest hand-ins paid, copper."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: observed, unit: copper,
                 caveats: "Quest rewards only; the loot's worth is not in it."}
    trip_xp:
      expr: _.xp_inside.sum() + _.xp_quests.sum()
      description: "XP inside the instance plus XP from the trip's quests handed in during the trip."
      metadata: {kind: simple, aggregation: sum, time_meaning: interval_start, evidence_basis: reconstructed, unit: xp,
                 caveats: "A trip quest handed in a day later is not in it."}
  calculated_measures:
    trip_xp_per_hour:
      expr: _.trip_xp / (_.trip_s / 3600)
      description: "XP per online hour of the whole trip: trip_xp over trip_s."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: interval_start, evidence_basis: reconstructed, unit: xp/hour,
                 caveats: "The number to compare with questing XP/hour; run_xp_per_hour flatters dungeons.",
                 eligibility: {where: "_.online_s > 0",
                   means: "A trip with online time."}}
    trip_inside_share:
      expr: _.trip_inside_s / _.trip_s
      description: "Share of the trip spent inside the instance."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: interval_start, evidence_basis: reconstructed, unit: share,
                 caveats: "0 to 1.",
                 eligibility: {where: "_.online_s > 0",
                   means: "A trip with online time."}}

snapshots:
  table: sem_snapshots
  description: "The character snapshots the shipper sends at logout and /reload: money, XP, bind."
  dimensions:
    level: {expr: _.level, is_entity: true, description: "Character level."}
    zone: {expr: _.zone, description: "Zone name."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When the snapshot was taken, local time."}
  measures:
    snapshot_count:
      expr: _.t.count()
      description: "Snapshots (logouts and reloads)."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: snapshots,
                 caveats: "Only what the shipper read: a crash leaves none."}
    gold_delta_copper:
      expr: _.money_copper.argmax(_.t, where=_.money_copper.notnull()) - _.money_copper.argmin(_.t, where=_.money_copper.notnull())
      description: "Money on the group's last snapshot minus money on its first, copper."
      metadata: {kind: derived, aggregation: endpoint_difference, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                 caveats: "Not additive: a week's delta is not the sum of its days (the change between days is in neither). NULL with fewer than two snapshots with money at different times in the group: gold_delta_copper_evidence beside it counts them (0: no snapshot, 1: one, not enough).",
                 min_evidence: {count: "_.t.nunique(where=_.money_copper.notnull())", at_least: 2,
                   means: "two snapshots with money, taken at different times"}}
    snapshot_first_level:
      expr: _.level.argmin(_.t)
      description: "The level on the group's first snapshot."
      metadata: {kind: simple, aggregation: earliest, time_meaning: snapshot_observation, evidence_basis: observed, unit: level,
                 caveats: "A point, not a sum: the first sheet of the group (with snapshot_first_xp, where the character stood)."}
    snapshot_first_xp:
      expr: _.xp.argmin(_.t)
      description: "The XP into its level on the group's first snapshot."
      metadata: {kind: simple, aggregation: earliest, time_meaning: snapshot_observation, evidence_basis: observed, unit: xp,
                 caveats: "Read it with snapshot_first_level."}
    snapshot_last_level:
      expr: _.level.argmax(_.t)
      description: "The level on the group's last snapshot."
      metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: level,
                 caveats: "A point, not a sum: the newest sheet of the group."}
    snapshot_last_xp:
      expr: _.xp.argmax(_.t)
      description: "The XP into its level on the group's last snapshot."
      metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: xp,
                 caveats: "Read it with snapshot_last_level."}
    snapshot_last_xp_max:
      expr: _.xp_max.argmax(_.t)
      description: "XP the level needs, on the group's last snapshot."
      metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: xp,
                 caveats: "The newest snapshot where it is known: a newest snapshot without it gives the one before. NULL with no snapshot in the group."}
    money_copper:
      expr: _.money_copper.argmax(_.t)
      description: "Money on the newest snapshot, copper."
      metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                 caveats: "The newest snapshot where it is known: a newest snapshot without it gives the one before. NULL with no snapshot in the group."}
    snapshot_last_zone:
      expr: _.zone.argmax(_.t)
      description: "Zone on the group's last snapshot."
      metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: zone,
                 caveats: "The newest snapshot where it is known: a newest snapshot without it gives the one before. NULL with no snapshot in the group."}
    bind:
      expr: _["bind"].argmax(_.t)
      description: "Where the hearthstone is bound, on the newest snapshot."
      metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: place,
                 caveats: "The newest snapshot where it is known: a newest snapshot without it gives the one before. NULL with no snapshot in the group."}
    resting:
      expr: _.resting.argmax(_.t)
      description: "1 when the newest snapshot was taken in a rested area (an inn or a city), else 0."
      metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: flag,
                 caveats: "The newest snapshot where it is known: a newest snapshot without it gives the one before. NULL with no snapshot in the group."}

quests:
  table: sem_quests
  description: "Each quest the log held: its accept paired with its hand-in or abandon, and the online time it took."
  dimensions:
    quest: {expr: _.quest, description: "Quest title (the records' own; \"Quest <id>\" when none names it). Two quests with one title group together: add quest_id."}
    quest_id: {expr: _.quest_id, description: "Quest id."}
    status: {expr: _.status, description: "done (accept and hand-in seen), abandoned, failed (the game failed it: still in the log, can't be handed in), open (still in the log; accepted before tracking began when only its objectives were seen done), untimed (handed in, accepted before tracking began) or 'done (inferred)' (still in the log, but handed in with the Recorder off: done_why says what shows it)."}
    done_why: {expr: _.done_why, description: "For 'done (inferred)': the evidence, e.g. a reward only that quest gives worn or in the bags, or Questie's completed list. NULL otherwise."}
    level: {expr: _.level, is_entity: true, description: "Level at the hand-in or abandon (at the accept while open)."}
    level_accepted: {expr: _.level_accepted, description: "Level at the accept (NULL for untimed)."}
    zone: {expr: _.zone, description: "Zone of the hand-in, else of the accept."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When the quest was handed in or abandoned (accepted, while open), local time."}
  measures:
    quest_count:
      expr: _.quest_row.count()
      description: "Quests (one per accept, or per hand-in or objectives done with no accept seen)."
      metadata: {kind: simple, aggregation: sum, time_meaning: quest_closure, evidence_basis: reconstructed, unit: quests,
                 caveats: "A repeatable quest counts once per accept."}
    quest_s:
      expr: _.quest_s.sum()
      description: "Time on quests: every online second while a quest was in the log, shared equally among the quests open in that second."
      metadata: {kind: simple, aggregation: sum, time_meaning: quest_closure, evidence_basis: allocated, unit: seconds,
                 caveats: "Additive: the quests' times sum to the online time with a quest open, nothing counted twice. It can't tell which quest the player worked on, so a quest that sits in the log takes its share of the others' time. NULL for untimed quests."}
    quest_open_s:
      expr: _.open_online_s.sum()
      description: "Online seconds while the quest was in the log, in full for each open quest."
      metadata: {kind: simple, aggregation: sum, time_meaning: quest_closure, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Not additive across quests: ten open quests each count the same evening. Use quest_s for time spent."}
    quest_wall_s:
      expr: _.wall_s.sum()
      description: "Calendar seconds from accept to hand-in or abandon."
      metadata: {kind: simple, aggregation: sum, time_meaning: quest_closure, evidence_basis: reconstructed, unit: seconds,
                 caveats: "Counts the nights and days off in between: never a time spent."}
    quest_reward_xp:
      expr: _.xp.sum()
      description: "XP the hand-ins paid (untimed quests included)."
      metadata: {kind: simple, aggregation: sum, time_meaning: quest_closure, evidence_basis: observed, unit: xp,
                 caveats: "Same hand-ins as quest_xp in records, grouped by quest."}
    quest_reward_copper:
      expr: _.money_copper.sum()
      description: "Money the hand-ins paid, copper."
      metadata: {kind: simple, aggregation: sum, time_meaning: quest_closure, evidence_basis: observed, unit: copper,
                 caveats: "Quest rewards only."}
    done_quest_xp:
      expr: _.xp.sum(where=_.status == 'done')
      description: "XP of the done quests (accept and hand-in both seen)."
      metadata: {kind: simple, aggregation: sum, time_meaning: quest_closure, evidence_basis: observed, unit: xp,
                 caveats: "Leaves out untimed quests, whose time is unknown. NULL without a done quest."}
    done_quest_s:
      expr: _.quest_s.sum(where=_.status == 'done')
      description: "quest_s of the done quests."
      metadata: {kind: simple, aggregation: sum, time_meaning: quest_closure, evidence_basis: allocated, unit: seconds,
                 caveats: "Abandoned and open quests' time is in quest_s, not here. NULL without a done quest."}
    quest_accepted_t:
      expr: _.accepted_t.min()
      description: "When the quest was accepted, unix seconds: the first accept in the group."
      metadata: {kind: simple, aggregation: min, time_meaning: quest_closure, evidence_basis: observed, unit: unix seconds,
                 caveats: "NULL for a quest accepted before tracking began (untimed, or open with its objectives seen done). Filter status for one row of a quest taken twice."}
    quest_complete_t:
      expr: _.complete_t.max()
      description: "When its objectives were last reported complete (a complete record between its accept and its close), unix seconds."
      metadata: {kind: simple, aggregation: max, time_meaning: quest_closure, evidence_basis: observed, unit: unix seconds,
                 caveats: "NULL while the objectives aren't done, or for a quest with nothing to collect the Recorder saw complete. For an open quest: ready to hand in."}
  calculated_measures:
    quest_xp_per_min:
      expr: _.done_quest_xp / (_.done_quest_s / 60)
      description: "XP per minute on quests: done_quest_xp over done_quest_s."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: quest_closure, evidence_basis: allocated, unit: xp/minute,
                 caveats: "Done quests only. Time is the shared quest_s, so a quick quest done while ten sat in the log looks quicker than it was, and one carried for days looks slower. Kill XP on the way is not in it.",
                 eligibility: {where: "_.quest_s.notnull() & _.xp.notnull()",
                   means: "A done quest with its shared time and its XP known."}}
    quests_open_avg:
      expr: _.quest_open_s / _.quest_s
      description: "How many quests were in the log on average while these were: quest_open_s over quest_s."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: quest_closure, evidence_basis: allocated, unit: quests,
                 caveats: "1 means one quest at a time; read it next to quest_s.",
                 eligibility: {where: "_.quest_s.notnull() & _.open_online_s.notnull()",
                   means: "A quest with both times (untimed quests have neither)."}}

gold_moves:
  table: sem_gold_moves
  description: "The purse between two consecutive snapshots (logout or /reload): what it moved and the part the records name (quest money)."
  dimensions:
    level: {expr: _.level, is_entity: true, description: "Level at the first of the two snapshots."}
    dings: {expr: _.dings, description: "Level-ups between the two snapshots: 0 for a move inside one level."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "The first snapshot, local time."}
  measures:
    gold_moves:
      expr: _.t0.count()
      description: "Moves between two snapshots."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: reconstructed, unit: moves,
                 caveats: "A crash leaves no snapshot: the next move spans both sessions."}
    gold_moved_copper:
      expr: _.delta_copper.sum()
      description: "How much the purse moved, copper: the sum of each move's change."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: reconstructed, unit: copper,
                 caveats: "Additive, unlike gold_delta_copper: a week is the sum of its moves. A move counts in the level and day of its first snapshot."}
    gold_quest_copper:
      expr: _.quest_copper.sum()
      description: "Money hand-ins paid inside the moves, copper."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                 caveats: "Quest rewards the Recorder saw; one handed in with the Recorder off is unexplained."}
    unexplained_gold_delta:
      expr: _.other_copper.sum()
      description: "The purse's change no record explains, copper: gold_moved_copper minus gold_quest_copper."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: inferred, unit: copper,
                 caveats: "Loot coin, vendor and auction sales and mail in, less repairs, vendor purchases, training, flights, auction deposits and mail out, all together. No addon the kit reads saves spending (the Recorder has quest money only; Auctionator saves prices, not sales), so this is never repairs. A move counts in the level of its first snapshot: filter dings = 0 for moves inside one level."}
    gold_move_online_s:
      expr: _.online_s.sum()
      description: "Online seconds (timeline) between the two snapshots of each move, summed."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: reconstructed, unit: seconds,
                 caveats: "0 for a move the Recorder didn't see (switched off, or not installed): the money moved, the time is unknown."}
    gold_changes:
      expr: _.t0.count(where=_.delta_copper != 0)
      description: "Moves where the purse changed."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: moves,
                 caveats: "A move that earned and spent the same counts as no change."}
    gold_first_t:
      expr: _.t0.min()
      description: "When the group's first move started: its first snapshot, Unix seconds."
      metadata: {kind: simple, aggregation: min, time_meaning: snapshot_observation, evidence_basis: observed, unit: unix seconds,
                 caveats: "An edge of the window, not a measure of it."}
    gold_last_t:
      expr: _.t1.max()
      description: "When the group's last move ended: its last snapshot, Unix seconds."
      metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: observed, unit: unix seconds,
                 caveats: "An edge of the window, not a measure of it."}
  calculated_measures:
    gold_per_online_hour:
      expr: _.gold_moved_copper / (_.gold_move_online_s / 3600)
      description: "Net gold per online hour: gold_moved_copper over gold_move_online_s, copper an hour."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: snapshot_observation, evidence_basis: reconstructed, unit: copper/hour,
                 caveats: "Everything earned less everything spent. NULL when no move has online time (no Recorder): the plan then estimates the time from the level splits.",
                 eligibility: {where: "_.online_s > 0",
                   means: "Moves with online time the Recorder saw: the money and the hours come from the same moves. A move it missed would add money with no time."}}

rested:
  table: sem_rested
  description: "The intervals between two Recorder XP records (about 5 minutes) in which the rested pool went down: how much it went down and the kill XP of the same interval."
  dimensions:
    level: {expr: _.level, is_entity: true, description: "Character level."}
    zone: {expr: _.zone, description: "Zone name."}
    session_id: {expr: _.session_id, is_entity: true, description: "Login span (sessions)."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "The XP record that ends the interval, local time."}
  measures:
    rested_intervals:
      expr: _.t.count()
      description: "Intervals in which the rested pool went down."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: intervals,
                 caveats: "Only while the Recorder ran: its XP records bound the intervals."}
    rested_used_xp:
      expr: _.rested_used.sum()
      description: "Rested XP used: how far the pool went down, summed over the intervals."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: xp,
                 caveats: "Kills inside a dungeon trip use it too: rested_per_kill_xp leaves those intervals out."}
    rested_kill_xp:
      expr: _.kill_xp.sum()
      description: "Kill XP recorded in the same intervals, outside dungeon trips (kill records' xp_reward)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: xp,
                 caveats: "Rested bonus included, as the game reports it."}
  calculated_measures:
    rested_per_kill_xp:
      expr: _.rested_used_xp / _.rested_kill_xp
      description: "Rested XP used per point of kill XP: rested_used_xp over rested_kill_xp, measured, no rule assumed."
      metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: event, evidence_basis: observed, unit: xp/xp,
                 caveats: "NULL without outdoor kill XP, or with fewer than three intervals to measure.",
                 eligibility: {where: "_.trip_kill_xp == 0",
                   means: "Intervals with no kill inside a dungeon trip: the rested used and the kill XP are of the same kills."},
                 min_evidence: {count: "_.t.count(where=_.trip_kill_xp == 0)", at_least: 3,
                   means: "three intervals outside dungeon trips where the pool went down"}}

loot:
  table: sem_loot
  description: "Every item the Recorder saw looted (loot_items), with the record it came in."
  dimensions:
    item_id: {expr: _.item_id, description: "Item id (its Wowhead page: item=<id>)."}
    trip_id: {expr: _.dungeon_trip_id, description: "The dungeon trip it was looted on (dungeon_trips.trip_id), NULL outside one."}
    level: {expr: _.level, is_entity: true, description: "Character level."}
    zone: {expr: _.zone, description: "Zone name."}
    session_id: {expr: _.session_id, is_entity: true, description: "Login span (sessions)."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When it was looted, local time."}
  measures:
    looted_items:
      expr: _.n.sum()
      description: "Items looted, a stack counted by its size."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: items,
                 caveats: "Only what the Recorder saw; what it is worth is the item's (vendor price, the player's own scans), not here."}

xp:
  table: sem_xp
  description: "The XP bar as the Recorder reads it every 5 minutes: each row an xp record, with the guide step in force then."
  dimensions:
    level: {expr: _.level, is_entity: true, description: "Character level."}
    zone: {expr: _.zone, description: "Zone name."}
    session_id: {expr: _.session_id, is_entity: true, description: "Login span (sessions)."}
    hour: {expr: _.hour_local, description: "Hour of day 0-23, local time."}
    guide: {expr: _.guide, description: "The Polestar guide of the online interval the reading closes (timeline), NULL outside one."}
    step: {expr: _.step, description: "That guide's step number. Group by guide too: step numbers restart in each guide."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When the XP bar was read, local time."}
  measures:
    xp_gained:
      expr: _.xp_gained.sum()
      description: "XP the bar gained between two readings, every source together (kills, quests, discovery, rested bonus)."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: xp,
                 caveats: "Read every 5 minutes: the XP of the last minutes before a logout counts at the next reading. By guide and step: the reading's own interval, so XP made just before a step change can land on the next step."}
    bar_t:
      expr: _.t.max()
      description: "When the newest XP bar reading of the group was taken, unix seconds (UTC)."
      metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: unix seconds,
                 caveats: "NULL with no reading in the group."}
    bar_level:
      expr: _.level.argmax(_.t)
      description: "Level on the newest XP bar reading."
      metadata: {kind: simple, aggregation: latest, time_meaning: event, evidence_basis: observed, unit: level,
                 caveats: "The newest reading where it is known: a newest reading without it gives the one before. NULL with no reading in the group."}
    bar_xp:
      expr: _.xp.argmax(_.t)
      description: "XP into the level on the newest XP bar reading."
      metadata: {kind: simple, aggregation: latest, time_meaning: event, evidence_basis: observed, unit: xp,
                 caveats: "The newest reading where it is known: a newest reading without it gives the one before. NULL with no reading in the group."}
    bar_xp_max:
      expr: _.xp_max.argmax(_.t)
      description: "XP the level needs, on the newest XP bar reading."
      metadata: {kind: simple, aggregation: latest, time_meaning: event, evidence_basis: observed, unit: xp,
                 caveats: "The newest reading where it is known: a newest reading without it gives the one before. NULL with no reading in the group."}
    bar_rested_xp:
      expr: _.rested_xp.argmax(_.t)
      description: "Rested XP left on the newest XP bar reading."
      metadata: {kind: simple, aggregation: latest, time_meaning: event, evidence_basis: observed, unit: xp,
                 caveats: "The newest reading where it is known: a newest reading without it gives the one before. NULL with no reading in the group."}

upgrades:
  table: sem_upgrades
  description: "The gear advice's upgrades for the spec the gear is scored for (the player's WEIGHTS setting, else the talents): one row per item and source, items within 3 levels. The decision data behind 'what should I equip next and where do I get it'."
  dimensions:
    slot: {expr: _.slot_name, description: "The slot the item would go in (Head, Chest, Finger...; both rings are Finger)."}
    slot_id: {expr: _.slot, description: "The inventory slot 1-19: which of two rings (11, 12) or trinkets (13, 14) it is measured against or worn in."}
    item_id: {expr: _.item_id, description: "Item id (its Wowhead page: item=<id>)."}
    item: {expr: _.name, description: "Item name."}
    fit: {expr: _.fit, description: "How the item fits the scored spec: yes (built for it), any, spec (built for another spec of the class), class (made for another class), unknown."}
    now: {expr: _.now, description: "1 when the character can wear it at its level now, 0 within 3 levels."}
    with_item_id: {expr: _.with_item_id, description: "For a one-hander: the item in the other hand it is scored with (a weapon is a whole setup), NULL alone or for any other slot."}
    rank_now: {expr: _.rank_now, description: "The item's place in its slot among the upgrades wearable now, by gain: 1 is the biggest. NULL for an item not wearable yet. Filter rank_now <= 3 for each slot's top three."}
    fills_empty: {expr: _.fills_empty, description: "1 when the slot is empty now."}
    source: {expr: _.source_text, description: "One source in the gear advice's words: 'drop: Fallen Champion in Scarlet Monastery: Library (dungeon, levels 30-38), 38.5%', 'quest ...', 'craft: Tailoring 150; ...', 'in your bags: equip it'."}
    source_kind: {expr: _.source_kind, description: "quest, drop, craft, bags or bank (or another kind the gear data names: reputation, vendor...)."}
    source_wowhead: {expr: _.source_wowhead, description: "The source's Wowhead page (the quest, the boss, the craft's spell); NULL when it has none."}
    instance: {expr: _.instance, description: "Dungeon or raid of an instance drop or quest, else NULL."}
    zone: {expr: _.zone, description: "Zone of the drop or the quest."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
  measures:
    upgrade_gain:
      expr: _.gain.max()
      description: "Score gain over what is worn in the slot (Polestar's points, for the scored spec): the biggest in the group."
      metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: estimated, unit: points,
                 caveats: "The gear advice as of the newest character sheet, scored with the weights the player chose. Not additive: two items for one slot are alternatives. Group by item_id for one item's gain."}
    upgrade_gain_share_pct:
      expr: _.gain_share_pct.max()
      description: "The item's gain as a percent of the score of everything worn now."
      metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: estimated, unit: percent,
                 caveats: "Lead with it and upgrade_gain; a percent over the replaced item misleads against a weak one. Group by item_id."}
    upgrade_bis_pct:
      expr: _.bis_pct.max()
      description: "The item's score as a percent of the best its slot can hold at this level for the scored spec (100: the best)."
      metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: estimated, unit: percent,
                 caveats: "Say it with upgrade_bis_pct_worn as the page does: '17% → 100% on your head', never as '+83%'. NULL when there is nothing to measure against."}
    upgrade_bis_pct_worn:
      expr: _.bis_pct_worn.max()
      description: "The same percent for what is worn in that slot now."
      metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: estimated, unit: percent,
                 caveats: "NULL for an empty slot, or when there is nothing to measure against."}
    upgrade_sources:
      expr: _.item_id.count()
      description: "Ways to get the upgrades: one per item and source."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: estimated, unit: sources,
                 caveats: "An item with a drop and a quest counts twice; group by item_id and source to list them."}
    best_upgrade:
      expr: _.name.min(where=_.rank_now == 1)
      description: "The best upgrade wearable now: the item with the biggest gain (rank_now 1), its name."
      metadata: {kind: simple, aggregation: top, time_meaning: snapshot_observation, evidence_basis: estimated, unit: item,
                 caveats: "Group by slot: over several slots it is the first name in alphabetical order among their best. NULL when nothing wearable now beats what is worn."}
    best_upgrade_id:
      expr: _.item_id.min(where=_.rank_now == 1)
      description: "The best upgrade wearable now, its item id (its Wowhead page: item=<id>)."
      metadata: {kind: simple, aggregation: top, time_meaning: snapshot_observation, evidence_basis: estimated, unit: item id,
                 caveats: "Group by slot, as best_upgrade."}
    best_upgrade_gain:
      expr: _.gain.max(where=_.rank_now == 1)
      description: "The best upgrade's score gain over what is worn (Polestar's points, for the scored spec)."
      metadata: {kind: simple, aggregation: top, time_meaning: snapshot_observation, evidence_basis: estimated, unit: points,
                 caveats: "Group by slot, as best_upgrade. Not additive: one slot's best is not another's."}
    best_upgrade_bis_pct:
      expr: _.bis_pct.max(where=_.rank_now == 1)
      description: "The best upgrade's score as a percent of the best its slot can hold at this level for the scored spec."
      metadata: {kind: simple, aggregation: top, time_meaning: snapshot_observation, evidence_basis: estimated, unit: percent,
                 caveats: "Say it with upgrade_bis_pct_worn as the page does: '17% → 64% on your head', never as '+47%'. NULL when there is nothing to measure against."}

worn:
  table: sem_gear
  description: "The items worn on the newest character sheet, as the gear advice scores them for the spec the gear is scored for."
  dimensions:
    slot: {expr: _.slot_name, description: "The slot it is worn in (Head, Chest, Finger...; both rings are Finger)."}
    slot_id: {expr: _.slot, description: "The inventory slot 1-19: which of two rings (11, 12) or trinkets (13, 14) it is measured against or worn in."}
    item_id: {expr: _.item_id, description: "Item id (its Wowhead page: item=<id>)."}
    item: {expr: _.name, description: "Item name."}
    fit: {expr: _.fit, description: "How the worn item fits the scored spec: yes (built for it), any, spec (built for another spec of the class), class (made for another class), unknown."}
    built_for: {expr: _.built_for, description: "Who the item's stats are made for, in words (healers, damage casters...)."}
    scored_for: {expr: _.scored_for, description: "The spec the gear advice scores for: the player's WEIGHTS setting, else the talents."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
  measures:
    worn_items:
      expr: _.item_id.count()
      description: "Items worn."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: items,
                 caveats: "The newest sheet only; a shirt or tabard counts when it has a name."}
    worn_score:
      expr: _.score.sum()
      description: "The worn items' score for the scored spec (Polestar's points): one item's, or the whole gear's summed over slots."
      metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: estimated, unit: points,
                 caveats: "NULL for an item the gear data doesn't know."}
    worn_bis_pct:
      expr: _.bis_pct.max()
      description: "The worn item's score as a percent of the best its slot can hold at this level for the scored spec (100: the best)."
      metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: estimated, unit: percent,
                 caveats: "Group by slot and item_id: over several slots it is the best of them. NULL when there is nothing to measure against."}
    worn_item:
      expr: _.name.min(where=_.weak_rank == 1)
      description: "The worn item an upgrade replaces: the slot's item, or the weaker of two (rings, trinkets) by score."
      metadata: {kind: simple, aggregation: top, time_meaning: snapshot_observation, evidence_basis: observed, unit: item,
                 caveats: "Group by slot: over several slots it is the first name in alphabetical order among their weakest. Weaker by the scored spec's points; an item the gear data doesn't score counts as the stronger."}
    worn_item_id:
      expr: _.item_id.min(where=_.weak_rank == 1)
      description: "That worn item's id (its Wowhead page: item=<id>)."
      metadata: {kind: simple, aggregation: top, time_meaning: snapshot_observation, evidence_basis: observed, unit: item id,
                 caveats: "Group by slot, as worn_item."}
    worn_fit:
      expr: _.fit.min(where=_.weak_rank == 1)
      description: "How that worn item fits the scored spec: yes, any, spec (built for another spec of the class), class (made for another class) or unknown."
      metadata: {kind: simple, aggregation: top, time_meaning: snapshot_observation, evidence_basis: estimated, unit: fit,
                 caveats: "Group by slot, as worn_item. The spec is the player's WEIGHTS setting, else the talents (scored_for)."}
    worn_item_bis_pct:
      expr: _.bis_pct.min(where=_.weak_rank == 1)
      description: "That worn item's score as a percent of the best its slot can hold at this level for the scored spec."
      metadata: {kind: simple, aggregation: top, time_meaning: snapshot_observation, evidence_basis: estimated, unit: percent,
                 caveats: "Group by slot, as worn_item. NULL when there is nothing to measure against."}

cross_model_metrics:
  kills_per_combat_hour:
    expr: kills / (combat_s / 3600)
    description: "Kills per hour in combat: kills (records) over combat_s (timeline)."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: kills/hour,
               caveats: "Combat time includes fights that ended in no kill (fleeing, dying, a tapped mob). NULL without combat time.",
               eligibility: {where: {records: "_.session_id.notnull()", timeline: "_.session_id.notnull()"},
                 means: "Inside a login span the Recorder saw, on both sides."}}
  deaths_per_online_hour:
    expr: deaths / (online_s / 3600)
    description: "Deaths per online hour: deaths (records) over online_s (timeline)."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: deaths/hour,
               caveats: "Online time includes AFK; filter or compare with active_s.",
               eligibility: {where: {records: "_.session_id.notnull()", timeline: "_.session_id.notnull()"},
                 means: "Inside a login span the Recorder saw, on both sides."}}
  xp_per_zone_hour:
    expr: xp_gained / (zone_s / 3600)
    description: "XP an hour in a zone: xp_gained (the XP bar's readings) over zone_s (the zone records' time)."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: xp/hour,
               caveats: "An XP reading carries the zone or subzone text the game shows, a zone record the zone: XP read under a subzone's name has no zone time and reads NULL there. Group by zone (or session_id, time). NULL without zone time.",
               eligibility: {where: {xp: "_.xp_gained.notnull()", zone_time: "_.dur_s > 0"},
                 means: "XP readings with a change, and zone records with time: both sides only count what was measured."}}
  quest_xp_per_played_hour:
    expr: quest_xp / (played_s / 3600)
    description: "XP from quest hand-ins per played hour in the level: quest_xp (records) over played_s (levels)."
    dimensions: [level, character, class]
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, level_completion], evidence_basis: observed, unit: xp/hour,
               caveats: "Levels only share level, character, class and time with records: group by one of those. Whole splits only, on both sides.",
               eligibility: {where: {records: "_.level_whole == 1", levels: "(_.played_s > 0) & (_.partial == 0)"},
                 means: "Levels with a whole split: the quest XP of those levels over their played time. The level in play and a partial split stay out of both sides."}}

# Views per grain (owner, 2026-11-22: "use the semantic model all the time"):
# one DuckDB view per entity, made by compiling the metrics above at that grain
# (semantic.py, view_sql), never written by hand. Each model aggregates to the
# entity, the parts join on it, so a view has one row per key: no fan-out.
# `entity` is the grain, `metrics` its columns (each also asked on its own by
# query_metric with group_by [entity]: tests/invariants/test_views.py
# checks they agree), `dimensions` columns that hold one value per key in the
# models that have them (joined on the entity only), `where` keeps the rows
# with a key. A metric that can't be grouped by the entity is refused when
# the catalogue is built: left out, never faked. play_sql and the judge read
# them by name; list_metrics lists them with their columns.
views:
  per_level:
    entity: level
    description: "One row per level: time played, wall clock and the longest silence, how much of it the Recorder saw, deaths, the route plan against the play, quests, gold and its rate, loot, and the rested XP the kills used."
    dimensions: [partial, ding_t]
    where: [{dimension: level, op: is not null}]
    metrics: [played_s, calendar_s, offline_s, longest_gap_s, longest_gap_from, longest_gap_to, recorder_missed_s,
              recorder_coverage, online_s, deaths, deaths_per_online_hour, planned_s, class_planned_s, vs_route,
              split_quests, quests_done, xp_gained, ride_s,
              gold_moved_copper, gold_delta_copper, gold_changes, gold_move_online_s, gold_per_online_hour, looted_items,
              rested_used_xp, rested_kill_xp, rested_per_kill_xp]
  per_session:
    entity: session_id
    description: "One row per login span: when it began and ended, its length and XP, online, active, combat and dungeon time, kills, deaths, quests, the zone records' time, guide steps, skips and flights."
    dimensions: [weekday, start_hour, start_t, end_t, level_start, level_end]
    where: [{dimension: session_id, op: is not null}]
    metrics: [session_s, session_xp, xp_per_session_hour, online_s, active_s, combat_s, dungeon_s, kills, deaths,
              quests_done, quests_accepted, deaths_per_online_hour, kills_per_combat_hour, xp_gained, zone_s, guide_steps,
              steps_skipped, flights]
  per_zone:
    entity: zone
    description: "One row per zone the Recorder saw: online, combat and dungeon time, kills, deaths, quests and their XP, the zone records' own time and visits, and the XP bar's gain there."
    where: [{dimension: zone, op: is not null}]
    metrics: [online_s, active_s, combat_s, dungeon_s, kills, deaths, quests_done, kill_xp, quest_xp,
              deaths_per_online_hour, kills_per_combat_hour, zone_s, zone_visits, xp_gained, xp_per_zone_hour]
  per_dungeon:
    entity: dungeon
    description: "One row per dungeon: runs and their time and XP inside, trips with the travel around them and their XP an hour."
    where: [{dimension: dungeon, op: is not null}]
    metrics: [run_count, run_s, run_xp, run_xp_per_hour, trip_count, trip_s, trip_travel_s, trip_xp, trip_xp_per_hour,
              trip_inside_share]
  per_trip:
    entity: trip
    description: "One row per dungeon trip: when, at what level, its time phase by phase (pickup, travel there, inside, travel back, hand-in), its XP inside and from its quests, and what its run looted."
    dimensions: [dungeon, level, trip_start, trip_end, trip_loot]
    where: [{dimension: trip, op: is not null}]
    metrics: [trip_s, trip_pickup_s, trip_travel_to_s, trip_inside_s, trip_travel_back_s, trip_handin_s, trip_xp_inside,
              trip_xp_quests, trip_quests_handed_in, trip_quest_money_copper]
  per_guide:
    entity: guide
    description: "One row per Polestar guide: time and XP while it was up, Polestar's steps (done, skipped, jumped, picks, its own step timer), skill-ups, first and last record."
    where: [{dimension: guide, op: is not null}]
    metrics: [online_s, active_s, xp_gained, steps_done, step_s, steps_skipped, steps_jumped, step_picks, skill_ups,
              first_record_t, last_record_t]
  per_quest:
    entity: quest_id
    description: "One row per quest id: times in the log, shared and open time, XP, first accept and last objectives done."
    where: [{dimension: quest_id, op: is not null}]
    metrics: [quest_count, quest_s, quest_open_s, quest_reward_xp, quest_accepted_t, quest_complete_t]
  per_slot:
    entity: slot
    description: "One row per gear slot, for the spec the gear is scored for: the worn item and its fit, the best upgrade wearable now, and the two percents the page says as 'NN% → NN%' (upgrade_bis_pct_worn → best_upgrade_bis_pct)."
    dimensions: [scored_for]
    where: [{dimension: slot, op: is not null}]
    metrics: [worn_items, worn_item, worn_item_id, worn_fit, worn_item_bis_pct, best_upgrade, best_upgrade_id,
              best_upgrade_gain, best_upgrade_bis_pct, upgrade_bis_pct_worn, upgrade_sources]

# Store models (owner, 2026-11-22: every tool reads through the semantic
# layer). What a tool reads from the store itself, not the prep: other
# players, the player's own price scans, the talent changes, the groups in a
# dungeon run. Each declares the `columns` of the relation its tool fetches
# for one answer; semantic.py `read` loads those rows into an in-memory
# DuckDB for that call only and compiles the question as query_metric does,
# contract included. Read only: nothing is copied or kept, the store's own
# retention holds (Battle.net's talent readings stay its 30 days, read live).
# list_metrics lists them; query_metric doesn't read them (no prep holds
# their rows).
store_models:
  players:
    table: sem_players
    description: "Other players Polestar saw (update.probed, feed wow-player): one row per player, context and day, with that day's sightings and the player's last known level, class, race and zones."
    columns: {player: TEXT, context: TEXT, day: TEXT, sightings: INTEGER, last_seen: TEXT, level: REAL,
              classes: TEXT, races: TEXT, zones: TEXT}
    dimensions:
      player: {expr: _.player, description: "The other player's name."}
      context: {expr: _.context, description: "Where Polestar saw them: seen, grouped, dungeon, quest-nearby..."}
      day: {expr: _.day, description: "The day of the sightings, YYYY-MM-DD (UTC)."}
      classes: {expr: _.classes, description: "The classes seen for the player, a JSON list (up to 3)."}
      races: {expr: _.races, description: "The races seen for the player, a JSON list (up to 3)."}
      zones: {expr: _.zones, description: "The zones the player was seen in, a JSON list."}
    measures:
      player_sightings:
        expr: _.sightings.sum()
        description: "Sightings: the update.probed saves that listed the player, summed."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: sightings,
                   caveats: "Polestar saves its list on logout and /reload: a long evening with one player counts once."}
      player_grouped_sightings:
        expr: _.sightings.sum(where=(_.context == 'grouped') | (_.context == 'dungeon'))
        description: "Sightings in a group or a dungeon (contexts grouped and dungeon)."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: sightings,
                   caveats: "NULL when never grouped."}
      player_days:
        expr: _.day.nunique()
        description: "Days the player was seen."
        metadata: {kind: simple, aggregation: count_distinct, time_meaning: event, evidence_basis: observed, unit: days,
                   caveats: "Not additive across players: two players on one day are one day each."}
      player_group_days:
        expr: _.day.nunique(where=(_.context == 'grouped') | (_.context == 'dungeon'))
        description: "Days the player was seen in a group or a dungeon."
        metadata: {kind: simple, aggregation: count_distinct, time_meaning: event, evidence_basis: observed, unit: days,
                   caveats: "0 when never grouped."}
      player_last_seen:
        expr: _.last_seen.max()
        description: "When the player was last seen, UTC ISO time."
        metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: time,
                   caveats: "The newest save that listed them, whatever the context."}
      player_level:
        expr: _.level.max()
        description: "The highest level the saves gave the player."
        metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: level,
                   caveats: "Polestar names most players without a level: NULL then."}

  prices:
    table: sem_prices
    description: "The player's own Auctionator scans (feed wow-prices): one row per item and scan day, its newest revision, with the day's lowest buyout per unit. Nothing from Blizzard's API."
    columns: {item_key: TEXT, item: TEXT, item_id: INTEGER, t: REAL, price_copper: INTEGER, price_high_copper: INTEGER}
    dimensions:
      item_key: {expr: _.item_key, description: "The item: its id, else Auctionator's own key."}
      item_id: {expr: _.item_id, description: "Item id (its Wowhead page: item=<id>), NULL for a key Auctionator alone knows."}
    measures:
      price_scan_days:
        expr: _.t.count()
        description: "Scan days: one per item and day the player scanned it."
        metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: days,
                   caveats: "Only the days the player opened the auction house with Auctionator."}
      price_item:
        expr: _.item.argmax(_.t)
        description: "The item's name on its newest scan."
        metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: name,
                   caveats: "NULL when the scan didn't name it."}
      price_latest_copper:
        expr: _.price_copper.argmax(_.t)
        description: "The lowest buyout per unit on the newest scan day, copper."
        metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "What was listed that day, not what sold: an auction lasts 24 h at most."}
      price_latest_high_copper:
        expr: _.price_high_copper.argmax(_.t)
        description: "The highest buyout per unit on the newest scan day, copper."
        metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "NULL when the scan kept only the lowest."}
      price_latest_t:
        expr: _.t.max()
        description: "The newest scan day's time, Unix seconds."
        metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: observed, unit: unix seconds,
                   caveats: "A day's scans count at the day's newest revision."}
      price_min_copper:
        expr: _.price_copper.min()
        description: "The lowest of the days' lowest buyouts, copper."
        metadata: {kind: simple, aggregation: min, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "Over the scan days in the range only."}
      price_max_copper:
        expr: _.price_copper.max()
        description: "The highest of the days' lowest buyouts, copper."
        metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "Over the scan days in the range only."}
      price_change_copper:
        expr: _.price_copper.argmax(_.t) - _.price_copper.argmin(_.t)
        description: "The lowest buyout on the newest scan day minus on the first, copper."
        metadata: {kind: derived, aggregation: endpoint_difference, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "Two days only, never a trend. NULL with one scan day: price_change_copper_evidence counts them.",
                   min_evidence: {count: "_.t.count()", at_least: 2, means: "two scan days"}}

  talent_changes:
    table: sem_talent_changes
    description: "The character's talent changes (wowstats.talents.history): one row per change between two saved builds, WoWSims Exporter's (every change) or Battle.net's daily reads (the last 3 weeks, read live, never kept). The trees and talents of each change are JSON lists."
    columns: {t: TEXT, date: TEXT, before: TEXT, after: TEXT, gained: TEXT, dropped: TEXT, ranks_gained: INTEGER,
              ranks_dropped: INTEGER}
    dimensions:
      change: {expr: _.t, description: "When the build with the change was saved or read, UTC ISO time."}
      date: {expr: _.date, description: "That day, YYYY-MM-DD."}
      before: {expr: _.before, description: "Points per tree before, a JSON list of {tree, points} in the frame's tab order."}
      after: {expr: _.after, description: "Points per tree after, the same shape."}
      gained: {expr: _.gained, description: "Talents gained or ranked up, a JSON list of {name, spell, from, to}."}
      dropped: {expr: _.dropped, description: "Talents dropped or ranked down, the same shape."}
    measures:
      talent_change_count:
        expr: _.t.count()
        description: "Changes: builds that differ from the one before."
        metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: changes,
                   caveats: "Battle.net reads once a day: two changes in a day are one."}
      talent_ranks_gained:
        expr: _.ranks_gained.sum()
        description: "Ranks gained: each gained talent's new rank minus its old one, summed."
        metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: ranks,
                   caveats: "A respec gains and drops at once: read it with talent_ranks_dropped."}
      talent_ranks_dropped:
        expr: _.ranks_dropped.sum()
        description: "Ranks dropped: each dropped talent's old rank minus its new one, summed."
        metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: ranks,
                   caveats: "Read it with talent_ranks_gained."}

  run_groups:
    table: sem_run_groups
    description: "Each dungeon run (Polestar's instanceRuns, feed wow-dungeon) with the Recorder's group, encounter and death records that belong to it: the group record in force when it began and the ones inside. No names: no addon saves the party."
    columns: {run: TEXT, dungeon: TEXT, level: REAL, seconds: INTEGER, xp: INTEGER, kind: TEXT, size: INTEGER,
              success: TEXT}
    dimensions:
      run: {expr: _.run, description: "When the run began, UTC ISO time: one run."}
      dungeon: {expr: _.dungeon, description: "Dungeon name."}
      level: {expr: _.level, description: "Character level at the run."}
      seconds: {expr: _.seconds, description: "The run's length, seconds (Polestar's)."}
      xp: {expr: _.xp, description: "XP gained in the run (Polestar's)."}
    measures:
      run_party_size:
        expr: _.size.max(where=_.kind == 'group')
        description: "The largest party during the run."
        metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: players,
                   caveats: "NULL without a group record before or inside it (the Recorder off)."}
      run_bosses:
        expr: _.kind.count(where=(_.kind == 'encounter') & ((_.success == 'true') | (_.success == '1')))
        description: "Boss fights won in the run."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: bosses,
                   caveats: "Encounter records only: a boss the game doesn't flag as one isn't counted."}
      run_wipes:
        expr: _.kind.count(where=(_.kind == 'encounter') & ((_.success == 'false') | (_.success == '0')))
        description: "Boss fights lost in the run."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: wipes,
                   caveats: "Encounter records only."}
      run_deaths:
        expr: _.kind.count(where=_.kind == 'death')
        description: "The character's deaths in the run."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: deaths,
                   caveats: "The character's own, not the party's."}
