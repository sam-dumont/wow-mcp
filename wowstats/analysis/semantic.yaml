                 min_evidence: {count: "_.t.nunique(where=_.honorable_kills.notnull())", at_least: 2,
                   means: "two Altoholic saves with the honorable kills, at different times"}}

lockouts:
  table: sem_lockouts
  description: "Raid and dungeon lockouts: Altoholic's saved instances (exact: the reset time, the bosses), else an estimate from the Recorder's raid boss kills of the last 7 days."
  dimensions:
    instance: {expr: _.instance, description: "The instance's name (with its difficulty when above normal)."}
    instance_id: {expr: _.instance_id, description: "The game's lockout id (Altoholic only)."}
    lockout_active: {expr: _.active, description: "1 when the lockout hadn't reset when the data was read, else 0."}
    lockouts_basis: {expr: _.source, description: "altoholic: Altoholic's saved instances, exact. recorder: an estimate from the Recorder's raid boss kills (reset time and lockout id unknown)."}
    character: {expr: _.character, description: "The character (one per query: the char argument)."}
    class: {expr: _.char_class, description: "The character's class, from its latest session record."}
    week: {expr: _.at_local.truncate('W').date(), description: "The week the lockout resets (Altoholic) or of the last kill (Recorder), local time, named by its Monday."}
    time: {expr: _.at_local, is_time_dimension: true, smallest_time_grain: TIME_GRAIN_DAY,
           description: "When the lockout resets (Altoholic), else the last raid boss kill (the Recorder's estimate), local time."}
  measures:
    lockouts_active:
      expr: _.active.sum().fill_null(0)
      description: "Lockouts that hadn't reset when the data was read: this week's."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: lockouts,
                 caveats: "Exact with Altoholic (lockouts_basis altoholic). Without it, an estimate from the Recorder: a raid with a boss killed in the last 7 days (the reset day unknown, five-player dungeons left out). Install Altoholic for the exact list. 0 before any raid: they open on 2026-12-09."}
    lockouts_seen:
      expr: _.instance.count()
      description: "Lockouts known, past and active."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: lockouts,
                 caveats: "Altoholic keeps a lockout until it resets; each save it shipped adds its own. Without Altoholic, the Recorder's estimate: one per raid per week of boss kills. Install Altoholic for the exact list."}
    raid_lockouts_active:
      expr: (_.active * _.raid).sum().fill_null(0)
      description: "Raid lockouts that hadn't reset when the data was read."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: lockouts,
                 caveats: "As lockouts_active: exact with Altoholic, an estimate without it (install Altoholic for the exact list)."}
    lockout_bosses_killed:
      expr: _.bosses_killed.sum().fill_null(0)
      description: "Bosses killed in the lockouts of the group."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: bosses,
                 caveats: "Group by instance. Without Altoholic, the raid bosses the Recorder saw killed (encounter records), since the Recorder ran: install Altoholic for the game's own list."}
    lockout_bosses_left:
      expr: (_.bosses_total - _.bosses_killed).sum()
      description: "Bosses still alive in the lockouts of the group."
      metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: bosses,
                 caveats: "Group by instance. Altoholic only (the game lists every boss of a lockout): NULL without it. Install Altoholic."}
    lockout_next_reset_t:
      expr: _.expires_t.min(where=_.active == 1)
      description: "When the first active lockout resets, unix seconds."
      metadata: {kind: simple, aggregation: min, time_meaning: event, evidence_basis: observed, unit: unix_seconds,
                 caveats: "Altoholic only: NULL without it (the Recorder's estimate has no reset time) or with no active lockout. Install Altoholic."}
    weekly_reset_day:
      expr: _.weekly_reset_day.argmax(_.scan_t)
      description: "The account's weekly reset day, 0 Sunday .. 6 Saturday (Altoholic's Agenda options)."
      metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: weekday,
                 caveats: "Altoholic only, and only once a lockout was saved: NULL before (install Altoholic)."}

cross_model_metrics:
  kills_per_combat_hour:
    expr: kills / (combat_s / 3600)
    description: "Kills per hour in combat: kills (records) over combat_s (timeline)."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: kills/hour,
               caveats: "Combat time includes fights that ended in no kill (fleeing, dying, a tapped mob). NULL without combat time.",
               eligibility: {where: {records: "_.session_id.notnull()", timeline: "_.session_id.notnull()"},
                 means: "Inside a login span the Recorder saw, on both sides."}}
  deaths_per_online_hour:
    expr: deaths / (online_s / 3600)
    description: "Deaths per online hour: deaths (records) over online_s (timeline)."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: deaths/hour,
               caveats: "Online time includes AFK; filter or compare with active_s.",
               eligibility: {where: {records: "_.session_id.notnull()", timeline: "_.session_id.notnull()"},
                 means: "Inside a login span the Recorder saw, on both sides."}}
  xp_per_zone_hour:
    expr: xp_gained / (zone_s / 3600)
    description: "XP an hour in a zone: xp_gained (the XP bar's readings) over zone_s (the zone records' time)."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: xp/hour,
               caveats: "An XP reading carries the zone or subzone text the game shows, a zone record the zone: XP read under a subzone's name has no zone time and reads NULL there. Group by zone (or session_id, time). NULL without zone time.",
               eligibility: {where: {xp: "_.xp_gained.notnull()", zone_time: "_.dur_s > 0"},
                 means: "XP readings with a change, and zone records with time: both sides only count what was measured."}}
  quest_xp_per_played_hour:
    expr: quest_xp / (played_s / 3600)
    description: "XP from quest hand-ins per played hour in the level: quest_xp (records) over played_s (levels)."
    dimensions: [level, character, class]
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, level_completion], evidence_basis: observed, unit: xp/hour,
               caveats: "Levels only share level, character, class and time with records: group by one of those. Whole splits only, on both sides.",
               eligibility: {where: {records: "_.level_whole == 1", levels: "(_.played_s > 0) & (_.partial == 0)"},
                 means: "Levels with a whole split: the quest XP of those levels over their played time. The level in play and a partial split stay out of both sides."}}

  kill_xp_per_online_hour:
    expr: kill_xp / (online_s / 3600)
    description: "XP from kills per online hour: kill_xp (records) over online_s (timeline). Group by level and zone for where grinding paid."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: xp/hour,
               caveats: "Every online hour of the group, questing and travel included, so the three source rates add up to the XP the records name per hour. Read kills_without_xp beside it: above 0, the kill side undercounts. NULL without online time (the Recorder off).",
               eligibility: {where: {records: "_.session_id.notnull()", timeline: "_.session_id.notnull()"},
                 means: "Inside a login span the Recorder saw, on both sides."}}
  quest_xp_per_online_hour:
    expr: quest_xp / (online_s / 3600)
    description: "XP from quest hand-ins per online hour: quest_xp (records) over online_s (timeline)."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: xp/hour,
               caveats: "Online time, not played time: quest_xp_per_played_hour is the level split's version. A quest pays where it is handed in, so a zone of hand-ins reads high and the zone of its kills low. NULL without online time.",
               eligibility: {where: {records: "_.session_id.notnull()", timeline: "_.session_id.notnull()"},
                 means: "Inside a login span the Recorder saw, on both sides."}}
  explore_xp_per_online_hour:
    expr: explore_xp / (online_s / 3600)
    description: "XP from discovering places per online hour: explore_xp (records) over online_s (timeline)."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: xp/hour,
               caveats: "Small beside kills and quests; high in a zone crossed for the first time. NULL without online time.",
               eligibility: {where: {records: "_.session_id.notnull()", timeline: "_.session_id.notnull()"},
                 means: "Inside a login span the Recorder saw, on both sides."}}
  xp_per_active_hour:
    expr: xp_gained / (active_s / 3600)
    description: "XP per hour with the AFK flag off: xp_gained (the XP bar's readings) over active_s (timeline)."
    dimensions: [level, session_id, hour, guide, step, character, class, week, time]
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: reconstructed, unit: xp/hour,
               caveats: "Not by zone: an XP reading carries the subzone text where the timeline has the zone (kill_xp_per_online_hour and its two siblings are by zone). The game sets AFK after 5 idle minutes, so those minutes count as active. NULL without active time.",
               eligibility: {where: {xp: "_.session_id.notnull() & _.xp_gained.notnull()", timeline: "_.session_id.notnull()"},
                 means: "XP readings with a change and online intervals, both inside a login span the Recorder saw."}}
  dungeon_vs_quest_xp_ratio:
    expr: (trip_xp / trip_s) / (quest_xp / played_s)
    description: "A dungeon trip's XP per hour over questing's at the same level: trip_xp per trip_s (dungeon_trips) over quest_xp per played_s (records, levels). 2.0: the trips paid twice the hand-ins' rate."
    dimensions: [level, character, class]
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [interval_start, event, level_completion], evidence_basis: reconstructed, unit: ratio,
               caveats: "Group by level: trips by their start level, quests by the level split. The quest side is every hand-in of the level (the trips' own included) over its whole played time (the trips' too), as quest_xp_per_played_hour reads it. NULL at a level without a trip or without a whole split: then Polestar's dungeon floor is the guide, not this.",
               eligibility: {where: {dungeon_trips: "_.online_s > 0", records: "_.level_whole == 1", levels: "(_.played_s > 0) & (_.partial == 0)"},
                 means: "Trips with online time, against the levels with a whole split: their quest XP over their played time."}}
  runs_per_online_hour:
    expr: run_count / (online_s / 3600)
    description: "Dungeon runs per online hour: run_count (dungeon_runs) over online_s (timeline). By dungeon: runs per hour spent inside it, the farm's pace."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [interval_start, interval_start], evidence_basis: reconstructed, unit: runs/hour,
               caveats: "Grouped by dungeon, the hours are the ones inside it (the walk in and out is not); otherwise every online hour of the group. Its loot's worth isn't here: only the items (trip_loot). NULL without online time.",
               eligibility: {where: {dungeon_runs: "_.start_t.notnull()", timeline: "_.session_id.notnull()"},
                 means: "Every run Polestar timed, against the online time inside a login span the Recorder saw."}}
  loot_value_per_online_hour:
    expr: loot_vendor_copper / (online_s / 3600)
    description: "What the loot would fetch at a vendor per online hour: loot_vendor_copper (loot_value) over online_s (timeline), copper an hour. Group by zone or level for where farming pays."
    metadata: {kind: ratio, aggregation: ratio_of_sums, time_meaning: [event, interval_start], evidence_basis: estimated, unit: copper/hour,
               caveats: "Vendor value only, said so: the player's own auction prices stay out of the analysis, so an item worth more at the auction house reads low. Coin looted is in gold_per_online_hour, not here. NULL without online time or without an item with a known price (no Recorder: /psrec on, then /reload).",
               eligibility: {where: {loot_value: "_.session_id.notnull()", timeline: "_.session_id.notnull()"},
                 means: "Loot and online time inside a login span the Recorder saw, on both sides."}}

# Views per grain (owner, 2026-11-22: "use the semantic model all the time"):
# one DuckDB view per entity, made by compiling the metrics above at that grain
# (semantic.py, view_sql), never written by hand. Each model aggregates to the
# entity, the parts join on it, so a view has one row per key: no fan-out.
# `entity` is the grain, `metrics` its columns (each also asked on its own by
# query_metric with group_by [entity]: tests/invariants/test_views.py
# checks they agree), `dimensions` columns that hold one value per key in the
# models that have them (joined on the entity only), `where` keeps the rows
# with a key. A metric that can't be grouped by the entity is refused when
# the catalogue is built: left out, never faked. play_sql and the judge read
# them by name; list_metrics lists them with their columns.
views:
  per_level:
    entity: level
    description: "One row per level: time played, wall clock and the longest silence, how much of it the Recorder saw, active and AFK time, deaths, the route plan against the play, quests, XP by source (kills, quests, discoveries), dungeon trips against questing, gold and its rate, the money at the level's end, loot, gear changes, and the rested XP the kills used."
    dimensions: [partial, ding_t]
    where: [{dimension: level, op: is not null}]
    metrics: [played_s, calendar_s, offline_s, longest_gap_s, longest_gap_from, longest_gap_to, recorder_missed_s,
              recorder_coverage, online_s, active_s, afk_s, afk_share, deaths, deaths_per_online_hour, planned_s,
              class_planned_s, vs_route, split_quests, quests_done, xp_gained, kill_xp, quest_xp, explore_xp,
              kills_without_xp, dungeon_vs_quest_xp_ratio, ride_s,
              gold_moved_copper, gold_delta_copper, gold_changes, gold_move_online_s, gold_per_online_hour, money_copper,
              looted_items, gear_changes, rested_used_xp, rested_kill_xp, rested_per_kill_xp]
  per_session:
    entity: session_id
    description: "One row per login span: when it began and ended, its length and XP, online, active, AFK, combat, dungeon, dead, flight and ride time, XP per active hour, kills, deaths, quests, the zone records' time, guide steps, skips, flights and the yards covered."
    dimensions: [weekday, start_hour, start_t, end_t, level_start, level_end]
    where: [{dimension: session_id, op: is not null}]
    metrics: [session_s, session_xp, xp_per_session_hour, online_s, active_s, afk_s, afk_share, combat_s, combat_share,
              dungeon_s, dead_s, taxi_s, ride_s, xp_per_active_hour, kills, deaths, quests_done, quests_accepted,
              deaths_per_online_hour, kills_per_combat_hour, xp_gained, zone_s, guide_steps, steps_skipped, flights,
              distance_yd]
  per_zone:
    entity: zone
    description: "One row per zone the Recorder saw: online, combat, dungeon, dead, flight and ride time, kills (those that paid nothing apart), deaths, quests, XP by source and each source's XP per online hour, rides boarded, the zone records' own time and visits, and the XP bar's gain there."
    where: [{dimension: zone, op: is not null}]
    metrics: [online_s, active_s, combat_s, combat_share, dungeon_s, dead_s, taxi_s, ride_s, kills, zero_xp_kills,
              deaths, quests_done, kill_xp, quest_xp, explore_xp, kill_xp_per_online_hour, quest_xp_per_online_hour,
              explore_xp_per_online_hour, deaths_per_online_hour, kills_per_combat_hour, rides, zone_s, zone_visits,
              xp_gained, xp_per_zone_hour]
  per_dungeon:
    entity: dungeon
    description: "One row per dungeon: runs and their time and XP inside, runs per hour inside (the farm's pace), trips with the travel around them and their XP an hour."
    where: [{dimension: dungeon, op: is not null}]
    metrics: [run_count, run_s, run_xp, run_xp_per_hour, runs_per_online_hour, trip_count, trip_s, trip_travel_s, trip_xp,
              trip_xp_per_hour, trip_inside_share]
  per_trip:
    entity: trip
    description: "One row per dungeon trip: when, at what level, its time phase by phase (pickup, travel there, inside, travel back, hand-in), its XP inside and from its quests, and what its run looted."
    dimensions: [dungeon, level, trip_start, trip_end, trip_loot]
    where: [{dimension: trip, op: is not null}]
    metrics: [trip_s, trip_pickup_s, trip_travel_to_s, trip_inside_s, trip_travel_back_s, trip_handin_s, trip_xp_inside,
              trip_xp_quests, trip_quests_handed_in, trip_quest_money_copper]
  per_guide:
    entity: guide
    description: "One row per Polestar guide: time and XP while it was up, Polestar's steps (done, skipped, jumped, picks, its own step timer), skill-ups, first and last record."
    where: [{dimension: guide, op: is not null}]
    metrics: [online_s, active_s, xp_gained, steps_done, step_s, steps_skipped, steps_jumped, step_picks, skill_ups,
              first_record_t, last_record_t]
  per_quest:
    entity: quest_id
    description: "One row per quest id: times in the log, shared and open time, XP, first accept and last objectives done."
    where: [{dimension: quest_id, op: is not null}]
    metrics: [quest_count, quest_s, quest_open_s, quest_reward_xp, quest_accepted_t, quest_complete_t]
  per_death:
    entity: death_t
    description: "One row per death the Recorder saw: where, at what level, and the likely killer Polestar_Recorder picked (its NPC id and level), with the level gap to it."
    dimensions: [zone, level, npc_id, npc_level]
    where: [{dimension: death_t, op: is not null}]
    metrics: [deaths, level_gap_max]
  per_week:
    entity: week
    description: "One row per week (local time, from Monday): online, active and AFK time, login spans, the XP bar's gain and XP by source, kills, deaths, quests, dungeon runs, loot, the purse's moves and gains, gear changes and the yards covered. A source that sent nothing that week leaves its columns NULL."
    where: [{dimension: week, op: is not null}]
    metrics: [online_s, active_s, afk_share, session_count, session_s, xp_gained, kill_xp, quest_xp, explore_xp, kills,
              deaths, quests_done, run_count, looted_items, gold_moved_copper, gold_earned_copper, gear_changes,
              distance_yd]
  per_slot:
    entity: slot
    description: "One row per gear slot, for the spec the gear is scored for: the worn item and its fit, the best upgrade wearable now, and the two percents the page says as 'NN% → NN%' (upgrade_bis_pct_worn → best_upgrade_bis_pct)."
    dimensions: [scored_for]
    where: [{dimension: slot, op: is not null}]
    metrics: [worn_items, worn_item, worn_item_id, worn_fit, worn_item_bis_pct, best_upgrade, best_upgrade_id,
              best_upgrade_gain, best_upgrade_bis_pct, upgrade_bis_pct_worn, upgrade_sources]
  per_faction:
    entity: faction_id
    description: "One row per faction the Recorder saw change: the changes, the points gained, where it stands now and how far the next tier is, the pace per online hour and the online time to the next tier at that pace."
    where: [{dimension: faction_id, op: is not null}]
    metrics: [rep_changes, rep_gained, rep_standing_now, rep_reaction_now, rep_to_next_points, rep_online_s,
              rep_per_online_hour, rep_to_next_s]
  per_flight_node:
    entity: node_id
    description: "One row per flight path the flight map listed: known on the newest map or not, when first listed, maps opened there and flights from and to it."
    where: [{dimension: node_id, op: is not null}]
    metrics: [known_flight_nodes, node_first_known_t, flight_maps_opened, node_flights_from, node_flights_to]
  per_quest_giver:
    entity: npc_id
    description: "One row per quest giver whose window the character opened: where it stands, the windows, the quests it offered, the ones never taken and the ones it held back (a prerequisite, level or side missing)."
    where: [{dimension: npc_id, op: is not null}]
    metrics: [giver_zone, giver_windows, quests_offered, quests_skipped, quests_held_back]

# Store models (owner, 2026-11-22: every tool reads through the semantic
# layer). What a tool reads from the store itself, not the prep: other
# players, the player's own price scans, the talent changes, the groups in a
# dungeon run. Each declares the `columns` of the relation its tool fetches
# for one answer; semantic.py `read` loads those rows into an in-memory
# DuckDB for that call only and compiles the question as query_metric does,
# contract included. Read only: nothing is copied or kept, the store's own
# retention holds (Battle.net's talent readings stay its 30 days, read live).
# list_metrics lists them; query_metric doesn't read them (no prep holds
# their rows).
store_models:
  players:
    table: sem_players
    description: "Other players Polestar saw (update.probed, feed wow-player): one row per player, context and day, with that day's sightings and the player's last known level, class, race and zones."
    columns: {player: TEXT, context: TEXT, day: TEXT, sightings: INTEGER, last_seen: TEXT, level: REAL,
              classes: TEXT, races: TEXT, zones: TEXT}
    dimensions:
      player: {expr: _.player, description: "The other player's name."}
      context: {expr: _.context, description: "Where Polestar saw them: seen, grouped, dungeon, quest-nearby..."}
      day: {expr: _.day, description: "The day of the sightings, YYYY-MM-DD (UTC)."}
      classes: {expr: _.classes, description: "The classes seen for the player, a JSON list (up to 3)."}
      races: {expr: _.races, description: "The races seen for the player, a JSON list (up to 3)."}
      zones: {expr: _.zones, description: "The zones the player was seen in, a JSON list."}
    measures:
      player_sightings:
        expr: _.sightings.sum()
        description: "Sightings: the update.probed saves that listed the player, summed."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: sightings,
                   caveats: "Polestar saves its list on logout and /reload: a long evening with one player counts once."}
      player_grouped_sightings:
        expr: _.sightings.sum(where=(_.context == 'grouped') | (_.context == 'dungeon'))
        description: "Sightings in a group or a dungeon (contexts grouped and dungeon)."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: sightings,
                   caveats: "NULL when never grouped."}
      player_days:
        expr: _.day.nunique()
        description: "Days the player was seen."
        metadata: {kind: simple, aggregation: count_distinct, time_meaning: event, evidence_basis: observed, unit: days,
                   caveats: "Not additive across players: two players on one day are one day each."}
      player_group_days:
        expr: _.day.nunique(where=(_.context == 'grouped') | (_.context == 'dungeon'))
        description: "Days the player was seen in a group or a dungeon."
        metadata: {kind: simple, aggregation: count_distinct, time_meaning: event, evidence_basis: observed, unit: days,
                   caveats: "0 when never grouped."}
      player_last_seen:
        expr: _.last_seen.max()
        description: "When the player was last seen, UTC ISO time."
        metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: time,
                   caveats: "The newest save that listed them, whatever the context."}
      player_level:
        expr: _.level.max()
        description: "The highest level the saves gave the player."
        metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: level,
                   caveats: "Polestar names most players without a level: NULL then."}

  prices:
    table: sem_prices
    description: "The player's own Auctionator scans (feed wow-prices): one row per item and scan day, its newest revision, with the day's lowest buyout per unit. Nothing from Blizzard's API."
    columns: {item_key: TEXT, item: TEXT, item_id: INTEGER, t: REAL, price_copper: INTEGER, price_high_copper: INTEGER}
    dimensions:
      item_key: {expr: _.item_key, description: "The item: its id, else Auctionator's own key."}
      item_id: {expr: _.item_id, description: "Item id (its Wowhead page: item=<id>), NULL for a key Auctionator alone knows."}
    measures:
      price_scan_days:
        expr: _.t.count()
        description: "Scan days: one per item and day the player scanned it."
        metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: days,
                   caveats: "Only the days the player opened the auction house with Auctionator."}
      price_item:
        expr: _.item.argmax(_.t)
        description: "The item's name on its newest scan."
        metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: name,
                   caveats: "NULL when the scan didn't name it."}
      price_latest_copper:
        expr: _.price_copper.argmax(_.t)
        description: "The lowest buyout per unit on the newest scan day, copper."
        metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "What was listed that day, not what sold: an auction lasts 24 h at most."}
      price_latest_high_copper:
        expr: _.price_high_copper.argmax(_.t)
        description: "The highest buyout per unit on the newest scan day, copper."
        metadata: {kind: simple, aggregation: latest, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "NULL when the scan kept only the lowest."}
      price_latest_t:
        expr: _.t.max()
        description: "The newest scan day's time, Unix seconds."
        metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: observed, unit: unix seconds,
                   caveats: "A day's scans count at the day's newest revision."}
      price_min_copper:
        expr: _.price_copper.min()
        description: "The lowest of the days' lowest buyouts, copper."
        metadata: {kind: simple, aggregation: min, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "Over the scan days in the range only."}
      price_max_copper:
        expr: _.price_copper.max()
        description: "The highest of the days' lowest buyouts, copper."
        metadata: {kind: simple, aggregation: max, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "Over the scan days in the range only."}
      price_change_copper:
        expr: _.price_copper.argmax(_.t) - _.price_copper.argmin(_.t)
        description: "The lowest buyout on the newest scan day minus on the first, copper."
        metadata: {kind: derived, aggregation: endpoint_difference, time_meaning: snapshot_observation, evidence_basis: observed, unit: copper,
                   caveats: "Two days only, never a trend. NULL with one scan day: price_change_copper_evidence counts them.",
                   min_evidence: {count: "_.t.count()", at_least: 2, means: "two scan days"}}

  talent_changes:
    table: sem_talent_changes
    description: "The character's talent changes (wowstats.talents.history): one row per change between two saved builds, WoWSims Exporter's (every change) or Battle.net's daily reads (the last 3 weeks, read live, never kept). The trees and talents of each change are JSON lists."
    columns: {t: TEXT, date: TEXT, before: TEXT, after: TEXT, gained: TEXT, dropped: TEXT, ranks_gained: INTEGER,
              ranks_dropped: INTEGER}
    dimensions:
      change: {expr: _.t, description: "When the build with the change was saved or read, UTC ISO time."}
      date: {expr: _.date, description: "That day, YYYY-MM-DD."}
      before: {expr: _.before, description: "Points per tree before, a JSON list of {tree, points} in the frame's tab order."}
      after: {expr: _.after, description: "Points per tree after, the same shape."}
      gained: {expr: _.gained, description: "Talents gained or ranked up, a JSON list of {name, spell, from, to}."}
      dropped: {expr: _.dropped, description: "Talents dropped or ranked down, the same shape."}
    measures:
      talent_change_count:
        expr: _.t.count()
        description: "Changes: builds that differ from the one before."
        metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: changes,
                   caveats: "Battle.net reads once a day: two changes in a day are one."}
      talent_ranks_gained:
        expr: _.ranks_gained.sum()
        description: "Ranks gained: each gained talent's new rank minus its old one, summed."
        metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: ranks,
                   caveats: "A respec gains and drops at once: read it with talent_ranks_dropped."}
      talent_ranks_dropped:
        expr: _.ranks_dropped.sum()
        description: "Ranks dropped: each dropped talent's old rank minus its new one, summed."
        metadata: {kind: simple, aggregation: sum, time_meaning: snapshot_observation, evidence_basis: observed, unit: ranks,
                   caveats: "Read it with talent_ranks_gained."}

  run_groups:
    table: sem_run_groups
    description: "Each dungeon run (Polestar's instanceRuns, feed wow-dungeon) with the Recorder's group, encounter and death records that belong to it: the group record in force when it began and the ones inside. No names: no addon saves the party."
    columns: {run: TEXT, dungeon: TEXT, level: REAL, seconds: INTEGER, xp: INTEGER, kind: TEXT, size: INTEGER,
              success: TEXT}
    dimensions:
      run: {expr: _.run, description: "When the run began, UTC ISO time: one run."}
      dungeon: {expr: _.dungeon, description: "Dungeon name."}
      level: {expr: _.level, description: "Character level at the run."}
      seconds: {expr: _.seconds, description: "The run's length, seconds (Polestar's)."}
      xp: {expr: _.xp, description: "XP gained in the run (Polestar's)."}
    measures:
      run_party_size:
        expr: _.size.max(where=_.kind == 'group')
        description: "The largest party during the run."
        metadata: {kind: simple, aggregation: max, time_meaning: event, evidence_basis: observed, unit: players,
                   caveats: "NULL without a group record before or inside it (the Recorder off)."}
      run_bosses:
        expr: _.kind.count(where=(_.kind == 'encounter') & ((_.success == 'true') | (_.success == '1')))
        description: "Boss fights won in the run."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: bosses,
                   caveats: "Encounter records only: a boss the game doesn't flag as one isn't counted."}
      run_wipes:
        expr: _.kind.count(where=(_.kind == 'encounter') & ((_.success == 'false') | (_.success == '0')))
        description: "Boss fights lost in the run."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: wipes,
                   caveats: "Encounter records only."}
      run_deaths:
        expr: _.kind.count(where=_.kind == 'death')
        description: "The character's deaths in the run."
        metadata: {kind: simple, aggregation: sum, time_meaning: event, evidence_basis: observed, unit: deaths,
                   caveats: "The character's own, not the party's."}
