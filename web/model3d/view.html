<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--policy-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>In 3D</title>
<!-- The page around the 3D viewer (m3d/, a port of wow.export's renderer),
     in a sandboxed frame of the page (opaque origin, no network:
     wowstats/model3d.py VIEW_POLICY). A template: wowstats.model3d.view_page
     inlines view.css, the viewer and view.js here and puts the policy, with
     their hashes, in the <meta> above. -->
<!--inline:view.css-->
</head>
<body>
<canvas id="stage" class="stage" aria-label="The character in 3D: drag to turn it"></canvas>
<canvas id="effects" aria-hidden="true"></canvas>
<div id="actions" role="group" aria-label="Character actions" hidden></div>
<label id="companion-control" hidden><input type="checkbox" id="companion" checked> <span>Show pet</span></label>
<p id="status" class="status">Dressing the model</p>
<!--inline:view.js-->
</body>
</html>
