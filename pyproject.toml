[project]
name = "wow-stats"
version = "0.7.0"
description = "A WoW Forever leveling log: the shipper's events in a web page, with a public view for friends"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
# Runtime: the standard library, plus the semantic layer. The page's numbers
# have one computation path (owner, 2026-11-22: "use the semantic model all
# the time", wowstats/analysis/pages.py), so DuckDB (it runs the metrics'
# SQL on a locked-down in-memory copy of the prep: wowstats/analysis/duck.py)
# and the Boring Semantic Layer (MIT, on ibis and sqlglot: it compiles the
# metric catalogue, wowstats/analysis/semantic.yaml, to DuckDB SQL; only
# compiled, no ibis backend, so no pandas or pyarrow:
# docs/reference/semantic-layer.md) are core. The shipper is a standalone
# script on the standard library (shipper/wow_stats.py) and never installs
# this package; the renderer image leaves the two out (Dockerfile). Other
# additions are extras: `wow-stats publish` seals the full-content site with
# AES-256-GCM, which the standard library doesn't have (pyca/cryptography,
# well known; no hand-made crypto), and the MCP endpoint runs on FastMCP
# (`mcp`).
dependencies = ["duckdb==2.0.0", "boring-semantic-layer==0.3.19"]

[project.urls]
# wowstats.SOURCE_URL says the same (tests/test_license.py).
Source = "https://github.com/sam-dumont/wow-mcp"

[project.optional-dependencies]
publish = ["cryptography>=46"]
# The MCP endpoint (wowstats.mcp.server): FastMCP's OAuth proxy and its HTTP
# transport.
# Without it the full view runs without /mcp. FASTMCP_CHECK_FOR_UPDATES=off is
# set by the server itself: no call home. DuckDB and the semantic layer the
# analysis' queries run on (play_sql, the judge, query_metric) are core.
mcp = ["fastmcp==4.2.0", "cryptography>=46"]
# `wow-stats render` (wowstats.renderer): a past level's picture, drawn by the
# 3D view's own viewer in a headless Chromium. Its own image target
# (Dockerfile `renderer`), never in the main image. Pinned like the browser
# group: each Playwright release wants its own Chromium build.
render = ["playwright==1.65.2"]
# The server's own play analysis (wowstats.analysis.auto): the full view
# plays the MCP client itself, through the provider the host configures
# (ANALYSIS_PROVIDER). One extra per provider; only the configured one is
# imported. Without it, or without credentials, the feature is off.
# analysis: Anthropic's official SDK (pinned like the kb group's).
analysis = ["anthropic==2.8.0"]
# analysis-openai: OpenAI's official SDK, for any OpenAI-compatible Chat
# Completions endpoint (OpenAI, OpenRouter, Ollama, vLLM, LM Studio...).
analysis-openai = ["openai==3.51.0"]

[project.scripts]
wow-stats = "wowstats.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "time-machine>=2.16",
]
# tests/test_browser.py: the static sites in Chromium. Pinned: each
# Playwright release wants its own browser build.
browser = [
    "playwright==1.65.2",
]
# tools/audit_deps.py: known vulnerabilities in the locked dependencies (CI's
# audit job). Its own group, so `uv sync` never installs it.
audit = [
    "pip-audit>=2.10.1",
]
# tools/kb/refresh.py and meta.py's model pass (.github/workflows/kb-refresh.yaml):
# locked with hashes like everything else, never resolved at run time.
kb = [
    "anthropic==2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wowstats"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "wowstats/web"
# Polestar's route times (GPL-3.0, docs/route-reference.md), read by wowstats/mcp/route.py.
"data/route-reference.json" = "wowstats/data/route-reference.json"
# Polestar's gear data (GPL-3.0, with MIT parts: docs/gear-reference.md), read by wowstats/gear.py.
"data/gear-reference.json" = "wowstats/data/gear-reference.json"
# The analysis' knowledge base (wowstats/analysis/__init__.py): Polestar's game data and notes (GPL-3.0), and short
# notes written from open sources, each with its source; read by wowstats/analysis/kb.py.
"data/kb-reference.json.gz" = "wowstats/data/kb-reference.json.gz"
"data/kb" = "wowstats/data/kb"
# Forever's quest names and instances (forever-db GPL-3.0, client tables as facts: docs/forever-reference.md),
# read by wowstats/forever.py.
"data/forever-reference.json" = "wowstats/data/forever-reference.json"
# Who trains each profession rank and riding, where, and the price the guides give (Polestar GPL-3.0:
# tools/trainers/export.py), read by wowstats/trainers.py.
"data/trainers-reference.json" = "wowstats/data/trainers-reference.json"
# The class trainers, what they teach per level and Forever's talent names (Polestar GPL-3.0, client tables:
# tools/class_reference/export.py), read by wowstats/classguide.py.
"data/class-reference.json" = "wowstats/data/class-reference.json"
# WoWDBDefs' definitions of the client tables the 3D view reads, trimmed to Forever's builds (CC BY-SA 4.0,
# THIRD_PARTY.md: tools/model3d_dbd.py), read by wowstats/db2.py.
"data/dbd" = "wowstats/data/dbd"
# WoWSims Exporter's talent order per class (MIT, THIRD_PARTY.md: tools/wowsims_talents.py), read by
# wowstats/wowsims.py to read the addon's saved talent string.
"data/wowsims-talents.json" = "wowstats/data/wowsims-talents.json"
# The geosets each Battle.net look choice shows, for the options Forever's tables lack (client tables as facts,
# THIRD_PARTY.md: tools/battlenet_look/export.py), read by wowstats/character3d.py.
"data/battlenet-look.json" = "wowstats/data/battlenet-look.json"
# Several people (wowstats.account): the welcome manual (also the videos' captions) and the shipper the
# one-line installer carries.
"docs/videos/steps.json" = "wowstats/data/start-steps.json"
"docs/videos/media" = "wowstats/data/start-media"
"shipper/wow_stats.py" = "wowstats/data/shipper/wow_stats.py"
"shipper/install-mac.sh" = "wowstats/data/shipper/install-mac.sh"
"shipper/install-windows.ps1" = "wowstats/data/shipper/install-windows.ps1"
"shipper/wow-stats.plist" = "wowstats/data/shipper/wow-stats.plist"
"shipper/config.example.toml" = "wowstats/data/shipper/config.example.toml"
# The release signature of the files above (tools/release/shipper_sign.py), served in the update manifest.
"shipper/update-signature.json" = "wowstats/data/shipper/update-signature.json"
# The MIT notices that come with the gear data travel with it.
"THIRD_PARTY.md" = "wowstats/data/THIRD_PARTY.md"
# The program's own license, which the one-line installers put next to the shipper (wowstats.account).
"LICENSE" = "wowstats/data/LICENSE"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "B023"]

[tool.ruff.lint.per-file-ignores]
# The shipper is a script with long data lines; tests hold fixtures.
"shipper/wow_stats.py" = ["E501", "E731", "SIM105", "SIM115"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the fast one: no browsers (the slow part, run once before a
# release: `make test-browser`) and nothing CI-only. A later `-m` on the command
# line replaces this. Parallelism is the Makefile's `-n`, so a debugger can still
# run one process.
addopts = "-m 'not browser and not ci_only'"
markers = [
    "browser: drives Chromium/WebKit through Playwright (files named *browser*; tests/conftest.py)",
    "ci_only: needs docker compose, a Polestar checkout or Windows; CI and releases run it (tests/conftest.py)",
    "real_home: reads the machine's own HOME (the shipper's HOME is a temp dir otherwise; tests/conftest.py)",
]
